title = "TJRHQ gitleaks config"

# Extend gitleaks' built-in default ruleset rather than replacing it.
[extend]
useDefault = true

[[allowlists]]
description = "Paths that legitimately contain high-entropy strings that are not secrets"
paths = [
  # detect-secrets' baseline stores SHA1 hashes of the strings it flagged,
  # not the strings themselves — those 40-char hex digests otherwise trip
  # gitleaks' generic-api-key rule on every entry in the file.
  '''(^|/)\.secrets\.baseline$''',
  # Lockfiles are full of content-integrity hashes (sha512-... etc.), not
  # credentials.
  '''(^|/)package-lock\.json$''',
  '''(^|/)yarn\.lock$''',
  '''\.lock$''',
  # 2026-09-15: auto-generated per-cycle self-improvement evidence dumps
  # (git commit SHAs, timestamp-based directory names) — same
  # high-entropy-but-not-a-secret class as the baseline/lockfiles above.
  # At 451 files / 494MB in one commit this made gitleaks take ~12min on
  # a single commit; see .pre-commit-config.yaml's detect-secrets exclude
  # for the matching, much larger (45min+) slowdown that hook hit from
  # the same path.
  '''(^|/)data/self-improvement/runs/.*/evidence\.json$''',
]

# 2026-11-02: lcars-portal snapshot contract test pins the frozen v1.0 fixture
# files by SHA-256 (FROZEN_SHA256 map). Those 64-char hex digests are content
# hashes, not credentials, but trip generic-api-key. Scoped to that one rule and
# that one file so any other rule firing in the same file still blocks.
[[allowlists]]
description = "snapshot.test.ts frozen fixture SHA-256 digests"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)lcars-portal/src/app/api/integrations/tjr-life/v1/snapshot/snapshot\.test\.ts$''',
]
