# REVS Content Creation Agents - Configuration Template

# System Configuration
system:
  name: REVS Content Agents
  version: 1.0.0
  environment: development  # development | staging | production

# LLM Configuration
llm:
  provider: ollama
  model: mistral:7b  # mistral:7b | llama2:13b
  base_url: http://localhost:11434
  temperature: 0.7
  max_tokens: 4000
  timeout: 300

# Image Generation
images:
  provider: stable_diffusion  # stable_diffusion | replicate_api
  model: sd-v1-5-pruned
  guidance_scale: 7.5
  num_inference_steps: 30
  use_gpu: false  # Set to true if NVIDIA GPU available

# Text-to-Speech
tts:
  provider: coqui  # coqui | azure | google
  language: en
  voice_type: professional  # professional | friendly | formal
  sample_rate: 22050

# Video Generation
video:
  fps: 30
  resolution: 1080p  # 720p | 1080p | 4k
  codec: libx264

# Output Configuration
output:
  base_dir: ./outputs
  formats:
    - poster
    - article
    - video
    - worksheet
    - presentation
    - podcast
    - social
  preserve_intermediate: false

# Processing Configuration
processing:
  max_workers: 6
  batch_size: 1
  timeout_per_agent: 600
  retry_attempts: 3
  retry_delay: 5

# Logging
logging:
  level: INFO  # DEBUG | INFO | WARNING | ERROR
  file: ./logs/app.log
  console: true
  format: json  # json | text

# Storage
storage:
  type: local  # local | s3 | gcs
  cache_enabled: true
  cache_ttl: 3600

# Brand Configuration
branding:
  primary_color: "#0052CC"
  secondary_color: "#FF9800"
  accent_color: "#4CAF50"
  background_color: "#FAFBFC"
  font_family: sans-serif
  logo_path: ./assets/logo.png

# API Configuration (optional)
api:
  enabled: false
  host: 0.0.0.0
  port: 8000
  debug: false

# Development
development:
  debug: false
  skip_cache: false
  dry_run: false
