# Self-Improvement System Policy Configuration
# This file defines:
# - which finding types can auto-remediate
# - what evidence is required for each type
# - what actions are permitted to run automatically
# - risk assessment rules

version: "1.0.0"
last_updated: "2026-07-12"

# ── Finding Category Policy ───────────────────────────────────────────

categories:
  doc_drift:
    description: "Documentation references deleted code or code without docs"
    default_severity: "low"
    evidence_required: "conclusive"  # must prove the reference is broken
    automation_eligibility: "auto_with_verification"
    allowed_actions:
      - "update_documentation"
      - "remove_dead_references"
    forbidden_actions:
      - "delete_code"
      - "modify_implementation"

  duplicate_implementation:
    description: "More than one file/service doing the same job"
    default_severity: "medium"
    evidence_required: "strong"
    automation_eligibility: "needs_signoff"
    allowed_actions: []  # always needs human decision
    reason: "Consolidation decisions require architectural judgment"

  placeholder_code:
    description: "TODO, FIXME, hardcoded data, stubs in production paths"
    default_severity: "medium"
    evidence_required: "strong"
    automation_eligibility: "needs_signoff"
    allowed_actions: []  # never auto-remove/replace logic
    reason: "Removing/replacing logic is never auto-safe"

  dead_code:
    description: "Unreferenced files, functions with no callers"
    default_severity: "low"
    evidence_required: "conclusive"  # must prove zero references
    automation_eligibility: "auto_with_verification"
    allowed_actions:
      - "delete_file"
      - "remove_function"
    forbidden_actions:
      - "modify_implementation"  # don't change it, just remove it

  missing_test:
    description: "New logic without test coverage; disabled tests"
    default_severity: "medium"
    evidence_required: "strong"
    automation_eligibility: "needs_signoff"
    allowed_actions: []  # test structure needs review
    reason: "Adding tests requires scope/approach review"

  config_drift:
    description: "Hardcoded constants, naming divergence between config and code"
    default_severity: "low"
    evidence_required: "moderate"
    automation_eligibility: "needs_signoff"
    allowed_actions: []  # drift could be intentional
    reason: "Config changes can have unintended consequences"

  stale_adr:
    description: "ADR marked Proposed long after code shipped; Accepted but implementation changed"
    default_severity: "low"
    evidence_required: "moderate"
    automation_eligibility: "needs_signoff"
    allowed_actions:
      - "update_adr_status"
    forbidden_actions:
      - "delete_adr"
    reason: "History preservation; status updates need verification"

  observability_gap:
    description: "New service/route without status endpoint or logging"
    default_severity: "medium"
    evidence_required: "strong"
    automation_eligibility: "needs_signoff"
    allowed_actions: []  # adding observability to running services needs care
    reason: "Changes to running services require verification"

  security_gap:
    description: "Detected security concerns"
    default_severity: "high"
    evidence_required: "strong"
    automation_eligibility: "needs_signoff"
    allowed_actions: []  # never auto-remediate security
    reason: "Security fixes require expert review"

  resilience_gap:
    description: "Missing error handling, retry logic, or fallbacks"
    default_severity: "medium"
    evidence_required: "moderate"
    automation_eligibility: "needs_signoff"
    allowed_actions: []  # resilience changes can affect behavior
    reason: "Resilience patterns require architectural review"

  router_bypass:
    description: "Code calling Ollama or cloud provider directly instead of Model Router"
    default_severity: "high"
    evidence_required: "conclusive"  # pattern match is definitive
    automation_eligibility: "needs_signoff"
    allowed_actions: []  # architectural violation
    reason: "Router bypasses must be corrected by design review"

  route_policy_drift:
    description: "Declared routes not used, used routes not declared, or undocumented routes"
    default_severity: "medium"
    evidence_required: "strong"
    automation_eligibility: "needs_signoff"
    allowed_actions:
      - "add_route_declaration"
      - "remove_unused_route"
    forbidden_actions:
      - "modify_route_behavior"

  silent_fallback:
    description: "Fallback that doesn't expose requested vs actual model or crosses trust boundaries"
    default_severity: "high"
    evidence_required: "strong"
    automation_eligibility: "needs_signoff"
    allowed_actions: []  # fallback behavior requires expert review
    reason: "Silent data classification boundary changes require security review"

  model_catalogue_drift:
    description: "Mismatch between configured, installed, preferred, and observed models"
    default_severity: "medium"
    evidence_required: "strong"
    automation_eligibility: "needs_signoff"
    allowed_actions:
      - "update_configuration"
    forbidden_actions:
      - "install_model"
      - "remove_model"
    reason: "Model installation/removal requires infrastructure planning"

  knowledge_health:
    description: "Stale or incomplete knowledge base; missing context"
    default_severity: "low"
    evidence_required: "moderate"
    automation_eligibility: "needs_signoff"
    allowed_actions:
      - "update_knowledge"
      - "refresh_cache"
    reason: "Knowledge updates can affect model behavior"

  performance_gap:
    description: "Detected performance regression or optimization opportunity"
    default_severity: "low"
    evidence_required: "moderate"
    automation_eligibility: "needs_signoff"
    allowed_actions: []  # performance changes need benchmarking
    reason: "Performance changes require validation against baselines"

  operational_failure:
    description: "Service degradation, error rate, or operational issue detected"
    default_severity: "high"
    evidence_required: "strong"
    automation_eligibility: "needs_signoff"
    allowed_actions: []  # operational issues require incident response
    reason: "Operational failures need manual triage"

  governance_violation:
    description: "Code or deployment violates stated principles, ADRs, or policies"
    default_severity: "high"
    evidence_required: "strong"
    automation_eligibility: "needs_signoff"
    allowed_actions: []  # governance violations need architectural review
    reason: "Governance fixes require policy review"

  automation_opportunity:
    description: "Opportunity to automate a manual process"
    default_severity: "info"
    evidence_required: "moderate"
    automation_eligibility: "needs_signoff"
    allowed_actions: []  # automation changes are speculative
    reason: "New automation requires design review and testing"

# ── Auto-Remediation Rules ────────────────────────────────────────

auto_remediation:
  enabled: true
  # Only findings matching ALL of these conditions will auto-remediate:
  requirements:
    - "evidence_strength >= conclusive OR evidence_strength >= strong"
    - "category is in auto_apply_categories"
    - "confidence >= 0.95"
    - "no related_findings that are pending"
    - "repository clean (no uncommitted changes)"
    - "no prior failures on this finding_id"

  # Categories that can auto-remediate with verification
  auto_apply_categories:
    - "doc_drift"
    - "dead_code"

  # Categories that can auto-remediate WITHOUT verification
  auto_apply_no_verify_categories: []

  # Actions that are permitted in auto-remediation
  allowed_actions:
    - "update_documentation"
    - "remove_dead_references"
    - "delete_file"
    - "remove_function"

  # Actions explicitly forbidden in auto-remediation
  forbidden_actions:
    - "delete_code"
    - "modify_implementation"
    - "change_authentication"
    - "change_permissions"
    - "modify_database"
    - "deploy_service"
    - "modify_routing"
    - "commit_to_repo"  # auto-remediation creates patches, doesn't commit
    - "push_to_remote"

# ── Risk Assessment ──────────────────────────────────────────────

risk_assessment:
  high_risk_indicators:
    - category: "router_bypass"
      reason: "Architectural violation"
    - category: "security_gap"
      reason: "Security exposure"
    - category: "governance_violation"
      reason: "Policy violation"
    - category: "silent_fallback"
      reason: "Data classification boundary change"
    - category: "operational_failure"
      reason: "Running service affected"
    - severity: "critical"
      reason: "Critical severity"
    - change_surface_files: 10+
      reason: "Large change surface"
    - reversibility: "irreversible"
      reason: "Cannot be reverted"

  medium_risk_indicators:
    - category: "placeholder_code"
      reason: "Production logic change"
    - category: "duplicate_implementation"
      reason: "Architectural decision"
    - category: "observability_gap"
      reason: "Running service affected"
    - severity: "high"
      reason: "High severity"
    - change_surface_files: 5+
      reason: "Moderate change surface"
    - reversibility: "difficult_to_reverse"
      reason: "Difficult to revert"

  low_risk_indicators:
    - category: "doc_drift"
      reason: "Documentation only"
    - category: "dead_code"
      reason: "No callers"
    - severity: "low"
      reason: "Low severity"
    - change_surface_files: 1
      reason: "Single file"
    - reversibility: "easily_reversible"
      reason: "Easily reverted"

# ── Model Router Integration ──────────────────────────────────────

model_router:
  url: "http://127.0.0.1:8891"
  task_types:
    self_improvement_analyse:
      model_hint: "large"
      timeout_seconds: 300
      description: "Analyse structured evidence → findings"
    self_improvement_critique:
      model_hint: "large"
      timeout_seconds: 300
      description: "Adversarial review of proposed changes"
    self_improvement_mission:
      model_hint: "large"
      timeout_seconds: 300
      description: "Convert finding to mission document"

# ── Thresholds ──────────────────────────────────────────────────

thresholds:
  min_confidence_for_finding: 0.7  # below this = more_evidence_required
  min_confidence_for_auto_remediate: 0.95
  max_findings_per_run: 100  # if exceeded, truncate and flag
  max_auto_remediations_per_run: 5  # safety limit
  evidence_window_days: 30  # look back this far by default

# ── Review Requirements ───────────────────────────────────────────

review:
  # Who must approve before auto-remediation
  required_approvers: "system_admin"  # or specific team/role

  # Generate review Markdown after every run
  generate_review_report: true

  # Store reviews in this location
  review_directory: "data/self-improvement/review"

# ── Logging and History ──────────────────────────────────────────

history:
  # Append-only log locations
  change_log_file: "data/self-improvement/change-log.jsonl"
  outcomes_log_file: "data/self-improvement/outcomes.jsonl"

  # Number of historic runs to keep in memory for trend analysis
  retention_runs: 52  # 1 year of weekly runs

  # Track repeat findings across runs
  track_repeats: true
  repeat_threshold_runs: 3  # flag if same finding in 3+ consecutive runs

# ── Scheduling ──────────────────────────────────────────────────

scheduling:
  # Cron-style (systemd timer)
  # Run twice weekly: Tuesday at 09:00, Friday at 09:00 UTC
  timer_spec: "Tue *-*-* 09:00:00 UTC
               Fri *-*-* 09:00:00 UTC"

  # Prevent overlapping runs
  lock_timeout_seconds: 3600

  # Log output
  log_file: "data/self-improvement/runs/scheduler.log"

# ── Safety Constraints ────────────────────────────────────────────

safety:
  # Fail closed: if any of these are true, STOP instead of guessing
  fail_closed_conditions:
    - "repository_dirty"
    - "model_router_unreachable"
    - "tests_failing"
    - "schema_validation_failed"
    - "unknown_change_type"
    - "evidence_missing"

  # Create backup before any auto-remediation
  backup_before_remediate: true

  # Rollback if verification fails
  rollback_on_verify_failure: true

  # Never auto-delete without explicit allow
  require_explicit_delete_approval: true
