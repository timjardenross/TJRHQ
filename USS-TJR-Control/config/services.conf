# USS TJR Control Deck Service Configuration
# Last updated: MSN-BOT-SOR — VPS path portability

# ---------------------------------------------------------------------------
# Paths
# REPO_ROOT auto-detects: VM uses /opt/starship-endeavour, Mac falls back to
# $HOME/Documents/GitHub/USSTJROS. Override by setting REPO_ROOT before
# sourcing this file, or by exporting it in the shell environment.
# ---------------------------------------------------------------------------
REPO_ROOT="${REPO_ROOT:-}"
if [ -z "$REPO_ROOT" ]; then
  if [ -d "/opt/starship-endeavour" ]; then
    REPO_ROOT="/opt/starship-endeavour"
  fi
  # If still unset, start-slack-bot.sh resolves it from the script's own location
fi
USSTJROS_ROOT="$REPO_ROOT"          # Required by Python advisory and intelligence services
SLACK_BOT_DIR="$REPO_ROOT/platform-runtime"
COMMANDER_DIR="$REPO_ROOT/platform-runtime"
PAPERCLIP_DIR="$HOME/.paperclip"
HEALTH_MONITOR_TOOL="btop"

# ---------------------------------------------------------------------------
# Ports
# ---------------------------------------------------------------------------
PAPERCLIP_PORT="3100"
NGROK_PORT="3100"

# ---------------------------------------------------------------------------
# Commands
# ---------------------------------------------------------------------------

# Slack Bot: activate venv, load .env, set PYTHONPATH, launch app.py
# Runs from SLACK_BOT_DIR.
SLACK_BOT_COMMAND="source .venv/bin/activate && set -a && source .env && set +a && PYTHONPATH=\"${REPO_ROOT}:${SLACK_BOT_DIR}:${PYTHONPATH:-}\" python app.py"

# Commander Bot: same codebase as Slack Bot (app.py) — commander.py does not exist.
# Loads .env.commander for its own token pair if present, else falls back to .env.
# Both bots run app.py; the distinct token gives them separate Slack identities.
# Runs from COMMANDER_DIR (= SLACK_BOT_DIR).
COMMANDER_COMMAND="source .venv/bin/activate && if [ -f .env.commander ]; then set -a && source .env.commander && set +a; else set -a && source .env && set +a; fi && PYTHONPATH=\"${REPO_ROOT}:${COMMANDER_DIR}:${PYTHONPATH:-}\" python app.py"

# Paperclip: local project management server on port 3100.
# PAPERCLIP_DIR must be the directory containing the Paperclip server binary or entry point.
# Set PAPERCLIP_ENABLED=false in .env to suppress startup if Paperclip is not installed.
# Example when installed via npm: PAPERCLIP_COMMAND="npx paperclip-server"
PAPERCLIP_COMMAND="echo 'Paperclip not configured. Set PAPERCLIP_COMMAND in services.conf.'; exit 1"

# NGROK: expose NGROK_PORT to the internet for Slack webhook delivery.
NGROK_COMMAND="ngrok http ${NGROK_PORT}"
