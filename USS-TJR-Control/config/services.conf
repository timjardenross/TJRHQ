# USS TJR Control Deck Service Configuration
# Last updated: MSN-0013 — Control Deck Startup Hardening

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
REPO_ROOT="$HOME/Documents/GitHub/USSTJROS"
SLACK_BOT_DIR="$REPO_ROOT/slack-bot"
COMMANDER_DIR="$REPO_ROOT/slack-bot"
PAPERCLIP_DIR="$HOME/.paperclip"
HEALTH_MONITOR_TOOL="btop"

# ---------------------------------------------------------------------------
# Ports
# ---------------------------------------------------------------------------
PAPERCLIP_PORT="3100"
NGROK_PORT="3100"

# ---------------------------------------------------------------------------
# Commands
# ---------------------------------------------------------------------------

# Slack Bot: activate venv, load .env, set PYTHONPATH, launch app.py
# Runs from SLACK_BOT_DIR.
SLACK_BOT_COMMAND="source .venv/bin/activate && set -a && source .env && set +a && PYTHONPATH=. python app.py"

# Commander: same venv + env setup; commander.py is also in slack-bot/
# Runs from COMMANDER_DIR (= SLACK_BOT_DIR).
COMMANDER_COMMAND="source .venv/bin/activate && set -a && source .env && set +a && PYTHONPATH=. python commander.py"

# Paperclip: local project management server on port 3100.
# PAPERCLIP_DIR must be the directory containing the Paperclip server binary or entry point.
# Set PAPERCLIP_ENABLED=false in .env to suppress startup if Paperclip is not installed.
# Example when installed via npm: PAPERCLIP_COMMAND="npx paperclip-server"
PAPERCLIP_COMMAND="echo 'Paperclip not configured. Set PAPERCLIP_COMMAND in services.conf.'; exit 1"

# NGROK: expose NGROK_PORT to the internet for Slack webhook delivery.
NGROK_COMMAND="ngrok http ${NGROK_PORT}"
