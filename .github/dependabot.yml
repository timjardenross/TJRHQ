version: 2

# Solo-dev setup: one grouped PR per ecosystem, monthly. Covers only the
# manifests that run live (platform-runtime, portal, Actions). The previous
# 12-entry weekly config is in git history.
updates:
  - package-ecosystem: "pip"
    directory: "/platform-runtime"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/lcars-portal"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # Tailwind 3 -> 4 is a config/CSS migration, not a version bump.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions-dependencies:
        patterns: ["*"]
