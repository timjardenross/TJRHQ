name: LCARS Portal CI

on:
  pull_request: {}
  push:
    branches: [main]

# 2026-08-11: was path-filtered to lcars-portal/**, which meant a PR
# touching only other parts of the monorepo (docs, python tools, migrations)
# never triggered this workflow at all. Harmless before today, but branch
# protection now requires this job's "check" status to pass before any PR
# can merge — a required check that never runs stays "Expected — Waiting"
# forever, silently blocking every non-lcars-portal PR (see PR #19). Runs
# on every PR/push now so the required check always actually reports.

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lcars-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 2026-08-11: 18.18.0 was too old for vitest's rolldown bundler
          # (imports node:util's styleText export, not available until
          # Node 20.12+) — npm run test's Startup Error was masked until
          # now by npm run lint failing first (see the eslint-plugin-
          # storybook fix in the same PR). Matched to 24.18.0 since that's
          # what's directly verified working in this session's sandbox
          # against the current lockfile, not a guessed minimum.
          node-version: "24.18.0"
          cache: "npm"
          cache-dependency-path: lcars-portal/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  deadcode:
    # USS-TJR-MSN-0366 Stream 8. lcars-portal had zero dead-code tooling
    # before this (confirmed by reading package.json — lint/typecheck/test
    # only). knip is the current standard for this on Next.js/TypeScript
    # frontends: unlike a plain unused-export linter it does real whole-file
    # reachability analysis from Next's own App Router entry points
    # (page.tsx/layout.tsx/route.ts/etc, via knip's built-in Next.js
    # plugin), so it catches an entire orphaned cluster of mutually-
    # referencing files, not just symbols nothing calls — see
    # reports/knip/README.md for a confirmed example (the paused
    # knowledge-workbench "Library" branch). Advisory only
    # (continue-on-error: true) — a finding never blocks merge; real
    # findings from the first run are triaged in reports/knip/.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lcars-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "npm"
          cache-dependency-path: lcars-portal/package-lock.json

      - run: npm ci
      # Job-level continue-on-error only protects the overall workflow RUN,
      # not this job's own check-run conclusion — confirmed on PR #180's
      # first real CI run, where the python-ci.yml `vulture` job (same
      # job-level-only mistake) showed red despite the flag. Step-level is
      # what actually makes a real finding show green-with-a-log here.
      - name: Run knip
        continue-on-error: true
        run: npm run deadcode

  notification-sender-gate:
    # Council verdict 2026-08-29 ("make duplication impossible, not just
    # detectable"): blocks a new hand-rolled Telegram sendMessage call from
    # landing outside core/platform/notification_service.py. See
    # tools/check_notification_senders.py for the allowlist of known,
    # not-yet-migrated instances.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_notification_senders.py

  config-loader-gate:
    # Same council verdict, second mechanism (config.py, per "repeat per
    # mechanism" in the verdict's recommendation). Blocks a NEW hand-rolled
    # .env-parsing loop from landing outside
    # core/platform/configuration_service.py's load_dotenv_files(). Fully
    # hard-blocking as of the 2026-08-29 follow-up triage — all 15
    # pending-review instances from the initial sweep were resolved same
    # day (10 migrated, 4 confirmed permanent exceptions, 1 false
    # positive) — see tools/check_config_loaders.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_config_loaders.py

  workbench-registry-gate:
    # 2026-08-29 UI-Layer-Debt handoff, Finding 4 follow-up: a new
    # */page.tsx route landing without anyone deciding whether it belongs
    # in LIVE_WORKBENCHES is exactly how comms-workbench and
    # self-improvement-findings went unreachable and were later
    # "rediscovered" by audit instead of decided on at PR time. See
    # tools/check_workbench_registry.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_workbench_registry.py
