name: Python CI

on:
  pull_request: {}
  push:
    branches: [main]

# USS-TJR-MSN-0365 Stream F. This repo had no Python pytest/lint CI at all
# before this file — lcars-portal-ci.yml is Node/npm-focused (plus a few
# standalone `python3 tools/check_*.py` gate jobs unrelated to pytest).
#
# Design notes (from actually inspecting the tree, not assuming a layout):
#
# - Python code and tests are scattered, not uniform: some dirs have their
#   own requirements.txt, some don't; some have real pytest tests, some have
#   zero (or have a file *named* test_*.py that's actually a demo/CLI script
#   with no `def test_*` — see intelligence/analysis/test_shadow_mode_scoring.py
#   and services/transcription/test_transcribe.py, both confirmed locally to
#   collect 0 pytest items). Every `run pytest` step below tolerates pytest's
#   "no tests collected" exit code (5) as a pass rather than a failure, so
#   directories with nothing to gate yet don't break CI, and start gating
#   automatically the moment someone adds a real `def test_*` there.
#
# - core/infrastructure/{mac-collector,vm-processing,vm-transfer} each ship
#   their own requirements.txt AND their own same-named sibling modules
#   (each has its own config.py). core/infrastructure/mac-collector/tests/
#   conftest.py documents, in its own words, that running these as one
#   combined `pytest core/` process lets whichever subsystem's config.py
#   imports first silently win for the rest of the run for every other
#   subsystem's `from config import ...`. Confirmed by reading that
#   conftest's _force_local_module() docstring. So each of the three infra
#   subsystems gets its own matrix entry / own process / own requirements
#   install, and the main `core` entry explicitly --ignores all three —
#   never combined into one pytest invocation.
#
# - intelligence/ has no requirements.txt of its own; its (only, non-test)
#   import surface overlaps with platform-runtime's declared deps (openai,
#   pydantic, feedparser, beautifulsoup4, etc.), so it installs
#   platform-runtime/requirements.txt as a fallback rather than going
#   uninstalled.
#
# - services/revs-content-agents ships its own pytest.ini (pythonpath = .,
#   for its `from src...` imports) — invoked as
#   `services/revs-content-agents/tests` so pytest's own ini-discovery
#   (walking up from the given test path) finds it regardless of the
#   workflow's cwd.
#
# - telegram-bots/recovery_officer and telegram-bots/wellness_officer have
#   neither a requirements.txt nor any tests today; services/transcription has a
#   script-style test file but no requirements.txt. All three still get a
#   `changes` filter (so the paths-filter output is accurate) and a matrix
#   entry (so future tests there are picked up for free), they just have
#   nothing to install / nothing to fail on today.
#
# Verified locally before this file was ever pushed: `python -m pytest
# telegram-bots/xo -q` (14 passed) and `python -m pytest
# core/health/test_capacity_score.py -q` (18 passed) both against real,
# installed dependencies; a deliberately-introduced bug in
# core/health/capacity_score.py's Green threshold produced a genuine
# `1 failed, 17 passed` / exit 1 before being reverted. See the PR
# description for the full transcript.

permissions:
  contents: read

# CI/CD friction mission 2026-09-19: same concurrency gap as
# lcars-portal-ci.yml (see its comment) — no group here meant a
# superseded push's full pytest matrix + advisory scans (vulture,
# pip-audit, semgrep, promptfoo, pre-commit, actionlint) kept running to
# completion instead of being cancelled, burning runner slots that
# queued behind them for no reason. Only the latest ref's run matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            platform_runtime:
              - 'platform-runtime/**'
            core:
              - 'core/**'
              - '!core/infrastructure/mac-collector/**'
              - '!core/infrastructure/vm-processing/**'
              - '!core/infrastructure/vm-transfer/**'
            core_infra_mac_collector:
              - 'core/infrastructure/mac-collector/**'
            core_infra_vm_processing:
              - 'core/infrastructure/vm-processing/**'
            core_infra_vm_transfer:
              - 'core/infrastructure/vm-transfer/**'
            intelligence:
              - 'intelligence/**'
            telegram_capacitybot:
              - 'telegram-bots/capacitybot/**'
            telegram_recovery_officer:
              - 'telegram-bots/recovery_officer/**'
            telegram_resiliencebot:
              - 'telegram-bots/resiliencebot/**'
              - 'platform-runtime/lib/resilience/**'
              - 'knowledge/regulatory-corpus/**'
            telegram_wellness_officer:
              - 'telegram-bots/wellness_officer/**'
            telegram_xo:
              - 'telegram-bots/xo/**'
            services_revs_content_agents:
              - 'services/revs-content-agents/**'
            services_transcription:
              - 'services/transcription/**'

      # Turns the list of changed filter-names into a pytest matrix
      # (name/dir/req per entry). Directories with no changes are simply
      # absent from `changes` and never enter the matrix — this is the
      # "skip directories with no changes" mechanism, not a separate `if:`
      # per matrix job.
      - name: Build test matrix
        id: build-matrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          python3 - <<'PY'
          import json
          import os

          changed = json.loads(os.environ["CHANGED"])

          # filter name -> {name, dir (pytest args), req (requirements.txt
          # path, or "" if the directory has none)}
          entries = {
              "platform_runtime": {
                  "name": "platform-runtime",
                  "dir": "platform-runtime",
                  "req": "platform-runtime/requirements.txt",
              },
              "core": {
                  "name": "core",
                  "dir": (
                      "core "
                      "--ignore=core/infrastructure/mac-collector "
                      "--ignore=core/infrastructure/vm-processing "
                      "--ignore=core/infrastructure/vm-transfer"
                  ),
                  "req": "platform-runtime/requirements.txt",
              },
              "core_infra_mac_collector": {
                  "name": "core-infrastructure-mac-collector",
                  "dir": "core/infrastructure/mac-collector",
                  "req": "core/infrastructure/mac-collector/requirements.txt",
              },
              "core_infra_vm_processing": {
                  "name": "core-infrastructure-vm-processing",
                  "dir": "core/infrastructure/vm-processing",
                  "req": "core/infrastructure/vm-processing/requirements.txt",
              },
              "core_infra_vm_transfer": {
                  "name": "core-infrastructure-vm-transfer",
                  "dir": "core/infrastructure/vm-transfer",
                  "req": "core/infrastructure/vm-transfer/requirements.txt",
              },
              "intelligence": {
                  "name": "intelligence",
                  "dir": "intelligence",
                  # No requirements.txt of its own — falls back to
                  # platform-runtime's (see header comment).
                  "req": "platform-runtime/requirements.txt",
              },
              "telegram_capacitybot": {
                  "name": "telegram-bots-capacitybot",
                  "dir": "telegram-bots/capacitybot",
                  "req": "telegram-bots/capacitybot/requirements.txt",
              },
              "telegram_recovery_officer": {
                  "name": "telegram-bots-recovery_officer",
                  "dir": "telegram-bots/recovery_officer",
                  "req": "",
              },
              "telegram_resiliencebot": {
                  "name": "telegram-bots-resiliencebot",
                  "dir": "telegram-bots/resiliencebot",
                  "req": "telegram-bots/resiliencebot/requirements.txt",
              },
              "telegram_wellness_officer": {
                  "name": "telegram-bots-wellness_officer",
                  "dir": "telegram-bots/wellness_officer",
                  "req": "",
              },
              "telegram_xo": {
                  "name": "telegram-bots-xo",
                  "dir": "telegram-bots/xo",
                  "req": "telegram-bots/xo/requirements.txt",
              },
              "services_revs_content_agents": {
                  "name": "services-revs-content-agents",
                  "dir": "services/revs-content-agents/tests",
                  "req": "services/revs-content-agents/requirements.txt",
              },
              "services_transcription": {
                  "name": "services-transcription",
                  "dir": "services/transcription",
                  "req": "",
              },
          }

          include = [entries[name] for name in changed if name in entries]
          matrix = {"include": include}

          print(f"Changed filters: {changed}")
          print(f"Matrix: {json.dumps(matrix, indent=2)}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"matrix={json.dumps(matrix)}\n")
          PY

  test:
    needs: changes
    if: needs.changes.outputs.matrix != '' && fromJSON(needs.changes.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: "3.11"

      # Cached per-directory: the key is this entry's own requirements.txt
      # hash (or a shared/fallback file's hash where the directory has none
      # of its own — see header comment), so one directory's dependency
      # install never invalidates another's cache.
      - name: Cache pip
        if: matrix.req != ''
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.name }}-${{ hashFiles(matrix.req) }}
          restore-keys: |
            pip-${{ matrix.name }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest.ini's addopts (root, applies to every matrix job since
          # pytest resolves it from repo root regardless of matrix.dir)
          # requires the pytest-timeout plugin (2026-09-15, arize-phoenix
          # collection-hang fix). platform-runtime/requirements.txt happens
          # to already declare it as an app dependency, which is why those
          # matrix jobs never surfaced this gap; jobs whose requirements.txt
          # doesn't (e.g. telegram-bots/xo) silently passed only because
          # they had zero real tests to run pytest.ini's addopts against —
          # confirmed broken (`unrecognized arguments: --timeout=30`) the
          # moment Mission 1 (USS-TJR-MSN-1) added telegram-bots/xo's first
          # real test file. Installing it here, once, for every job, is the
          # actual fix — not adding it to telegram-bots/xo/requirements.txt,
          # which would leak a test-only dependency into that bot's
          # production venv.
          pip install pytest pytest-timeout
          if [ -n "${{ matrix.req }}" ]; then
            pip install -r "${{ matrix.req }}"
          fi

      # services/revs-content-agents shells out to the pandoc and ffmpeg CLIs
      # (article -> docx via pypandoc, video muxing via subprocess), and its
      # tests exercise both for real. ubuntu-latest has neither. This suite
      # only runs when that directory changes, so the gap sat unnoticed until
      # the first change to it (#536's dependency bumps). Installed for that
      # matrix entry only; not skipping the tests, so green still means the
      # code ran.
      - name: Install system tools (revs-content-agents)
        if: matrix.name == 'services-revs-content-agents'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc ffmpeg

      # USS-TJR-MSN-0366 Stream 5 follow-up (flagged by review on PR #180):
      # all 9 tests in core/security/test_llm_guardrails.py — the platform's
      # highest-strategic-value new control — were skipping in this job,
      # not passing, because platform-runtime/.venv-llmsec (Presidio +
      # NeMo Guardrails, deliberately isolated from this job's own
      # dependencies per requirements-llmsec.txt's header) was never
      # provisioned here. None of those 9 tests need a live model (the
      # injection/output-rail cases use NeMo's own FakeLLMModel via
      # fake_responses — see that test file's module docstring), so
      # provisioning this venv is sufficient to run the WHOLE suite for
      # real in CI, not just the model-free subset. Gated to the `core`
      # matrix entry only — no other entry imports core/security/.
      - name: Cache llmsec venv
        if: matrix.name == 'core'
        uses: actions/cache@v6
        with:
          path: platform-runtime/.venv-llmsec
          # python-version in the key (2026-10-08): "3.11" floats to the
          # runner's newest patch release, and a venv's bin/python3 is a
          # symlink into that exact hostedtoolcache path. When the runner
          # moved to 3.11.17 the restored venv's interpreter link dangled and
          # the provision step below died before any test ran.
          key: llmsec-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('core/security/requirements-llmsec.txt') }}

      - name: Provision llmsec venv (Presidio + NeMo Guardrails)
        if: matrix.name == 'core'
        run: |
          # Rebuild if the interpreter can't actually run, not just if the
          # file is missing - a dangling symlink from a stale cache fails -x
          # but still blocks `python3 -m venv` from recreating it in place.
          if ! platform-runtime/.venv-llmsec/bin/python3 -c '' 2>/dev/null; then
            rm -rf platform-runtime/.venv-llmsec
            python3 -m venv platform-runtime/.venv-llmsec
            platform-runtime/.venv-llmsec/bin/pip install --upgrade pip
            platform-runtime/.venv-llmsec/bin/pip install -r core/security/requirements-llmsec.txt
            # Presidio's default NLP engine would otherwise download the
            # 400MB en_core_web_lg on first use; _llmsec_worker.py is
            # configured for the small model instead (see its NlpEngineProvider
            # config) — installed explicitly so first-use never hits the
            # network mid-test.
            platform-runtime/.venv-llmsec/bin/pip install \
              https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
          else
            echo "platform-runtime/.venv-llmsec restored from cache, skipping install."
          fi

      - name: Run pytest (${{ matrix.name }})
        run: |
          set +e
          python -m pytest ${{ matrix.dir }} -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No tests collected under ${{ matrix.dir }} — not yet covered, not a failure."
            exit 0
          fi
          exit "$code"

  # Root tests/ folder (~2,000 tests). The per-directory matrix above never ran
  # it, so a change in deploy/ or core/ could break tests/ unseen (found
  # 2026-11-04: merging deploy/ units broke tests/test_infisical_unit_ordering.py
  # on main with CI green). Advisory first (#566); the 4 failing tests were fixed
  # in #583, and this job is now a required input to merge-gate.
  root-tests:
    needs: ci-scope
    if: needs.ci-scope.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout
          pip install -r platform-runtime/requirements.txt
          pip install -r telegram-bots/xo/requirements.txt

      - name: Run pytest (root tests/)
        run: python -m pytest tests -q --continue-on-collection-errors

  # USS-TJR-MSN-0366 Stream 8. Advisory only (continue-on-error) — this repo
  # already has a hand-rolled dead-code checker (tools/verify_dead_code.py,
  # a per-path evidence report a human/agent runs on demand) but nothing
  # that runs automatically on every PR and scans the whole tree at once.
  # Vulture catches a materially different — and narrower — class of thing
  # than verify_dead_code.py: unused imports/functions/classes/variables it
  # can see by static analysis of the Python it's given, not "is this path
  # referenced anywhere" (verify_dead_code.py's job) and not "is this whole
  # module unreachable from a real entry point" (neither tool does that —
  # see reports/vulture/README.md's writeup of the commander_runtime.py/
  # router.py cluster for why: Vulture only saw the one true external entry
  # point as unused, not the mutually-referencing modules beneath it).
  # Always runs (not gated by the paths-filter matrix above) since dead-code
  # scanning benefits from seeing the whole tree, not just this PR's diff.
  # `continue-on-error: true` so a finding never blocks merge; read the job
  # output to see what it found. Real findings from the first run are
  # triaged in reports/vulture/.
  ci-scope:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'core/**'
              - 'platform-runtime/**'
              - 'intelligence/**'
              - 'telegram-bots/**'
              - 'services/**'
              - 'tools/**'
              - '*.py'
              - '**/*.py'
              - 'requirements*.txt'
              - '**/requirements*.txt'
              - '.pre-commit-config.yaml'
              - '.github/workflows/**'
            workflow:
              - '.github/workflows/**'

  # CI performance mission (2026-09-19): this used to be one `pre-commit`
  # job running gitleaks -> detect-secrets -> bandit -> ruff-check as
  # SERIAL STEPS. Measured on a real, uncontaminated PR run (not a
  # Dependabot-storm-contaminated one): gitleaks 33s, detect-secrets
  # 23m24s, bandit 28s, ruff-check 7s -- total job 24m42s, 95% of it spent
  # on an *advisory* (`continue-on-error: true`) step sitting serially in
  # front of two real blocking gates. Splitting into independent jobs
  # (all restoring the same `~/.cache/pre-commit` cache key, so this costs
  # nothing extra in cache-build time) means gitleaks/bandit/ruff-check
  # finish in parallel, in the ~1min range each, and detect-secrets'
  # long tail no longer blocks anything behind it. Same commands/args/
  # rules as before in every job -- no security coverage change, only job
  # placement.
  precommit-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Cache pre-commit envs
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      # `pre-commit run` only accepts a single optional hookid positional
      # argument, not several -- `pre-commit run --all-files gitleaks
      # detect-secrets` errors out before running any hook ("unrecognized
      # arguments: detect-secrets"), so each hook needs its own invocation
      # (kept from the original single-job design, USS-TJR-MSN-0368
      # Stream 8).
      - name: pre-commit (secrets scan — blocking)
        run: pre-commit run --all-files gitleaks

  precommit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Cache pre-commit envs
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      # Ruff: blocking (USS-TJR-MSN-0370). The remaining ~3,395 manual-
      # judgment findings left after Stream 2's autofix PR were triaged to
      # zero: split by top-level directory across 4 parallel passes
      # (core/, platform-runtime/, intelligence/+tools/, telegram-bots/+misc),
      # each narrowing real production blind-excepts, fixing timezone-naive
      # datetime bugs, and suppressing genuine false positives with dated
      # reasons -- not mechanically globbed. Fresh `ruff check .` now
      # reports 0 findings repo-wide.
      - name: pre-commit (lint — blocking)
        run: pre-commit run --all-files ruff-check

  # CI performance mission (2026-09-19), Section 13: one stable,
  # non-matrix-dependent required-check context. NOT wired into branch
  # protection by this mission — that's a deliberately deferred,
  # Captain-approval-gated step (branch protection stays untouched while
  # Mission 3 is active; see the mission plan). This job exists so that
  # step, when approved, has something reliable to point at instead of
  # `test`'s dynamic matrix-generated job names.
  #
  # Fails closed: every required job's result must be `success`, except
  # `test` (path-aware, matrix-driven) where `skipped` is ALSO acceptable
  # but only when proven to be a legitimate path-selection outcome (the
  # `changes` job's own matrix output was actually empty) — never accepted
  # on faith just because the status string says "skipped". Any
  # `failure`, `cancelled`, or an unexplained `skipped` fails the gate.
  # Advisory jobs (detect-secrets-advisory, vulture, pip-audit, semgrep,
  # promptfoo) are deliberately NOT in `needs` — they never gate the merge
  # decision, by design (unchanged from before this mission).
  merge-gate:
    needs: [ci-scope, changes, precommit-secrets, precommit-lint, root-tests, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded (fail-closed)
        env:
          R_SCOPE_PYTHON: ${{ needs.ci-scope.outputs.python }}
          R_CHANGES: ${{ needs.changes.result }}
          R_SECRETS: ${{ needs['precommit-secrets'].result }}
          R_LINT: ${{ needs['precommit-lint'].result }}
          R_ROOT_TESTS: ${{ needs['root-tests'].result }}
          R_TEST: ${{ needs.test.result }}
          MATRIX_JSON: ${{ needs.changes.outputs.matrix }}
        run: |
          set -euo pipefail
          fail=0

          check_required() {
            name="$1"; result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::Required job '$name' did not succeed (result: $result)"
              fail=1
            else
              echo "Required job '$name': success"
            fi
          }

          check_required "changes" "$R_CHANGES"
          check_required "precommit-secrets" "$R_SECRETS"
          check_required "precommit-lint" "$R_LINT"
          if [ "$R_SCOPE_PYTHON" = "true" ]; then
            check_required "root-tests" "$R_ROOT_TESTS"
          elif [ "$R_ROOT_TESTS" = "skipped" ]; then
            echo "Required job 'root-tests': skipped, and proven legitimate (no Python scope changed)"
          else
            echo "::error::Required job 'root-tests' was not run despite no Python scope"
            fail=1
          fi

          # `test` only runs when `changes`' matrix is non-empty (see the
          # `test` job's own `if:`). `success` always passes. `skipped`
          # passes ONLY when the matrix was actually empty — proven here
          # via the `changes` job's own output, not assumed from the skip
          # status alone, so a future bug in the `if:` condition can't
          # silently produce a green gate on a test job that should have
          # run but didn't.
          if [ "$R_TEST" = "success" ]; then
            echo "Required job 'test': success"
          elif [ "$R_TEST" = "skipped" ]; then
            include_len=$(echo "$MATRIX_JSON" | jq '(.include // []) | length')
            if [ "$include_len" = "0" ]; then
              echo "Required job 'test': skipped, and proven legitimate (path-selection matrix was empty)"
            else
              echo "::error::Required job 'test' was skipped but the path-selection matrix was NOT empty ($include_len entries) — unexplained skip, treating as a failure"
              fail=1
            fi
          else
            echo "::error::Required job 'test' did not succeed (result: $R_TEST)"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Merge gate FAILED"
            exit 1
          fi
          echo "Merge gate PASSED"
