name: Python CI

on:
  pull_request: {}
  push:
    branches: [main]

# USS-TJR-MSN-0365 Stream F. This repo had no Python pytest/lint CI at all
# before this file — lcars-portal-ci.yml is Node/npm-focused (plus a few
# standalone `python3 tools/check_*.py` gate jobs unrelated to pytest).
#
# Design notes (from actually inspecting the tree, not assuming a layout):
#
# - Python code and tests are scattered, not uniform: some dirs have their
#   own requirements.txt, some don't; some have real pytest tests, some have
#   zero (or have a file *named* test_*.py that's actually a demo/CLI script
#   with no `def test_*` — see intelligence/analysis/test_shadow_mode_scoring.py
#   and services/transcription/test_transcribe.py, both confirmed locally to
#   collect 0 pytest items). Every `run pytest` step below tolerates pytest's
#   "no tests collected" exit code (5) as a pass rather than a failure, so
#   directories with nothing to gate yet don't break CI, and start gating
#   automatically the moment someone adds a real `def test_*` there.
#
# - core/infrastructure/{mac-collector,vm-processing,vm-transfer} each ship
#   their own requirements.txt AND their own same-named sibling modules
#   (each has its own config.py). core/infrastructure/mac-collector/tests/
#   conftest.py documents, in its own words, that running these as one
#   combined `pytest core/` process lets whichever subsystem's config.py
#   imports first silently win for the rest of the run for every other
#   subsystem's `from config import ...`. Confirmed by reading that
#   conftest's _force_local_module() docstring. So each of the three infra
#   subsystems gets its own matrix entry / own process / own requirements
#   install, and the main `core` entry explicitly --ignores all three —
#   never combined into one pytest invocation.
#
# - intelligence/ has no requirements.txt of its own; its (only, non-test)
#   import surface overlaps with platform-runtime's declared deps (openai,
#   pydantic, feedparser, beautifulsoup4, etc.), so it installs
#   platform-runtime/requirements.txt as a fallback rather than going
#   uninstalled.
#
# - services/revs-content-agents ships its own pytest.ini (pythonpath = .,
#   for its `from src...` imports) — invoked as
#   `services/revs-content-agents/tests` so pytest's own ini-discovery
#   (walking up from the given test path) finds it regardless of the
#   workflow's cwd.
#
# - telegram-bots/recovery_officer and telegram-bots/wellness_officer have
#   neither a requirements.txt nor any tests today; telegram-bots/revs has
#   a requirements.txt but no tests; services/transcription has a
#   script-style test file but no requirements.txt. All four still get a
#   `changes` filter (so the paths-filter output is accurate) and a matrix
#   entry (so future tests there are picked up for free), they just have
#   nothing to install / nothing to fail on today.
#
# Verified locally before this file was ever pushed: `python -m pytest
# telegram-bots/xo -q` (14 passed) and `python -m pytest
# core/health/test_capacity_score.py -q` (18 passed) both against real,
# installed dependencies; a deliberately-introduced bug in
# core/health/capacity_score.py's Green threshold produced a genuine
# `1 failed, 17 passed` / exit 1 before being reverted. See the PR
# description for the full transcript.

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            platform_runtime:
              - 'platform-runtime/**'
            core:
              - 'core/**'
              - '!core/infrastructure/mac-collector/**'
              - '!core/infrastructure/vm-processing/**'
              - '!core/infrastructure/vm-transfer/**'
            core_infra_mac_collector:
              - 'core/infrastructure/mac-collector/**'
            core_infra_vm_processing:
              - 'core/infrastructure/vm-processing/**'
            core_infra_vm_transfer:
              - 'core/infrastructure/vm-transfer/**'
            intelligence:
              - 'intelligence/**'
            telegram_capacitybot:
              - 'telegram-bots/capacitybot/**'
            telegram_recovery_officer:
              - 'telegram-bots/recovery_officer/**'
            telegram_revs:
              - 'telegram-bots/revs/**'
            telegram_wellness_officer:
              - 'telegram-bots/wellness_officer/**'
            telegram_xo:
              - 'telegram-bots/xo/**'
            services_revs_content_agents:
              - 'services/revs-content-agents/**'
            services_transcription:
              - 'services/transcription/**'

      # Turns the list of changed filter-names into a pytest matrix
      # (name/dir/req per entry). Directories with no changes are simply
      # absent from `changes` and never enter the matrix — this is the
      # "skip directories with no changes" mechanism, not a separate `if:`
      # per matrix job.
      - name: Build test matrix
        id: build-matrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          python3 - <<'PY'
          import json
          import os

          changed = json.loads(os.environ["CHANGED"])

          # filter name -> {name, dir (pytest args), req (requirements.txt
          # path, or "" if the directory has none)}
          entries = {
              "platform_runtime": {
                  "name": "platform-runtime",
                  "dir": "platform-runtime",
                  "req": "platform-runtime/requirements.txt",
              },
              "core": {
                  "name": "core",
                  "dir": (
                      "core "
                      "--ignore=core/infrastructure/mac-collector "
                      "--ignore=core/infrastructure/vm-processing "
                      "--ignore=core/infrastructure/vm-transfer"
                  ),
                  "req": "platform-runtime/requirements.txt",
              },
              "core_infra_mac_collector": {
                  "name": "core-infrastructure-mac-collector",
                  "dir": "core/infrastructure/mac-collector",
                  "req": "core/infrastructure/mac-collector/requirements.txt",
              },
              "core_infra_vm_processing": {
                  "name": "core-infrastructure-vm-processing",
                  "dir": "core/infrastructure/vm-processing",
                  "req": "core/infrastructure/vm-processing/requirements.txt",
              },
              "core_infra_vm_transfer": {
                  "name": "core-infrastructure-vm-transfer",
                  "dir": "core/infrastructure/vm-transfer",
                  "req": "core/infrastructure/vm-transfer/requirements.txt",
              },
              "intelligence": {
                  "name": "intelligence",
                  "dir": "intelligence",
                  # No requirements.txt of its own — falls back to
                  # platform-runtime's (see header comment).
                  "req": "platform-runtime/requirements.txt",
              },
              "telegram_capacitybot": {
                  "name": "telegram-bots-capacitybot",
                  "dir": "telegram-bots/capacitybot",
                  "req": "telegram-bots/capacitybot/requirements.txt",
              },
              "telegram_recovery_officer": {
                  "name": "telegram-bots-recovery_officer",
                  "dir": "telegram-bots/recovery_officer",
                  "req": "",
              },
              "telegram_revs": {
                  "name": "telegram-bots-revs",
                  "dir": "telegram-bots/revs",
                  "req": "telegram-bots/revs/requirements.txt",
              },
              "telegram_wellness_officer": {
                  "name": "telegram-bots-wellness_officer",
                  "dir": "telegram-bots/wellness_officer",
                  "req": "",
              },
              "telegram_xo": {
                  "name": "telegram-bots-xo",
                  "dir": "telegram-bots/xo",
                  "req": "telegram-bots/xo/requirements.txt",
              },
              "services_revs_content_agents": {
                  "name": "services-revs-content-agents",
                  "dir": "services/revs-content-agents/tests",
                  "req": "services/revs-content-agents/requirements.txt",
              },
              "services_transcription": {
                  "name": "services-transcription",
                  "dir": "services/transcription",
                  "req": "",
              },
          }

          include = [entries[name] for name in changed if name in entries]
          matrix = {"include": include}

          print(f"Changed filters: {changed}")
          print(f"Matrix: {json.dumps(matrix, indent=2)}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"matrix={json.dumps(matrix)}\n")
          PY

  test:
    needs: changes
    if: needs.changes.outputs.matrix != '' && fromJSON(needs.changes.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cached per-directory: the key is this entry's own requirements.txt
      # hash (or a shared/fallback file's hash where the directory has none
      # of its own — see header comment), so one directory's dependency
      # install never invalidates another's cache.
      - name: Cache pip
        if: matrix.req != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.name }}-${{ hashFiles(matrix.req) }}
          restore-keys: |
            pip-${{ matrix.name }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -n "${{ matrix.req }}" ]; then
            pip install -r "${{ matrix.req }}"
          fi

      # USS-TJR-MSN-0366 Stream 5 follow-up (flagged by review on PR #180):
      # all 9 tests in core/security/test_llm_guardrails.py — the platform's
      # highest-strategic-value new control — were skipping in this job,
      # not passing, because platform-runtime/.venv-llmsec (Presidio +
      # NeMo Guardrails, deliberately isolated from this job's own
      # dependencies per requirements-llmsec.txt's header) was never
      # provisioned here. None of those 9 tests need a live model (the
      # injection/output-rail cases use NeMo's own FakeLLMModel via
      # fake_responses — see that test file's module docstring), so
      # provisioning this venv is sufficient to run the WHOLE suite for
      # real in CI, not just the model-free subset. Gated to the `core`
      # matrix entry only — no other entry imports core/security/.
      - name: Cache llmsec venv
        if: matrix.name == 'core'
        uses: actions/cache@v4
        with:
          path: platform-runtime/.venv-llmsec
          key: llmsec-venv-${{ hashFiles('core/security/requirements-llmsec.txt') }}

      - name: Provision llmsec venv (Presidio + NeMo Guardrails)
        if: matrix.name == 'core'
        run: |
          if [ ! -x platform-runtime/.venv-llmsec/bin/python3 ]; then
            python3 -m venv platform-runtime/.venv-llmsec
            platform-runtime/.venv-llmsec/bin/pip install --upgrade pip
            platform-runtime/.venv-llmsec/bin/pip install -r core/security/requirements-llmsec.txt
            # Presidio's default NLP engine would otherwise download the
            # 400MB en_core_web_lg on first use; _llmsec_worker.py is
            # configured for the small model instead (see its NlpEngineProvider
            # config) — installed explicitly so first-use never hits the
            # network mid-test.
            platform-runtime/.venv-llmsec/bin/pip install \
              https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
          else
            echo "platform-runtime/.venv-llmsec restored from cache, skipping install."
          fi

      - name: Run pytest (${{ matrix.name }})
        run: |
          set +e
          python -m pytest ${{ matrix.dir }} -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No tests collected under ${{ matrix.dir }} — not yet covered, not a failure."
            exit 0
          fi
          exit "$code"

  # USS-TJR-MSN-0366 Stream 8. Advisory only (continue-on-error) — this repo
  # already has a hand-rolled dead-code checker (tools/verify_dead_code.py,
  # a per-path evidence report a human/agent runs on demand) but nothing
  # that runs automatically on every PR and scans the whole tree at once.
  # Vulture catches a materially different — and narrower — class of thing
  # than verify_dead_code.py: unused imports/functions/classes/variables it
  # can see by static analysis of the Python it's given, not "is this path
  # referenced anywhere" (verify_dead_code.py's job) and not "is this whole
  # module unreachable from a real entry point" (neither tool does that —
  # see reports/vulture/README.md's writeup of the commander_runtime.py/
  # router.py cluster for why: Vulture only saw the one true external entry
  # point as unused, not the mutually-referencing modules beneath it).
  # Always runs (not gated by the paths-filter matrix above) since dead-code
  # scanning benefits from seeing the whole tree, not just this PR's diff.
  # `continue-on-error: true` so a finding never blocks merge; read the job
  # output to see what it found. Real findings from the first run are
  # triaged in reports/vulture/.
  vulture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install vulture
        run: pip install vulture

      # `continue-on-error: true` on the JOB (as this used to be set) only
      # keeps a failure here from failing the overall workflow RUN — the
      # job's own check-run conclusion still reports "failure" on the PR
      # (confirmed: PR #180's first real CI run showed this job red despite
      # the job-level flag, because vulture's real findings exit non-zero).
      # `continue-on-error: true` on the STEP itself is what actually makes
      # the step's outcome (and therefore this job's conclusion) "success"
      # while still surfacing the findings in the log. Advisory means
      # green-with-a-log, not red.
      - name: Run vulture (advisory — findings do not fail the build)
        continue-on-error: true
        run: |
          vulture core/ intelligence/ platform-runtime/ .vulture_whitelist.py --min-confidence 60

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit

      # USS-TJR-MSN-0368 Stream 8: CI-side enforcement of the pre-commit
      # config that Stream D of USS-TJR-MSN-0365 wired up but never gated on
      # (hooks were opt-in per contributor's local `pre-commit install`
      # only). Split into a hard gate and a soft one rather than one
      # `pre-commit run --all-files`, because ruff-check and bandit have a
      # real pre-existing findings backlog on this 930-file monorepo
      # (6,861 ruff / 2,795 bandit at last count -- see
      # knowledge/OSS-Gap-Solutions-2026-08-23.md and this mission's Stream
      # 9 record) that gating on immediately would turn red on day one for
      # reasons unrelated to whoever's PR triggered the run.
      #
      # Hard gate (blocks the PR): gitleaks + detect-secrets. Both already
      # pass clean repo-wide today -- nothing to triage, purely a secrets
      # tripwire, so there's no reason to let a new leak merge in the
      # meantime.
      # `pre-commit run` only accepts a single optional hookid positional
      # argument, not several -- `pre-commit run --all-files gitleaks
      # detect-secrets` errors out before running any hook ("unrecognized
      # arguments: detect-secrets"), so each hook needs its own invocation.
      - name: pre-commit (secrets scan — blocking)
        run: pre-commit run --all-files gitleaks

      # detect-secrets run directly via its own CLI, not `pre-commit run`
      # (#189). `pre-commit run --all-files` on a hook with `files: .*`
      # (this repo has 930+ files) can split the invocation across
      # multiple subprocess batches once the combined command-line length
      # crosses pre-commit's own conservative estimate -- `require_serial:
      # true` only stops those batches running in *parallel*, it doesn't
      # stop them being split in the first place. Each batch's
      # detect-secrets-hook only knows about *that batch's* filenames, and
      # its should_update_baseline() trims the loaded baseline down to
      # just those files before comparing, so any batch boundary makes
      # findings for files outside it look like they "disappeared".
      #
      # Switching to the base CLI does NOT fully fix this, though (found
      # while landing this on PR #190): a plain `detect-secrets scan
      # --baseline .secrets.baseline` on this same tree still occasionally
      # fails to re-find two already-tracked, already-reviewed
      # (is_verified: false) "IBM Cloud IAM Key" fixture findings in
      # tools/supabase/test_decision_intelligence.py and
      # test_decision_operationalisation.py under a fresh CI checkout --
      # reproducible in CI, never locally with an identical command, so
      # something about detect-secrets' own file-scanning under that
      # environment (not the pre-commit/hook layer) is still involved.
      # Root cause undetermined; tracked as a detect-secrets-side gap in
      # #189 rather than re-litigated here.
      #
      # What actually matters for a "blocking secrets gate" is catching a
      # NEW leak, not an existing, already-reviewed finding failing to
      # re-detect for scanner reasons -- so tools/check_new_secrets.py only
      # fails the build on a finding (filename + hashed_secret) that is
      # NOT already in the committed baseline. A finding merely missing
      # from this run's output (vs. HEAD's baseline) is not a leak by
      # definition -- it can only shrink what's already been reviewed.
      # (Kept as a standalone script rather than an inline `run: |` block:
      # detect-secrets' own YAML transformer treats a long block scalar as
      # one flattened value, which made the inline version trip its own
      # Secret Keyword plugin as it grew -- a false positive on the
      # checking script itself, confirmed while adding this on PR #190.)
      - name: detect-secrets (secrets scan — blocking)
        run: |
          pip install "detect-secrets==1.5.0"
          detect-secrets scan --baseline .secrets.baseline
          python3 tools/check_new_secrets.py

      # Bandit: blocking (USS-TJR-MSN-0369). Was informational pending this
      # mission's triage -- 180 Medium findings fixed/suppressed with dated
      # reasons, fresh `bandit -ll` now shows 0 unaddressed Medium findings
      # repo-wide. Safe to actually gate merges instead of only reporting.
      - name: pre-commit (security — blocking)
        run: pre-commit run --all-files bandit

      # Ruff: still informational. This mission's Stream 2 landed the
      # 3,420-finding auto-fixable subset as its own isolated PR, but ~3,395
      # findings remain (`ruff check .` at last count) that need manual
      # judgment file-by-file -- explicitly out of scope for this mission.
      # Flipping this to blocking now would fail CI on every commit against
      # pre-existing, untouched files, not just new drift. Flip once a
      # follow-up mission triages (fixes or rule-level suppresses) the
      # remainder; until then this only reports drift so new code doesn't
      # silently add to the pile unseen.
      - name: pre-commit (lint — informational until ruff manual triage lands)
        continue-on-error: true
        run: pre-commit run --all-files ruff-check

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lints every workflow file present, not just this one — covers
      # Stream E's scorecard.yml too once/if it lands, without hardcoding
      # a filename here.
      - name: Install actionlint
        run: |
          curl -sSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          mkdir -p /tmp/actionlint-bin
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint-bin actionlint

      - name: Run actionlint
        run: /tmp/actionlint-bin/actionlint .github/workflows/*.yml

  # USS-TJR-MSN-0366 Stream 1. Net-new: nothing in this repo ran Semgrep
  # before this job. Runs over the WHOLE tree in one pass, like actionlint
  # above — not per-matrix-directory like the `test` job — because it is
  # the only SAST coverage lcars-portal/ (Next.js/TypeScript) has at all;
  # bandit (.pre-commit-config.yaml) only ever covers Python.
  #
  # Advisory only, deliberately: `continue-on-error: true` so a finding
  # never blocks a PR. This is a first-pass adoption of a brand-new tool
  # against an existing, previously-unscanned monorepo — the point right
  # now is visibility into what Semgrep finds (including the custom
  # RLS-adjacent rules in .semgrep.yml, see that file's header), not a new
  # merge gate. Revisit once findings are triaged; see
  # reports/semgrep/20260912-060349-findings.md for the first triage pass
  # and knowledge/missions/SEMGREP-CI-20260912-knowledge-record.md for the
  # full account of what did and didn't work standing this up.
  #
  # OSS CLI only, on purpose: no SEMGREP_APP_TOKEN, no `semgrep ci`, no
  # login, no results uploaded to semgrep.dev — `semgrep scan` never
  # touches a secret, matching this stream's "OSS-CLI, not the hosted
  # product" scope. `permissions: contents: read` (workflow-level, above)
  # is all this job needs — it only reads the checked-out tree.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned exact version (not "pip install semgrep" unpinned) —
      # verified locally against this repo at 1.177.0 before this job was
      # written; an unpinned install could silently change findings out
      # from under this advisory gate on a later run.
      - name: Install semgrep
        run: pip install semgrep==1.177.0

      # Registry rulesets (p/python, p/javascript, p/typescript,
      # p/security-audit) give general-purpose coverage; .semgrep.yml at
      # the repo root holds this repo's own custom/ RLS-adjacent rules.
      # They're combined as separate --config flags on one invocation —
      # Semgrep's config format has no extends/include key to pull a
      # registry ruleset into a local YAML file, so this is the actual
      # supported way to run both together, not a workaround.
      #
      # NOTE: the registry configs (semgrep.dev) were unreachable from the
      # sandbox this job was authored in (egress policy blocked
      # semgrep.dev outright — see the knowledge record). They are
      # expected to work fine from a normal GitHub-hosted runner's
      # unrestricted egress, but that specific claim was NOT verified
      # end-to-end before this job shipped — if this step's registry
      # fetch ever fails in real CI, that's the first thing to check.
      # Job-level continue-on-error only protects the overall workflow RUN,
      # not this job's own check-run conclusion (see the vulture job's
      # comment above for the confirmed real evidence from PR #180). Moved
      # to the step so a real finding (or the registry-config-unreachable
      # risk noted above) shows green-with-a-log instead of red.
      - name: Semgrep scan
        continue-on-error: true
        run: |
          semgrep scan \
            --config=p/python \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/security-audit \
            --config=.semgrep.yml \
            --metrics=off \
            --disable-version-check \
            --error \
            --output=semgrep-results.json \
            --json

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30
