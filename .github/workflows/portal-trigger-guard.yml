name: portal-trigger-guard

# config/osint_intelligence_missions.json is traced into the portal's serverless bundle at build time (lcars-portal/next.config.mjs),
# but it lives outside the portal root, so Vercel's "skip unaffected deployments" cannot see a change to it. A pull request that
# changes it must therefore also bump lcars-portal/MISSIONS_CONFIG_VERSION, which is inside the root and so triggers the one portal
# deployment that picks the new file up. Runs only for pull requests that touch the config file; no Vercel call, no secrets.
on:
  pull_request:
    paths:
      - 'config/osint_intelligence_missions.json'

jobs:
  missions-config-portal-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a portal trigger bump
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if ! git diff --name-only "$base"...HEAD | grep -qx 'lcars-portal/MISSIONS_CONFIG_VERSION'; then
            echo "config/osint_intelligence_missions.json changed without lcars-portal/MISSIONS_CONFIG_VERSION."
            echo "Increment the number in lcars-portal/MISSIONS_CONFIG_VERSION so the portal is redeployed with the new config."
            exit 1
          fi
