# Pre-commit hook configuration for TJRHQ.
#
# Scope (USS-TJR-MSN-0365, Stream D): wire the gate, don't fix every finding
# it surfaces. Ruff runs lint-only (no --fix, no ruff-format) on this pass so
# adding this config does not trigger a mass reformat of an existing,
# large Python monorepo as a side effect — that can be a deliberate follow-up
# once findings are triaged.
#
# Post-merge setup (not automatic in CI or on clone): each contributor must
# run, once, in their local checkout:
#     pip install pre-commit
#     pre-commit install
# Only then do these hooks actually run on `git commit`.
#
# USS-TJR-MSN-0369/0370 update: both bandit's Medium backlog (0 unaddressed
# repo-wide) and ruff's full backlog (0 findings repo-wide, including the
# ~3,395 manual-judgment findings triaged in MSN-0370 after MSN-0369's
# autofix PR) are clear. Both CI's bandit and ruff-check steps are now
# blocking.
#
# Bandit's LOCAL hook (unlike CI's `-ll`/Medium-only gate) runs at its
# default severity, which still surfaces ~2,500 pre-existing Low findings
# (subprocess/random/etc. patterns) that were explicitly out of this
# mission's Medium-only scope -- so editing an old file can still trip the
# local bandit hook on a Low finding your change didn't introduce. If that
# happens and the finding is genuinely pre-existing and unrelated, it's
# fine to run:
#     SKIP=bandit git commit -m "..."
# Ruff should no longer need this treatment now that its backlog is
# actually at zero -- if you hit a ruff finding blocking a commit, it's
# more likely real drift from your own change than pre-existing debt.
# Never skip gitleaks or detect-secrets this way -- those stay hard-blocking
# for a reason.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        name: ruff (lint only, no autofix)

  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks:
      - id: bandit
        name: bandit (security lint)
        args: ["-q"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (staged secrets scan)
        # v8's hook entry (`gitleaks git --pre-commit --staged`) is the
        # current equivalent of the older `gitleaks protect --staged`
        # invocation named in the mission brief; gitleaks v8 removed the
        # `protect` subcommand in favor of `git --pre-commit`.

  - repo: local
    hooks:
      - id: no-raw-env-secrets
        name: no raw .env EnvironmentFile= in deploy/*.service (USS-TJR-MSN-0371)
        entry: python3 tools/check_no_raw_env_secrets.py
        language: system
        files: ^deploy/.*\.service$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # Without this, pre-commit is free to split a `--all-files` run of
        # this hook across this 930+-file repo into multiple parallel
        # subprocess batches, each getting only a subset of filenames.
        # detect_secrets/pre_commit_hook.py's should_update_baseline() trims
        # the loaded baseline down to just the files in *that invocation's*
        # filelist before comparing — so a batch that doesn't include some
        # already-tracked file makes the hook think that file's finding
        # disappeared, and it rewrites the baseline and exits 3 ("files were
        # modified") with no real secret involved (see #189: this reproduced
        # locally clean every time — one process, one full file list — but
        # failed in CI, where batching evidently split differently).
        # require_serial forces exactly one invocation with the complete
        # file list, matching detect-secrets' own documented pre-commit
        # setup for this reason.
        require_serial: true
        exclude: |
          (?x)^(
            .*\.lock|
            .*package-lock\.json|
            .*/data/mem0_qdrant/.*
          )$
