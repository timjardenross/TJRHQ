<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Improving System Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #FAF8F3;
            color: #2D2D2D;
            line-height: 1.6;
        }

        .container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        header {
            border-bottom: 1px solid #E8E5DC;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            padding: 0;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            width: 100%;
        }

        .header-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #52604F;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }

        .header-title {
            flex: 1;
        }

        .header-title h1 {
            font-size: 16px;
            font-weight: 600;
            color: #2D2D2D;
            margin: 0;
        }

        .header-title p {
            font-size: 10px;
            color: #5A5A5A;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            margin: 2px 0 0 0;
        }

        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: #FFFFFF;
            border-right: 1px solid #E8E5DC;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #E8E5DC;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: #2D2D2D;
            margin-bottom: 12px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 11px;
        }

        .status-item {
            background: #FAF8F3;
            padding: 8px;
            border-radius: 4px;
            border-left: 2px solid #52604F;
        }

        .status-item strong {
            display: block;
            color: #52604F;
            font-size: 18px;
            margin-bottom: 2px;
        }

        .status-item label {
            color: #5A5A5A;
            font-size: 10px;
        }

        .findings-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .finding-item {
            background: #FFFFFF;
            border: 1px solid #E8E5DC;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .finding-item:hover {
            border-color: #52604F;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        .finding-item.active {
            background: #FAF8F3;
            border-color: #52604F;
        }

        .finding-item.decided {
            opacity: 0.7;
        }

        .finding-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2D2D2D;
        }

        .finding-meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 10px;
        }

        .badge {
            background: #E8E5DC;
            padding: 2px 6px;
            border-radius: 3px;
            color: #5A5A5A;
        }

        .badge.category {
            background: #FAF8F3;
            color: #52604F;
            border: 1px solid #E8E5DC;
        }

        .badge.severity-high {
            background: #C85A54;
            color: #A23A34;
        }

        .badge.severity-medium {
            background: #B57A34;
            color: #8A5A1B;
        }

        .badge.severity-low {
            background: #6B8E6B;
            color: #3F633F;
        }

        .badge.decided-approved {
            background: #6B8E6B;
            color: #3F633F;
        }

        .badge.decided-rejected {
            background: #C85A54;
            color: #A23A34;
        }

        .main {
            flex: 1;
            background: #FAF8F3;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .detail-view {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            max-width: 800px;
        }

        .detail-view.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5A5A5A;
            font-size: 14px;
        }

        .finding-detail h2 {
            font-size: 24px;
            margin-bottom: 24px;
            color: #2D2D2D;
        }

        .detail-section {
            margin-bottom: 24px;
        }

        .detail-section h3 {
            font-size: 10px;
            text-transform: uppercase;
            color: #5A5A5A;
            margin-bottom: 8px;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .detail-content {
            background: #FFFFFF;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #52604F;
            line-height: 1.8;
            color: #2D2D2D;
        }

        .evidence-list {
            list-style: none;
            margin-left: 0;
        }

        .evidence-list li {
            background: #FAF8F3;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 12px;
            border-left: 2px solid #E8E5DC;
        }

        .evidence-list li strong {
            color: #52604F;
        }

        .action-bar {
            border-top: 1px solid #E8E5DC;
            padding: 20px 32px;
            background: #FFFFFF;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-bar textarea {
            width: 100%;
            background: #FAF8F3;
            border: 1px solid #E8E5DC;
            color: #2D2D2D;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            resize: vertical;
            min-height: 60px;
            margin-bottom: 12px;
        }

        .action-bar textarea::placeholder {
            color: #5A5A5A;
        }

        .button {
            padding: 8px 14px;
            border: 1px solid;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .button-approve {
            background: #6B8E6B;
            color: #3F633F;
            border-color: #52604F;
        }

        .button-approve:hover {
            background: #52604F;
            color: #3F633F;
            opacity: 0.9;
        }

        .button-reject {
            background: #C85A54;
            color: #A23A34;
            border-color: #B55A50;
        }

        .button-reject:hover {
            background: #B55A50;
            opacity: 0.9;
        }

        .button-more-evidence {
            background: #B57A34;
            color: #8A5A1B;
            border-color: #A56A2A;
        }

        .button-more-evidence:hover {
            background: #A56A2A;
            opacity: 0.9;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .decision-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            margin-top: 12px;
        }

        .decision-badge.approved {
            background: #6B8E6B;
            color: #3F633F;
        }

        .decision-badge.rejected {
            background: #C85A54;
            color: #A23A34;
        }

        .decision-badge.more-evidence {
            background: #B57A34;
            color: #8A5A1B;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #5A5A5A;
        }

        .spinner {
            border: 2px solid #E8E5DC;
            border-top: 2px solid #52604F;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.6s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="header-logo">TJR</div>
                <div class="header-title">
                    <h1>Self-Improving System</h1>
                    <p>Operational Resilience</p>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-title">🔍 Findings</div>
                    <div class="status-grid">
                        <div class="status-item">
                            <strong id="total-count">0</strong>
                            <label>Total</label>
                        </div>
                        <div class="status-item">
                            <strong id="pending-count">0</strong>
                            <label>Pending</label>
                        </div>
                    </div>
                </div>
                <div class="findings-list" id="findings-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading findings...
                    </div>
                </div>
            </div>

            <div class="main">
                <div class="detail-view empty" id="detail-view">
                    <div>Select a finding to review</div>
                </div>

                <div class="action-bar" id="action-bar" style="display: none;">
                    <textarea id="reasoning" placeholder="Add notes/reasoning for your decision (optional)..."></textarea>
                    <button class="button button-approve" onclick="makeDecision('approved')">✓ Approve</button>
                    <button class="button button-more-evidence" onclick="makeDecision('more_evidence')">? More Evidence</button>
                    <button class="button button-reject" onclick="makeDecision('rejected')">✗ Reject</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let findings = [];
        let selectedFinding = null;

        async function loadFindings() {
            try {
                const resp = await fetch('/api/findings');
                const data = await resp.json();
                findings = data.findings || [];

                document.getElementById('total-count').textContent = data.total || 0;
                document.getElementById('pending-count').textContent = data.findings.filter(f => !f.decision).length || 0;

                renderFindings();
            } catch (err) {
                console.error('Failed to load findings:', err);
                document.getElementById('findings-list').innerHTML = '<div class="loading">Failed to load findings</div>';
            }
        }

        function renderFindings() {
            const list = document.getElementById('findings-list');
            if (findings.length === 0) {
                list.innerHTML = '<div class="loading">No findings yet</div>';
                return;
            }

            list.innerHTML = findings.map(f => `
                <div class="finding-item ${selectedFinding?.finding_id === f.finding_id ? 'active' : ''} ${f.decision ? 'decided' : ''}" onclick="selectFinding(${findings.indexOf(f)})">
                    <div class="finding-title">${f.title || 'Untitled'}</div>
                    <div class="finding-meta">
                        <span class="badge category">${f.category}</span>
                        <span class="badge severity-${f.severity}">${f.severity}</span>
                        ${f.decision ? `<span class="badge decided-${f.decision}">${f.decision.replace('_', ' ')}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function selectFinding(index) {
            selectedFinding = findings[index];
            renderFindings();
            renderDetail();
        }

        function renderDetail() {
            const view = document.getElementById('detail-view');
            const actionBar = document.getElementById('action-bar');

            if (!selectedFinding) {
                view.classList.add('empty');
                view.innerHTML = '<div>Select a finding to review</div>';
                actionBar.style.display = 'none';
                return;
            }

            view.classList.remove('empty');
            actionBar.style.display = 'flex';

            const evidence = selectedFinding.evidence || [];
            const evidenceHTML = evidence.length > 0 ? `
                <ul class="evidence-list">
                    ${evidence.map(e => `
                        <li>
                            <strong>${e.type}:</strong> ${e.observation}
                            ${e.location ? `<br><em>${e.location}</em>` : ''}
                        </li>
                    `).join('')}
                </ul>
            ` : '<p>No evidence provided</p>';

            const decisionHTML = selectedFinding.decision ? `
                <div class="decision-badge ${selectedFinding.decision}">
                    Decision: ${selectedFinding.decision.replace('_', ' ').toUpperCase()}
                    ${selectedFinding.decision_reasoning ? `<br>${selectedFinding.decision_reasoning}` : ''}
                </div>
            ` : '';

            view.innerHTML = `
                <div>
                    <h2>${selectedFinding.title || 'Untitled'}</h2>

                    <div class="detail-section">
                        <h3>Category</h3>
                        <div class="detail-content">${selectedFinding.category}</div>
                    </div>

                    <div class="detail-section">
                        <h3>Severity & Risk</h3>
                        <div class="detail-content">
                            Severity: <strong>${selectedFinding.severity}</strong><br>
                            Risk: <strong>${selectedFinding.risk_level || 'N/A'}</strong><br>
                            Confidence: <strong>${(selectedFinding.confidence * 100).toFixed(0)}%</strong>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3>Description</h3>
                        <div class="detail-content">${selectedFinding.description || selectedFinding.proposed_action?.description || 'No description provided'}</div>
                    </div>

                    <div class="detail-section">
                        <h3>Evidence</h3>
                        <div class="detail-content">${evidenceHTML}</div>
                    </div>

                    <div class="detail-section">
                        <h3>Proposed Action</h3>
                        <div class="detail-content">${selectedFinding.proposed_action?.type || 'N/A'}: ${selectedFinding.proposed_action?.description || 'N/A'}</div>
                    </div>

                    ${decisionHTML}
                </div>
            `;

            document.getElementById('reasoning').value = selectedFinding.decision_reasoning || '';
        }

        async function makeDecision(decision) {
            if (!selectedFinding) return;

            const reasoning = document.getElementById('reasoning').value;
            try {
                const resp = await fetch('/api/decide', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        finding_id: selectedFinding.finding_id,
                        decision: decision,
                        reasoning: reasoning
                    })
                });

                if (resp.ok) {
                    selectedFinding.decision = decision;
                    selectedFinding.decision_reasoning = reasoning;
                    await loadFindings();
                    renderDetail();
                } else {
                    alert('Failed to save decision');
                }
            } catch (err) {
                console.error('Failed to save decision:', err);
                alert('Error saving decision');
            }
        }

        // Initial load
        loadFindings();
        // Refresh every 5 seconds
        setInterval(loadFindings, 5000);
    </script>
</body>
</html>
