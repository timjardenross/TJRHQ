[pytest]
# 2026-09-15 adversarial review: pytest-timeout wasn't installed anywhere
# in the fleet -- a single hanging test (an unbounded network call, an
# infinite retry loop) could previously stall a whole suite/CI job
# indefinitely instead of failing just that one test. 30s is generous for
# this repo's unit/integration tests; a genuinely slow test should get an
# explicit @pytest.mark.timeout(N) override, not a longer global default.
#
# 2026-09-15, CoS test-debt sweep: arize-phoenix's auto-loaded pytest11
# plugin (phoenix.client.pytest.plugin, from platform-runtime/.venv)
# coredumps in pydantic_core during collection -- confirmed by disabling
# every other auto-loaded plugin one at a time until this was the sole
# remaining cause (deepeval's own pytest plugin was the other suspect,
# confirmed innocent). This repo has zero tests using Phoenix's pytest
# fixtures/markers, so disabling its autoload is a pure no-op for real
# coverage, not a workaround masking a real gap. This is what "46
# pre-existing test failures" had actually silently regressed into: not
# failures, a full-suite hang. --timeout=30 alone couldn't catch this
# because it hit during collection, before any test/timeout is armed.
addopts = --timeout=30 -p no:phoenix
timeout_method = thread
