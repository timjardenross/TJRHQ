# USS-TJR-MSN-0205B — Secure File Transfer to VM
# Copy this file to config.yaml and fill in real connection details.
# config.yaml is gitignored — never commit real hostnames/keys/paths.

remote:
  host: "vm.example.internal"
  port: 22
  user: "transferbot"
  # Path to a dedicated, passphrase-less (or agent-loaded) SSH private key.
  # Password auth is not supported — key-based auth only.
  ssh_key: "~/.ssh/id_ed25519_vm_transfer"
  # Root of the VM inbox. pending/received/failed/archive are created
  # under this path automatically before the first transfer.
  base_path: "/opt/starship/inbox"
  strict_host_key_checking: "accept-new"
  connect_timeout: 10

retry:
  max_attempts: 3
  backoff_seconds: 5

# Defense-in-depth blocklist evaluated at transfer time, on top of whatever
# the Mac Collector Agent's manifest (MSN-0205A) already excluded. Same
# glob syntax as mac-collector's ignore rules: fnmatch against rel_path and
# bare filename; a pattern ending in "/**" blocks an entire directory
# subtree. Use this to hold back files still under review.
exclude_patterns:
  - "*.draft"
  - "review-hold/**"

database:
  path: "./transfer.db"

logs:
  dir: "./logs"

rsync:
  extra_args: []
