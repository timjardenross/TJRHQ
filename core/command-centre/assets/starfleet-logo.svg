<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Starfleet emblem: Delta insignia -->
  <defs>
    <linearGradient id="deltaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4D5A94;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9EB7DA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#9EB7DA" stroke-width="2"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#4D5A94" stroke-width="1"/>
  
  <!-- Delta shield background -->
  <path d="M 100 30 L 150 120 L 100 160 L 50 120 Z" fill="url(#deltaGrad)" opacity="0.9"/>
  
  <!-- Central star -->
  <g transform="translate(100, 90)">
    <path d="M 0,-15 L 4,-5 L 15,-5 L 7,2 L 10,15 L 0,9 L -10,15 L -7,2 L -15,-5 L -4,-5 Z" fill="#FFFFFF"/>
  </g>
  
  <!-- Text: STARFLEET COMMAND -->
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="10" fill="#9EB7DA" text-anchor="middle" letter-spacing="2">STARFLEET</text>
</svg>
