<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captain Health Status — Starfleet Command Centre</title>
  <link rel="stylesheet" href="widgets.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(to bottom, #0a0e27 0%, #1a1f3a 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e0e6ff;
      min-height: 100vh;
      padding: 20px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0, 204, 255, 0.2);
    }

    .page-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #00ccff;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .page-header p {
      font-size: 12px;
      color: #a0a6c0;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .widget-container {
      max-width: 640px;
      margin: 0 auto;
    }

    .hint {
      text-align: center;
      font-size: 12px;
      color: #a0a6c0;
      margin-top: 16px;
    }

    .hint code {
      font-family: monospace;
      background: rgba(0, 204, 255, 0.1);
      padding: 2px 6px;
      border-radius: 3px;
      color: #00ccff;
    }

    .auto-refresh-note {
      text-align: center;
      font-size: 11px;
      color: rgba(160, 166, 192, 0.6);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>❤️ Captain Health Status</h1>
    <p>Starship Endeavour NCC-170230 — Summary-level daily health context</p>
  </div>

  <div class="widget-container">
    <div id="health-widget"></div>
  </div>

  <p class="hint">
    Submit today's check-in: <code>/health-check</code> in Slack
  </p>
  <p class="auto-refresh-note">Auto-refreshes every 90 seconds</p>

  <script src="api-client.js"></script>
  <script src="widgets.js"></script>
  <script>
    const healthApiClient = new CommandCentreAPIClient('http://localhost:5050');

    const healthWidget = new PersonalHealthWidget('health-widget', healthApiClient, {
      pollingInterval: 90000,
      debug: true,
    });

    healthWidget.startPolling();
  </script>
</body>
</html>
