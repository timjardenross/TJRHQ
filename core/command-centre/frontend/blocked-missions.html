<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocked Missions</title>
    <link rel="stylesheet" href="/theme-starfleet-advanced.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e27;
            padding: 20px;
        }

        .blocked-container {
            max-width: 1000px;
            margin: 0 auto;
            background: #1a1a2e;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            padding: 28px;
            border: 3px solid #FF4444;
        }

        .blocked-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            border-bottom: 3px solid #FF4444;
            padding-bottom: 20px;
        }

        .blocked-header h1 {
            font-size: 32px;
            font-weight: bold;
            color: #FF4444;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .blocked-header h1::before {
            content: "◆ ";
            margin-right: 8px;
        }

        .header-stats {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .stat-badge {
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #FF4444;
            letter-spacing: 1px;
        }

        .stat-label {
            font-size: 12px;
            color: #AAA;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .refresh-btn {
            padding: 10px 20px;
            background: #FF4444;
            color: #000;
            border: 2px solid #FF4444;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .refresh-btn:hover {
            background: #FF0000;
            border-color: #FF0000;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.6);
        }

        .refresh-btn:disabled {
            background: #444;
            border-color: #666;
            color: #888;
            cursor: not-allowed;
        }

        /* Trust Indicator Banner */
        .trust-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            text-transform: uppercase;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .trust-banner.trust-loading     { background: rgba(100,100,120,0.2); color: #888; border: 1px solid #444; }
        .trust-banner.trust-live        { background: rgba(76,175,80,0.15); color: #4CAF50; border: 1px solid #4CAF50; }
        .trust-banner.trust-unavailable { background: rgba(244,67,54,0.15); color: #EF5350; border: 1px solid #EF5350; }
        .trust-source { font-weight: 400; font-size: 11px; opacity: 0.85; }
        .trust-time   { font-weight: 400; font-size: 11px; opacity: 0.7; margin-left: auto; }

        /* Filter Buttons */
        .filter-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 18px;
            border: 2px solid #444;
            background: #2a2a3e;
            color: #AAA;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-btn:hover {
            border-color: #FF4444;
            color: #FF4444;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.3);
        }

        .filter-btn.active {
            background: #FF4444;
            color: #000;
            border-color: #FF4444;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.4);
        }

        /* Blocked Mission Cards */
        .blocked-missions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .blocked-card {
            border: 3px solid #FF4444;
            border-radius: 8px;
            padding: 20px;
            background: linear-gradient(135deg, #2a2a3e 0%, rgba(255, 68, 68, 0.1) 100%);
            transition: all 0.3s ease;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 68, 68, 0.3); }
            50% { box-shadow: 0 0 20px rgba(255, 68, 68, 0.6); }
        }

        .blocked-card:hover {
            box-shadow: 0 8px 20px rgba(255, 68, 68, 0.5);
            border-color: #FF0000;
            transform: translateY(-2px);
        }

        .blocked-title {
            font-size: 18px;
            font-weight: 700;
            color: #FFF;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .blocked-id {
            font-size: 12px;
            color: #999;
            margin-bottom: 14px;
            font-family: monospace;
        }

        .block-reason {
            background: rgba(255, 68, 68, 0.1);
            border-left: 3px solid #FF4444;
            padding: 14px;
            border-radius: 4px;
            margin-bottom: 14px;
        }

        .block-reason-label {
            font-size: 11px;
            font-weight: 700;
            color: #FF4444;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .block-reason-text {
            font-size: 13px;
            color: #CCC;
            line-height: 1.6;
            font-weight: 500;
        }

        .block-reason-detail {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            font-style: italic;
        }

        .resolution-steps {
            background: rgba(76, 175, 80, 0.1);
            border-left: 3px solid #4CAF50;
            padding: 14px;
            border-radius: 4px;
            margin-bottom: 14px;
        }

        .resolution-label {
            font-size: 11px;
            font-weight: 700;
            color: #00DD00;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .resolution-steps-list {
            list-style: none;
            padding: 0;
        }

        .resolution-step {
            font-size: 12px;
            color: #333;
            margin-bottom: 6px;
            padding-left: 20px;
            position: relative;
        }

        .resolution-step::before {
            content: '→';
            position: absolute;
            left: 0;
            color: #4CAF50;
            font-weight: bold;
        }

        .block-metadata {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 12px;
            background: white;
            border-radius: 4px;
            font-size: 12px;
        }

        .metadata-item {
            display: flex;
            justify-content: space-between;
        }

        .metadata-label {
            color: #666;
            font-weight: 500;
        }

        .metadata-value {
            color: #333;
            font-weight: 600;
        }

        .severity-high {
            background: #FFEBEE;
            border-color: #F44336;
        }

        .severity-medium {
            background: #FFF3E0;
            border-color: #FF9800;
        }

        .severity-low {
            background: #E8F5E9;
            border-color: #4CAF50;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .empty-text {
            font-size: 14px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            padding: 16px;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .blocked-container {
                padding: 16px;
            }

            .blocked-header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .header-stats {
                width: 100%;
                justify-content: space-around;
            }

            .blocked-missions-grid {
                grid-template-columns: 1fr;
            }

            .block-metadata {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="blocked-container">
        <!-- Header -->
        <div class="blocked-header">
            <div>
                <h1>Blocked Missions</h1>
                <p style="font-size: 13px; color: #666; margin-top: 4px;">Missions waiting on dependencies, resources, or external conditions</p>
            </div>
            <div class="header-stats">
                <div class="stat-badge">
                    <div class="stat-number" id="blocked-count">0</div>
                    <div class="stat-label">Blocked</div>
                </div>
                <button class="refresh-btn" id="refresh-btn" onclick="refreshBlocked()">Refresh</button>
            </div>
        </div>

        <!-- Trust Indicator -->
        <div id="trust-banner" class="trust-banner trust-loading">
            <span id="trust-label">⏳ LOADING</span>
            <span class="trust-source" id="trust-source"></span>
            <span class="trust-time" id="trust-time"></span>
        </div>

        <!-- Error Message -->
        <div id="error-container" style="display: none;"></div>

        <!-- Filter Buttons -->
        <div class="filter-buttons" id="filter-buttons"></div>

        <!-- Blocked Missions Grid -->
        <div id="blocked-grid" class="blocked-missions-grid">
            <div class="loading">
                <span class="spinner"></span>
                Loading blocked missions...
            </div>
        </div>
    </div>

    <script>
        // Data source: /api/dashboard/blocked-missions (Supabase missions filtered by status=blocked)
        // No hardcoded mock data. No Supabase credentials in this file.
        const CONTROL_ENGINE = 'http://localhost:8888';

        let blockedMissions = [];

        function setTrustState(state, opts) {
            opts = opts || {};
            const banner   = document.getElementById('trust-banner');
            const labelEl  = document.getElementById('trust-label');
            const sourceEl = document.getElementById('trust-source');
            const timeEl   = document.getElementById('trust-time');
            const icons  = { loading: '⏳', live: '🟢', unavailable: '🔴' };
            const labels = { loading: 'LOADING', live: 'LIVE', unavailable: 'UNAVAILABLE' };
            banner.className = 'trust-banner trust-' + state;
            labelEl.textContent  = (icons[state] || '') + ' ' + (labels[state] || state.toUpperCase());
            sourceEl.textContent = opts.source ? '— ' + opts.source : '';
            timeEl.textContent   = opts.time   ? opts.time           : '';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', () => {
            refreshBlocked();
            setInterval(refreshBlocked, 30000);
        });

        async function refreshBlocked() {
            const refreshBtn = document.getElementById('refresh-btn');
            refreshBtn.disabled = true;
            refreshBtn.textContent = 'Refreshing...';
            setTrustState('loading');

            try {
                const response = await fetch(`${CONTROL_ENGINE}/api/dashboard/blocked-missions`);

                if (!response.ok) {
                    throw new Error(`Control Engine error: ${response.status}`);
                }

                const envelope = await response.json();
                const fetchTime = new Date().toLocaleTimeString();
                blockedMissions = Array.isArray(envelope.data) ? envelope.data : [];

                setTrustState('live', {
                    source: envelope.source_label || 'Supabase missions — blocked filter',
                    time: fetchTime,
                });
                document.getElementById('error-container').style.display = 'none';

            } catch (error) {
                console.error('[Blocked Missions] Fetch error:', error);
                blockedMissions = [];
                setTrustState('unavailable', { source: 'Control Engine unreachable (localhost:8888)' });
                const ec = document.getElementById('error-container');
                ec.innerHTML = `<div class="error-message">⚠️ Cannot reach Control Engine. Check that control_engine.py is running on port 8888.</div>`;
                ec.style.display = 'block';
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = 'Refresh';
                document.getElementById('blocked-count').textContent = blockedMissions.length;
                displayBlockedMissions();
            }
        }

        function displayBlockedMissions() {
            const grid = document.getElementById('blocked-grid');

            if (blockedMissions.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">✅</div>
                        <div class="empty-title">No Blocked Missions</div>
                        <div class="empty-text">No missions with status "blocked" found in Supabase</div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = blockedMissions.map(m => `
                <div class="blocked-card">
                    <div class="blocked-title">🚫 ${escapeHtml(m.title || m.mission_id)}</div>
                    <div class="blocked-id">${escapeHtml(m.mission_id || m.id || '—')}</div>

                    <div class="block-reason">
                        <div class="block-reason-label">📋 Description</div>
                        <div class="block-reason-text">${escapeHtml(m.description || 'No description recorded')}</div>
                    </div>

                    <div class="block-metadata">
                        <div class="metadata-item">
                            <span class="metadata-label">Owner:</span>
                            <span class="metadata-value">${escapeHtml(m.created_by || 'Unassigned')}</span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Type:</span>
                            <span class="metadata-value">${escapeHtml(m.task_type || 'N/A')}</span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Status:</span>
                            <span class="metadata-value">BLOCKED</span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Created:</span>
                            <span class="metadata-value">${m.created_at ? new Date(m.created_at).toLocaleDateString() : 'N/A'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
