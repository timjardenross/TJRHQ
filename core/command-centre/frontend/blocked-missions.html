<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocked Missions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .blocked-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }

        .blocked-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 16px;
        }

        .blocked-header h1 {
            font-size: 24px;
            color: #333;
        }

        .header-stats {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .stat-badge {
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #F44336;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .refresh-btn {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background: #0056b3;
        }

        .refresh-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Filter Buttons */
        .filter-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            color: #333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: #007bff;
            color: #007bff;
        }

        .filter-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        /* Blocked Mission Cards */
        .blocked-missions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .blocked-card {
            border: 2px solid #F44336;
            border-radius: 8px;
            padding: 20px;
            background: #fff5f5;
            transition: all 0.3s ease;
        }

        .blocked-card:hover {
            box-shadow: 0 8px 16px rgba(244, 67, 54, 0.2);
            border-color: #D32F2F;
        }

        .blocked-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .blocked-id {
            font-size: 12px;
            color: #999;
            margin-bottom: 12px;
            font-family: monospace;
        }

        .block-reason {
            background: white;
            border-left: 3px solid #FF9800;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .block-reason-label {
            font-size: 11px;
            font-weight: 600;
            color: #FF9800;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .block-reason-text {
            font-size: 13px;
            color: #333;
            line-height: 1.5;
        }

        .block-reason-detail {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
            font-style: italic;
        }

        .resolution-steps {
            background: #E8F5E9;
            border-left: 3px solid #4CAF50;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .resolution-label {
            font-size: 11px;
            font-weight: 600;
            color: #2E7D32;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .resolution-steps-list {
            list-style: none;
            padding: 0;
        }

        .resolution-step {
            font-size: 12px;
            color: #333;
            margin-bottom: 6px;
            padding-left: 20px;
            position: relative;
        }

        .resolution-step::before {
            content: '→';
            position: absolute;
            left: 0;
            color: #4CAF50;
            font-weight: bold;
        }

        .block-metadata {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 12px;
            background: white;
            border-radius: 4px;
            font-size: 12px;
        }

        .metadata-item {
            display: flex;
            justify-content: space-between;
        }

        .metadata-label {
            color: #666;
            font-weight: 500;
        }

        .metadata-value {
            color: #333;
            font-weight: 600;
        }

        .severity-high {
            background: #FFEBEE;
            border-color: #F44336;
        }

        .severity-medium {
            background: #FFF3E0;
            border-color: #FF9800;
        }

        .severity-low {
            background: #E8F5E9;
            border-color: #4CAF50;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .empty-text {
            font-size: 14px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            padding: 16px;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .blocked-container {
                padding: 16px;
            }

            .blocked-header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .header-stats {
                width: 100%;
                justify-content: space-around;
            }

            .blocked-missions-grid {
                grid-template-columns: 1fr;
            }

            .block-metadata {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="blocked-container">
        <!-- Header -->
        <div class="blocked-header">
            <div>
                <h1>Blocked Missions</h1>
                <p style="font-size: 13px; color: #666; margin-top: 4px;">Missions waiting on dependencies, resources, or external conditions</p>
            </div>
            <div class="header-stats">
                <div class="stat-badge">
                    <div class="stat-number" id="blocked-count">0</div>
                    <div class="stat-label">Blocked</div>
                </div>
                <button class="refresh-btn" id="refresh-btn" onclick="refreshBlocked()">Refresh</button>
            </div>
        </div>

        <!-- Error Message -->
        <div id="error-container" style="display: none;"></div>

        <!-- Filter Buttons -->
        <div class="filter-buttons" id="filter-buttons"></div>

        <!-- Blocked Missions Grid -->
        <div id="blocked-grid" class="blocked-missions-grid">
            <div class="loading">
                <span class="spinner"></span>
                Loading blocked missions...
            </div>
        </div>
    </div>

    <script src="/frontend/control-engine-client.js"></script>
    <script>
        let client = new ControlEngineClient('http://localhost:8888');
        let allMissions = [];
        let blockedMissions = [];
        let currentFilter = 'all';

        // Sample blocked mission reasons (can be extended or fetched from API)
        const blockedReasons = {
            'MSN-0001': {
                reason: 'Awaiting Service Dependency',
                detail: 'Ollama LLM service is offline. Cannot proceed with AI processing.',
                service: 'ollama',
                severity: 'high',
                resolutionSteps: [
                    'Check Ollama service health',
                    'Restart Ollama container',
                    'Wait for model loading (~2-5 minutes)',
                    'Mission will auto-resume when service online'
                ]
            },
            'MSN-0002': {
                reason: 'Resource Constraint',
                detail: 'GPU memory insufficient for large model inference.',
                service: 'openclaw',
                severity: 'medium',
                resolutionSteps: [
                    'Check GPU memory availability',
                    'Reduce concurrent missions',
                    'Clear model cache',
                    'Retry mission'
                ]
            },
            'MSN-0003': {
                reason: 'Dependency Failed',
                detail: 'Previous mission (MSN-0002) failed and is required for this workflow.',
                dependsOn: 'MSN-0002',
                severity: 'high',
                resolutionSteps: [
                    'Fix blocking mission MSN-0002',
                    'Verify dependency resolution',
                    'Retry this mission'
                ]
            }
        };

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            refreshBlocked();
            setupFilterButtons();
        });

        async function refreshBlocked() {
            const refreshBtn = document.getElementById('refresh-btn');
            const errorContainer = document.getElementById('error-container');

            refreshBtn.disabled = true;
            refreshBtn.textContent = 'Refreshing...';

            try {
                // Fetch all missions
                const active = await client.getMissionsActive();
                const recent = await client.getMissionsRecent(20);

                allMissions = [...(recent.missions || []), ...(active.missions || [])];

                // Filter for blocked missions
                blockedMissions = allMissions.filter(mission => {
                    const id = mission.mission_id;
                    return blockedReasons[id] !== undefined;
                }).map(mission => {
                    const id = mission.mission_id;
                    const reason = blockedReasons[id];
                    return {
                        ...mission,
                        blocking: reason
                    };
                });

                // Clear error
                errorContainer.style.display = 'none';

                // Update UI
                updateBlockedCount();
                displayBlockedMissions();

            } catch (error) {
                console.error('Failed to fetch missions:', error);
                showError(`Failed to fetch blocked missions: ${error.message}`);
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = 'Refresh';
            }
        }

        function setupFilterButtons() {
            const filters = [
                { id: 'all', label: 'All Blocked' },
                { id: 'service', label: 'Service Dependencies' },
                { id: 'resource', label: 'Resource Constraints' },
                { id: 'dependency', label: 'Mission Dependencies' }
            ];

            const filterButtons = document.getElementById('filter-buttons');
            filterButtons.innerHTML = filters
                .map(f => `
                    <button class="filter-btn ${f.id === 'all' ? 'active' : ''}"
                            onclick="filterMissions('${f.id}')">${f.label}</button>
                `)
                .join('');
        }

        function filterMissions(filter) {
            currentFilter = filter;

            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            displayBlockedMissions();
        }

        function updateBlockedCount() {
            document.getElementById('blocked-count').textContent = blockedMissions.length;
        }

        function displayBlockedMissions() {
            const grid = document.getElementById('blocked-grid');

            if (blockedMissions.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">✅</div>
                        <div class="empty-title">No Blocked Missions</div>
                        <div class="empty-text">All missions are able to proceed</div>
                    </div>
                `;
                return;
            }

            let filtered = blockedMissions;
            if (currentFilter !== 'all') {
                filtered = filtered.filter(m => {
                    const reason = m.blocking.reason.toLowerCase();
                    if (currentFilter === 'service') return reason.includes('service');
                    if (currentFilter === 'resource') return reason.includes('resource');
                    if (currentFilter === 'dependency') return reason.includes('dependency');
                    return true;
                });
            }

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-title">No Missions Match Filter</div>
                        <div class="empty-text">Try a different filter</div>
                    </div>
                `;
                return;
            }

            const html = filtered
                .map(mission => renderBlockedCard(mission))
                .join('');

            grid.innerHTML = html;
        }

        function renderBlockedCard(mission) {
            const blocking = mission.blocking;
            const severity = blocking.severity || 'medium';
            const severityClass = `severity-${severity}`;

            const resolutionSteps = (blocking.resolutionSteps || [])
                .map(step => `<li class="resolution-step">${step}</li>`)
                .join('');

            return `
                <div class="blocked-card ${severityClass}">
                    <div class="blocked-title">🚫 ${mission.title || mission.mission_id}</div>
                    <div class="blocked-id">${mission.mission_id}</div>

                    <div class="block-reason">
                        <div class="block-reason-label">🔒 Blocking Reason</div>
                        <div class="block-reason-text">${blocking.reason}</div>
                        <div class="block-reason-detail">${blocking.detail}</div>
                    </div>

                    <div class="resolution-steps">
                        <div class="resolution-label">✓ How to Resolve</div>
                        <ul class="resolution-steps-list">
                            ${resolutionSteps}
                        </ul>
                    </div>

                    <div class="block-metadata">
                        <div class="metadata-item">
                            <span class="metadata-label">Domain:</span>
                            <span class="metadata-value">${mission.domain || 'General'}</span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Status:</span>
                            <span class="metadata-value">Blocked</span>
                        </div>
                        ${blocking.service ? `
                        <div class="metadata-item">
                            <span class="metadata-label">Service:</span>
                            <span class="metadata-value">${blocking.service}</span>
                        </div>
                        ` : ''}
                        ${blocking.dependsOn ? `
                        <div class="metadata-item">
                            <span class="metadata-label">Depends On:</span>
                            <span class="metadata-value">${blocking.dependsOn}</span>
                        </div>
                        ` : ''}
                        <div class="metadata-item">
                            <span class="metadata-label">Severity:</span>
                            <span class="metadata-value">${severity.toUpperCase()}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `<div class="error-message">⚠️ ${message}</div>`;
            errorContainer.style.display = 'block';
        }
    </script>
</body>
</html>
