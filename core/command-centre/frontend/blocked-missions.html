<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocked Missions</title>
    <link rel="stylesheet" href="/theme-starfleet-advanced.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e27;
            padding: 20px;
        }

        .brief-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 40px;
            border-bottom: 3px solid #FFD700;
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header-left h1 {
            font-size: 32px;
            font-weight: bold;
            color: #FFD700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .header-left h1::before {
            content: "⬤ ";
            margin-right: 8px;
        }

        .header-left p { color: #BBB; font-size: 14px; }

        .header-stats {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .stat-badge { text-align: center; }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #FFD700;
            letter-spacing: 1px;
        }

        .stat-label {
            font-size: 12px;
            color: #AAA;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .refresh-btn {
            padding: 10px 20px;
            background: #FFD700;
            color: #000;
            border: 2px solid #FFD700;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .refresh-btn:hover {
            background: #FFA500;
            border-color: #FFA500;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .refresh-btn:disabled {
            background: #444;
            border-color: #666;
            color: #888;
            cursor: not-allowed;
        }

        /* Trust Indicator Banner */
        .trust-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            text-transform: uppercase;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .trust-banner.trust-loading     { background: rgba(100,100,120,0.2); color: #888; border: 1px solid #444; }
        .trust-banner.trust-live        { background: rgba(76,175,80,0.15); color: #4CAF50; border: 1px solid #4CAF50; }
        .trust-banner.trust-unavailable { background: rgba(244,67,54,0.15); color: #EF5350; border: 1px solid #EF5350; }
        .trust-source { font-weight: 400; font-size: 11px; opacity: 0.85; }
        .trust-time   { font-weight: 400; font-size: 11px; opacity: 0.7; margin-left: auto; }

        /* Blocked Mission Cards */
        .blocked-missions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .blocked-card {
            background: #1a1a2e;
            border-left: 4px solid #EF5350;
            border-top: 1px solid #333;
            border-right: 1px solid #333;
            border-bottom: 1px solid #333;
            border-radius: 4px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .blocked-card:hover {
            box-shadow: 0 0 15px rgba(239,83,80,0.2);
            transform: translateY(-2px);
        }

        .blocked-title {
            font-size: 15px;
            font-weight: 700;
            color: #FFF;
            margin-bottom: 6px;
        }

        .blocked-id {
            font-size: 11px;
            color: #888;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .block-reason {
            background: #0a0e27;
            border-left: 2px solid #FFD700;
            padding: 10px 12px;
            border-radius: 0 3px 3px 0;
            margin-bottom: 14px;
        }

        .block-reason-label {
            font-size: 10px;
            font-weight: 700;
            color: #FFD700;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .block-reason-text {
            font-size: 13px;
            color: #CCC;
            line-height: 1.5;
        }

        .block-metadata {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 12px;
            background: #0a0e27;
            border-radius: 4px;
            font-size: 12px;
        }

        .metadata-item {
            display: flex;
            justify-content: space-between;
        }

        .metadata-label { color: #888; font-weight: 500; }
        .metadata-value { color: #FFD700; font-weight: 600; }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-title { font-size: 18px; font-weight: 600; color: #BBB; margin-bottom: 8px; }
        .empty-text { font-size: 13px; color: #888; }

        .loading { text-align: center; padding: 40px; color: #BBB; }

        .spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 3px solid #333;
            border-top: 3px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            padding: 14px 16px;
            background: #1a1a2e;
            color: #EF5350;
            border: 1px solid #EF5350;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .footer-info {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #888;
            font-size: 12px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .blocked-container {
                padding: 16px;
            }

            .blocked-header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .header-stats {
                width: 100%;
                justify-content: space-around;
            }

            .blocked-missions-grid {
                grid-template-columns: 1fr;
            }

            .block-metadata {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="brief-container">
        <div class="header">
            <div class="header-left">
                <h1>Blocked Missions</h1>
                <p>Starship Endeavour — Missions waiting on dependencies or external conditions</p>
            </div>
            <div class="header-stats">
                <div class="stat-badge">
                    <div class="stat-number" id="blocked-count">0</div>
                    <div class="stat-label">Blocked</div>
                </div>
                <button class="refresh-btn" id="refresh-btn" onclick="refreshBlocked()">Refresh</button>
            </div>
        </div>

        <!-- Trust Indicator -->
        <div id="trust-banner" class="trust-banner trust-loading">
            <span id="trust-label">⏳ LOADING</span>
            <span class="trust-source" id="trust-source"></span>
            <span class="trust-time" id="trust-time"></span>
        </div>

        <!-- Error Message -->
        <div id="error-container" style="display: none;"></div>

        <div id="blocked-grid" class="blocked-missions-grid">
            <div class="loading">
                <span class="spinner"></span>
                Loading blocked missions...
            </div>
        </div>

        <div class="footer-info">
            <span>Source: Supabase missions — status=blocked filter</span>
            <span style="margin-left: 20px;">Auto-refresh every 30 seconds</span>
        </div>
    </div>

    <script>
        // Data source: /api/dashboard/blocked-missions (Supabase missions filtered by status=blocked)
        // No hardcoded mock data. No Supabase credentials in this file.
        const CONTROL_ENGINE = 'http://localhost:8888';

        let blockedMissions = [];

        function setTrustState(state, opts) {
            opts = opts || {};
            const banner   = document.getElementById('trust-banner');
            const labelEl  = document.getElementById('trust-label');
            const sourceEl = document.getElementById('trust-source');
            const timeEl   = document.getElementById('trust-time');
            const icons  = { loading: '⏳', live: '🟢', unavailable: '🔴' };
            const labels = { loading: 'LOADING', live: 'LIVE', unavailable: 'UNAVAILABLE' };
            banner.className = 'trust-banner trust-' + state;
            labelEl.textContent  = (icons[state] || '') + ' ' + (labels[state] || state.toUpperCase());
            sourceEl.textContent = opts.source ? '— ' + opts.source : '';
            timeEl.textContent   = opts.time   ? opts.time           : '';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', () => {
            refreshBlocked();
            setInterval(refreshBlocked, 30000);
        });

        async function refreshBlocked() {
            const refreshBtn = document.getElementById('refresh-btn');
            refreshBtn.disabled = true;
            refreshBtn.textContent = 'Refreshing...';
            setTrustState('loading');

            try {
                const response = await fetch(`${CONTROL_ENGINE}/api/dashboard/blocked-missions`);

                if (!response.ok) {
                    throw new Error(`Control Engine error: ${response.status}`);
                }

                const envelope = await response.json();
                const fetchTime = new Date().toLocaleTimeString();
                blockedMissions = Array.isArray(envelope.data) ? envelope.data : [];

                setTrustState('live', {
                    source: envelope.source_label || 'Supabase missions — blocked filter',
                    time: fetchTime,
                });
                document.getElementById('error-container').style.display = 'none';

            } catch (error) {
                console.error('[Blocked Missions] Fetch error:', error);
                blockedMissions = [];
                setTrustState('unavailable', { source: 'Control Engine unreachable (localhost:8888)' });
                const ec = document.getElementById('error-container');
                ec.innerHTML = `<div class="error-message">⚠️ Cannot reach Control Engine. Check that control_engine.py is running on port 8888.</div>`;
                ec.style.display = 'block';
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = 'Refresh';
                document.getElementById('blocked-count').textContent = blockedMissions.length;
                displayBlockedMissions();
            }
        }

        function displayBlockedMissions() {
            const grid = document.getElementById('blocked-grid');

            if (blockedMissions.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">✅</div>
                        <div class="empty-title">No Blocked Missions</div>
                        <div class="empty-text">No missions with status "blocked" found in Supabase</div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = blockedMissions.map(m => `
                <div class="blocked-card">
                    <div class="blocked-title">🚫 ${escapeHtml(m.title || m.mission_id)}</div>
                    <div class="blocked-id">${escapeHtml(m.mission_id || m.id || '—')}</div>

                    <div class="block-reason">
                        <div class="block-reason-label">📋 Description</div>
                        <div class="block-reason-text">${escapeHtml(m.description || 'No description recorded')}</div>
                    </div>

                    <div class="block-metadata">
                        <div class="metadata-item">
                            <span class="metadata-label">Owner:</span>
                            <span class="metadata-value">${escapeHtml(m.created_by || 'Unassigned')}</span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Type:</span>
                            <span class="metadata-value">${escapeHtml(m.task_type || 'N/A')}</span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Status:</span>
                            <span class="metadata-value">BLOCKED</span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Created:</span>
                            <span class="metadata-value">${m.created_at ? new Date(m.created_at).toLocaleDateString() : 'N/A'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
