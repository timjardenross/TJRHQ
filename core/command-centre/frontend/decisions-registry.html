<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decisions Registry - USS TJR Command Centre</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 100%);
            color: #e0e0e0;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #FFD700;
            padding-bottom: 20px;
        }

        .header h1 {
            color: #FFD700;
            font-size: 2.5em;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .header p {
            color: #00FFFF;
            font-size: 1.1em;
            letter-spacing: 2px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-box {
            border: 2px solid #FFD700;
            padding: 20px;
            text-align: center;
            background: rgba(255, 215, 0, 0.05);
            border-radius: 5px;
        }

        .stat-box .number {
            font-size: 2.5em;
            color: #FFD700;
            font-weight: bold;
        }

        .stat-box .label {
            color: #00FFFF;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: 2px solid #FFD700;
            color: #FFD700;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
            transition: all 0.3s ease;
            border-radius: 3px;
        }

        .tab-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #FFD700;
        }

        .tab-btn.active {
            background: #FFD700;
            color: #0a0e27;
            font-weight: bold;
        }

        .admin-btn {
            padding: 12px 20px;
            background: #00FFFF;
            border: none;
            color: #0a0e27;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: #FFD700;
            transform: scale(1.05);
        }

        .decisions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .decision-card {
            border: 2px solid #00FFFF;
            background: rgba(0, 255, 255, 0.05);
            padding: 20px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .decision-card:hover {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.05);
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .decision-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .decision-id {
            color: #00FFFF;
            font-weight: bold;
            font-size: 0.9em;
            letter-spacing: 1px;
        }

        .decision-status {
            padding: 4px 12px;
            border-radius: 3px;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-active {
            background: #00FF00;
            color: #000;
        }

        .status-inactive {
            background: #888;
            color: #fff;
        }

        .status-superseded {
            background: #FF6600;
            color: #fff;
        }

        .decision-title {
            color: #FFD700;
            font-size: 1.2em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .decision-statement {
            color: #e0e0e0;
            margin-bottom: 12px;
            line-height: 1.5;
            font-size: 0.95em;
        }

        .decision-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.85em;
            border-top: 1px solid rgba(0, 255, 255, 0.3);
            padding-top: 15px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
        }

        .meta-label {
            color: #00FFFF;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
        }

        .meta-value {
            color: #FFD700;
            font-weight: bold;
        }

        .alternatives-count {
            color: #00FFFF;
            font-size: 0.85em;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 255, 255, 0.2);
        }

        .decision-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            border-top: 1px solid rgba(0, 255, 255, 0.2);
            padding-top: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 12px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00FFFF;
            color: #00FFFF;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            text-transform: uppercase;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #00FFFF;
            color: #0a0e27;
            font-weight: bold;
        }

        .action-btn.edit {
            background: rgba(255, 215, 0, 0.1);
            border-color: #FFD700;
            color: #FFD700;
        }

        .action-btn.edit:hover {
            background: #FFD700;
            color: #0a0e27;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state .icon {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #00FFFF;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 255, 255, 0.3);
            border-top-color: #00FFFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📋 DECISIONS REGISTRY</h1>
            <p>USS TJR Architectural Decisions & Alternatives</p>
        </div>

        <!-- Stats -->
        <div class="stats-container">
            <div class="stat-box">
                <div class="number" id="stat-active">0</div>
                <div class="label">Active</div>
            </div>
            <div class="stat-box">
                <div class="number" id="stat-inactive">0</div>
                <div class="label">Inactive</div>
            </div>
            <div class="stat-box">
                <div class="number" id="stat-superseded">0</div>
                <div class="label">Superseded</div>
            </div>
            <div class="stat-box">
                <div class="number" id="stat-total">0</div>
                <div class="label">Total</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="filter-group">
                <button class="tab-btn active" data-tab="all">📋 All Decisions</button>
                <button class="tab-btn" data-tab="active">✅ Active</button>
                <button class="tab-btn" data-tab="inactive">⏸ Inactive</button>
                <button class="tab-btn" data-tab="superseded">↪️ Superseded</button>
            </div>
            <button class="admin-btn" onclick="openAdminPanel()">⚙️ Manage in Supabase</button>
        </div>

        <!-- Decisions Grid -->
        <div class="decisions-grid" id="decisions-grid">
            <div class="loading">
                <span class="spinner"></span>
                Loading decisions...
            </div>
        </div>
    </div>

    <!-- Decisions Registry Logic -->
    <script>
        // Supabase Configuration - Anon Key Only (RLS enforced)
        const SUPABASE_URL = 'https://cjvrpjwewsrumnbdydgg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqdnJwandld3NydW1uYmR5ZGdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTYyMjgsImV4cCI6MjA5NjE3MjIyOH0.MNm9UB_xTsLslHxWdg7mITDgQ0zPnciJUG3tpmp6Mjw';

        // Debug mode
        const DEBUG = true;

        let allDecisions = [];
        let currentTab = 'all';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            fetchDecisionsFromSupabase();
            setInterval(fetchDecisionsFromSupabase, 30000); // Auto-refresh every 30 seconds
        });

        async function fetchDecisionsFromSupabase() {
            try {
                const endpoint = `${SUPABASE_URL}/rest/v1/decisions?select=*&order=created_at.desc`;

                if (DEBUG) console.log('[Decisions Registry] Fetching from:', endpoint);

                const response = await fetch(endpoint, {
                    mode: 'cors',
                    credentials: 'omit',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Content-Type': 'application/json'
                    }
                });

                if (DEBUG) console.log('[Decisions Registry] Response status:', response.status);

                if (!response.ok) {
                    throw new Error(`API error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                if (DEBUG) console.log('[Decisions Registry] Raw data:', data);

                if (data && Array.isArray(data) && data.length > 0) {
                    console.log(`[Decisions Registry] ✓ Loaded ${data.length} decisions from Supabase`);
                    allDecisions = data.map(d => ({
                        id: d.id,
                        statement: d.statement,
                        rationale: d.rationale || 'No rationale provided',
                        status: (d.status || 'Active').toLowerCase(),
                        owner: d.owner || d.created_by || 'Unassigned',
                        createdAt: new Date(d.created_at).toISOString().split('T')[0],
                        updatedAt: d.updated_at ? new Date(d.updated_at).toISOString().split('T')[0] : 'N/A',
                        alternatives: Array.isArray(d.alternatives) ? d.alternatives : []
                    }));
                } else {
                    console.log('[Decisions Registry] No records in database');
                    allDecisions = [];
                }

                const statuses = [...new Set(allDecisions.map(d => d.status))];
                console.log('[Decisions Registry] Unique statuses in data:', statuses);

                renderDecisions();
                updateStats();
            } catch (error) {
                console.error('[Decisions Registry] ✗ Fetch error:', error);
                allDecisions = [];
                renderDecisions();
                updateStats();
            }
        }

        function setupEventListeners() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentTab = e.target.dataset.tab;
                    renderDecisions();
                });
            });
        }

        function getFilteredDecisions() {
            let filtered = allDecisions;

            if (currentTab === 'all') {
                filtered = allDecisions;
            } else if (currentTab === 'active') {
                filtered = allDecisions.filter(d => d.status === 'active');
            } else if (currentTab === 'inactive') {
                filtered = allDecisions.filter(d => d.status === 'inactive');
            } else if (currentTab === 'superseded') {
                filtered = allDecisions.filter(d => d.status === 'superseded');
            }

            return filtered;
        }

        function renderDecisions() {
            const grid = document.getElementById('decisions-grid');
            const decisions = getFilteredDecisions();

            if (decisions.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="icon">📭</div>
                        <h2>No decisions found</h2>
                        <p>Try adjusting your filters or create a new decision</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = decisions.map(decision => `
                <div class="decision-card">
                    <div class="decision-header">
                        <div class="decision-id">${decision.id}</div>
                        <div class="decision-status status-${decision.status}">
                            ${decision.status.toUpperCase()}
                        </div>
                    </div>

                    <div class="decision-title">
                        ${decision.statement.substring(0, 60)}${decision.statement.length > 60 ? '...' : ''}
                    </div>

                    <div class="decision-statement">
                        ${decision.rationale.substring(0, 150)}${decision.rationale.length > 150 ? '...' : ''}
                    </div>

                    <div class="decision-meta">
                        <div class="meta-item">
                            <div class="meta-label">Owner</div>
                            <div class="meta-value">${decision.owner}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Created</div>
                            <div class="meta-value">${decision.createdAt}</div>
                        </div>
                    </div>

                    ${decision.alternatives.length > 0 ? `
                        <div class="alternatives-count">
                            🔄 ${decision.alternatives.length} alternative(s) considered
                        </div>
                    ` : ''}

                    <div class="decision-actions">
                        <button class="action-btn" onclick="viewDecision('${decision.id}')">View</button>
                        <button class="action-btn edit" onclick="editDecision('${decision.id}')">Edit</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const stats = {
                active: allDecisions.filter(d => d.status === 'active').length,
                inactive: allDecisions.filter(d => d.status === 'inactive').length,
                superseded: allDecisions.filter(d => d.status === 'superseded').length,
                total: allDecisions.length
            };

            document.getElementById('stat-active').textContent = stats.active;
            document.getElementById('stat-inactive').textContent = stats.inactive;
            document.getElementById('stat-superseded').textContent = stats.superseded;
            document.getElementById('stat-total').textContent = stats.total;
        }

        function viewDecision(decisionId) {
            const decision = allDecisions.find(d => d.id === decisionId);
            if (decision) {
                alert(`Decision: ${decision.statement}\n\nRationale: ${decision.rationale}`);
            }
        }

        function editDecision(decisionId) {
            alert(`Edit decision ${decisionId} - Implementation coming soon`);
        }

        function openAdminPanel() {
            window.open('https://app.supabase.com/project/cjvrpjwewsrumnbdydgg/editor/28843', '_blank');
        }
    </script>
</body>
</html>
