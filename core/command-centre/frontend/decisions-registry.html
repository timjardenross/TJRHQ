<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decisions Registry - USS TJR Command Centre</title>
    <link rel="stylesheet" href="/theme-starfleet-advanced.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            padding: 20px;
            color: #FFF;
        }

        .brief-container { max-width: 1400px; margin: 0 auto; }

        .header {
            margin-bottom: 40px;
            border-bottom: 3px solid #FFD700;
            padding-bottom: 20px;
        }
        .header h1 {
            font-size: 32px;
            color: #FFD700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .header h1::before { content: "⬤ "; margin-right: 8px; }
        .header p { color: #BBB; font-size: 14px; }

        /* Trust banner */
        .trust-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            text-transform: uppercase;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .trust-banner.trust-loading     { background: rgba(100,100,120,0.2); color: #888;    border: 1px solid #444; }
        .trust-banner.trust-live        { background: rgba(76,175,80,0.15);  color: #4CAF50; border: 1px solid #4CAF50; }
        .trust-banner.trust-stale       { background: rgba(255,152,0,0.15);  color: #FF9800; border: 1px solid #FF9800; }
        .trust-banner.trust-unavailable { background: rgba(244,67,54,0.15);  color: #EF5350; border: 1px solid #EF5350; }
        .trust-source { font-weight: 400; font-size: 11px; opacity: 0.85; }
        .trust-time   { font-weight: 400; font-size: 11px; opacity: 0.7; margin-left: auto; }

        /* Stat cards — matches commander brief */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #1a1a2e;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .stat-card:hover { border-color: #FFD700; box-shadow: 0 0 15px rgba(255,215,0,0.2); }
        .stat-card .number {
            font-size: 48px;
            font-weight: bold;
            color: #FFD700;
            line-height: 1;
        }
        .stat-card .label {
            color: #BBB;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }

        .tab-btn {
            padding: 10px 18px;
            background: #1a1a2e;
            border: 2px solid #333;
            color: #BBB;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
            transition: all 0.3s ease;
            border-radius: 4px;
        }
        .tab-btn:hover { border-color: #FFD700; color: #FFD700; }
        .tab-btn.active { background: #FFD700; color: #0a0e27; border-color: #FFD700; font-weight: bold; }

        .admin-btn {
            padding: 10px 18px;
            background: #FFD700;
            border: none;
            color: #0a0e27;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 13px;
            transition: all 0.3s ease;
        }
        .admin-btn:hover { background: #FFA500; }

        /* Decision cards */
        .decisions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 8px;
        }

        .decision-card {
            background: #1a1a2e;
            border: 2px solid #333;
            padding: 20px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        .decision-card:hover {
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255,215,0,0.2);
            transform: translateY(-3px);
        }

        .decision-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .decision-id {
            color: #888;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .decision-status {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-active    { background: rgba(76,175,80,0.2);  color: #4CAF50; border: 1px solid #4CAF50; }
        .status-inactive  { background: rgba(158,158,158,0.2); color: #9E9E9E; border: 1px solid #9E9E9E; }
        .status-superseded { background: rgba(255,152,0,0.2); color: #FF9800; border: 1px solid #FF9800; }

        .decision-title {
            color: #FFD700;
            font-size: 15px;
            margin-bottom: 10px;
            font-weight: 600;
            line-height: 1.4;
        }

        .decision-statement {
            color: #CCC;
            margin-bottom: 14px;
            line-height: 1.5;
            font-size: 13px;
        }

        .decision-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
            font-size: 12px;
            border-top: 1px solid #333;
            padding-top: 14px;
        }
        .meta-item { display: flex; flex-direction: column; }
        .meta-label { color: #888; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; }
        .meta-value { color: #FFD700; font-weight: 600; margin-top: 2px; }

        .alternatives-count {
            color: #888;
            font-size: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #333;
        }

        .decision-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            border-top: 1px solid #333;
            padding-top: 14px;
        }
        .action-btn {
            flex: 1;
            padding: 8px 12px;
            background: #0a0e27;
            border: 1px solid #333;
            color: #BBB;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            text-transform: uppercase;
            border-radius: 3px;
            transition: all 0.2s ease;
        }
        .action-btn:hover { border-color: #FFD700; color: #FFD700; }
        .action-btn.edit  { border-color: #FFD700; color: #FFD700; }
        .action-btn.edit:hover { background: #FFD700; color: #0a0e27; }

        .empty-state { text-align: center; padding: 60px 20px; color: #888; }
        .empty-state .icon { font-size: 3em; margin-bottom: 20px; }

        .loading { text-align: center; padding: 40px; color: #BBB; }
        .spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 3px solid #333;
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-info {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="brief-container">
        <div class="header">
            <h1>Decisions Registry</h1>
            <p>USS TJR — Architectural decisions & alternatives</p>
        </div>

        <div id="trust-banner" class="trust-banner trust-loading">
            <span id="trust-label">⏳ LOADING</span>
            <span class="trust-source" id="trust-source"></span>
            <span class="trust-time" id="trust-time"></span>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="number" id="stat-active">0</div>
                <div class="label">Active</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-inactive">0</div>
                <div class="label">Inactive</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-superseded">0</div>
                <div class="label">Superseded</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-total">0</div>
                <div class="label">Total</div>
            </div>
        </div>

        <div class="controls">
            <div class="filter-group">
                <button class="tab-btn active" data-tab="all">All Decisions</button>
                <button class="tab-btn" data-tab="active">Active</button>
                <button class="tab-btn" data-tab="inactive">Inactive</button>
                <button class="tab-btn" data-tab="superseded">Superseded</button>
            </div>
            <button class="admin-btn" onclick="openAdminPanel()">Manage in Supabase</button>
        </div>

        <div class="decisions-grid" id="decisions-grid">
            <div class="loading">
                <span class="spinner"></span>
                Loading decisions...
            </div>
        </div>

        <div class="footer-info">
            <span>Auto-refresh every 30 seconds</span>
        </div>
    </div>

    <!-- Decisions Registry Logic -->
    <script>
        // Data is fetched via the Control Engine proxy (localhost:8888).
        // No Supabase credentials in this file.
        const CONTROL_ENGINE = ((window.CC_CONFIG&&window.CC_CONFIG.apiBase)||localStorage.getItem('cc_api_base')||(location.port?location.protocol+'//'+location.hostname+':5000':location.origin));

        const DEBUG = true;
        let allDecisions = [];
        let currentTab = 'all';

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setTrustState(state, opts) {
            opts = opts || {};
            const banner  = document.getElementById('trust-banner');
            const labelEl = document.getElementById('trust-label');
            const sourceEl = document.getElementById('trust-source');
            const timeEl   = document.getElementById('trust-time');
            const icons  = { loading: '⏳', live: '🟢', stale: '🟡', unavailable: '🔴' };
            const labels = { loading: 'LOADING', live: 'LIVE', stale: 'STALE', unavailable: 'UNAVAILABLE' };
            banner.className = 'trust-banner trust-' + state;
            labelEl.textContent = (icons[state] || '') + ' ' + (labels[state] || state.toUpperCase());
            sourceEl.textContent = opts.source ? '— ' + opts.source : '';
            timeEl.textContent   = opts.time   ? opts.time           : '';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            fetchDecisionsFromSupabase();
            setInterval(fetchDecisionsFromSupabase, 30000); // Auto-refresh every 30 seconds
        });

        async function fetchDecisionsFromSupabase() {
            setTrustState('loading');
            try {
                const endpoint = `${CONTROL_ENGINE}/api/dashboard/decisions`;
                if (DEBUG) console.log('[Decisions Registry] Fetching from:', endpoint);

                const response = await fetch(endpoint);
                if (DEBUG) console.log('[Decisions Registry] Response status:', response.status);

                if (!response.ok) {
                    throw new Error(`Control Engine error: ${response.status} ${response.statusText}`);
                }

                const envelope = await response.json();
                if (DEBUG) console.log('[Decisions Registry] Response:', envelope);

                const data = envelope.data;
                const fetchTime = new Date().toLocaleTimeString();

                if (data && Array.isArray(data) && data.length > 0) {
                    console.log(`[Decisions Registry] ✓ Loaded ${data.length} decisions`);
                    allDecisions = data.map(d => {
                        const hd = (d.human_decision || '').toLowerCase();
                        let status = 'active';
                        if (hd.startsWith('reject')) status = 'inactive';
                        else if (hd === 'superseded') status = 'superseded';
                        return {
                            id: d.id,
                            statement: d.recommendation_text || d.statement || 'No recommendation recorded',
                            rationale: d.decision_reason || d.rationale || 'No rationale provided',
                            verdict: d.human_decision || 'Pending',
                            status,
                            owner: d.decision_maker || d.owner || 'Unassigned',
                            missionId: d.mission_id || '',
                            createdAt: d.decision_timestamp ? new Date(d.decision_timestamp).toISOString().split('T')[0] : 'N/A',
                            updatedAt: d.captured_timestamp ? new Date(d.captured_timestamp).toISOString().split('T')[0] : 'N/A',
                            alternatives: Array.isArray(d.alternatives) ? d.alternatives : []
                        };
                    });
                    setTrustState('live', {
                        source: envelope.source || 'Supabase decisions',
                        time: fetchTime,
                    });
                } else {
                    console.log('[Decisions Registry] Backend OK — 0 decisions in table');
                    allDecisions = [];
                    setTrustState('live', {
                        source: (envelope.source || 'Supabase decisions') + ' — 0 records',
                        time: fetchTime,
                    });
                }

                if (DEBUG) {
                    const statuses = [...new Set(allDecisions.map(d => d.status))];
                    console.log('[Decisions Registry] Unique statuses:', statuses);
                }

                renderDecisions();
                updateStats();
            } catch (error) {
                console.error('[Decisions Registry] ✗ Fetch error:', error);
                allDecisions = [];
                setTrustState('unavailable', { source: 'Control Engine unreachable' });
                renderDecisions();
                updateStats();
            }
        }

        function setupEventListeners() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentTab = e.target.dataset.tab;
                    renderDecisions();
                });
            });
        }

        function getFilteredDecisions() {
            let filtered = allDecisions;

            if (currentTab === 'all') {
                filtered = allDecisions;
            } else if (currentTab === 'active') {
                filtered = allDecisions.filter(d => d.status === 'active');
            } else if (currentTab === 'inactive') {
                filtered = allDecisions.filter(d => d.status === 'inactive');
            } else if (currentTab === 'superseded') {
                filtered = allDecisions.filter(d => d.status === 'superseded');
            }

            return filtered;
        }

        function renderDecisions() {
            const grid = document.getElementById('decisions-grid');
            const decisions = getFilteredDecisions();

            if (decisions.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="icon">📭</div>
                        <h2>No decisions found</h2>
                        <p>Try adjusting your filters or create a new decision</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = decisions.map(decision => `
                <div class="decision-card">
                    <div class="decision-header">
                        <div class="decision-id">${escapeHtml(decision.id)}${decision.missionId ? ' · ' + escapeHtml(decision.missionId) : ''}</div>
                        <div class="decision-status status-${decision.status}">
                            ${escapeHtml(decision.verdict)}
                        </div>
                    </div>

                    <div class="decision-title">
                        ${escapeHtml(decision.statement.substring(0, 80))}${decision.statement.length > 80 ? '…' : ''}
                    </div>

                    <div class="decision-statement">
                        ${escapeHtml(decision.rationale.substring(0, 160))}${decision.rationale.length > 160 ? '…' : ''}
                    </div>

                    <div class="decision-meta">
                        <div class="meta-item">
                            <div class="meta-label">Decision Maker</div>
                            <div class="meta-value">${escapeHtml(decision.owner)}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Date</div>
                            <div class="meta-value">${decision.createdAt}</div>
                        </div>
                    </div>

                    ${decision.alternatives.length > 0 ? `
                        <div class="alternatives-count">
                            🔄 ${decision.alternatives.length} alternative(s) considered
                        </div>
                    ` : ''}

                    <div class="decision-actions">
                        <button class="action-btn" onclick="viewDecision('${decision.id}')">View</button>
                        <button class="action-btn edit" onclick="editDecision('${decision.id}')">Edit</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const stats = {
                active: allDecisions.filter(d => d.status === 'active').length,
                inactive: allDecisions.filter(d => d.status === 'inactive').length,
                superseded: allDecisions.filter(d => d.status === 'superseded').length,
                total: allDecisions.length
            };

            document.getElementById('stat-active').textContent = stats.active;
            document.getElementById('stat-inactive').textContent = stats.inactive;
            document.getElementById('stat-superseded').textContent = stats.superseded;
            document.getElementById('stat-total').textContent = stats.total;
        }

        function viewDecision(decisionId) {
            const decision = allDecisions.find(d => d.id === decisionId);
            if (decision) {
                alert(`Decision: ${decision.statement}\n\nRationale: ${decision.rationale}`);
            }
        }

        function editDecision(decisionId) {
            alert(`Edit decision ${decisionId} - Implementation coming soon`);
        }

        function openAdminPanel() {
            window.open('https://app.supabase.com/project/cjvrpjwewsrumnbdydgg/editor/28843', '_blank');
        }
    </script>
</body>
</html>
