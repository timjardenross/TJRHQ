<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARFLEET COMMAND CENTRE</title>
  <link rel="stylesheet" href="widgets.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom, #0a0e27 0%, #1a1f3a 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e0e6ff;
      min-height: 100vh;
      padding: 0;
      position: relative;
    }

    /* Starfield background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 60px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 50px 50px, #fff, rgba(0,0,0,0));
      background-size: 500px 500px;
      background-position: 0 0;
      pointer-events: none;
      opacity: 0.1;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px;
      border-bottom: 2px solid rgba(0, 204, 255, 0.3);
    }

    .header-title {
      font-size: 32px;
      font-weight: 700;
      color: #00ccff;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .header-subtitle {
      font-size: 14px;
      color: #a0a6c0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 50, 102, 0.4);
      border: 1px solid rgba(0, 204, 255, 0.2);
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 30px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #00dd00;
    }

    .status-indicator.warning {
      background-color: #ffaa00;
    }

    .status-indicator.critical {
      background-color: #ff4444;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    @media (max-width: 1200px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    .widget-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 50, 102, 0.4);
      border: 1px solid rgba(0, 204, 255, 0.2);
      border-radius: 6px;
      padding: 12px 16px;
      margin-top: 30px;
      font-size: 12px;
    }

    .control-buttons {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 8px 16px;
      background: linear-gradient(135deg, rgba(0, 204, 255, 0.2), rgba(0, 102, 204, 0.2));
      border: 1px solid rgba(0, 204, 255, 0.4);
      color: #00ccff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    button:hover {
      background: linear-gradient(135deg, rgba(0, 204, 255, 0.3), rgba(0, 102, 204, 0.3));
      border-color: #00ccff;
      box-shadow: 0 0 10px rgba(0, 204, 255, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .timestamp {
      font-size: 12px;
      color: #a0a6c0;
    }

    .auto-refresh-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .toggle-switch {
      position: relative;
      width: 40px;
      height: 20px;
      background-color: rgba(0, 204, 255, 0.2);
      border: 1px solid rgba(0, 204, 255, 0.4);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-switch.active {
      background-color: rgba(0, 221, 0, 0.3);
      border-color: #00dd00;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background-color: #00ccff;
      border-radius: 8px;
      transition: left 0.2s ease;
    }

    .toggle-switch.active::after {
      left: 22px;
      background-color: #00dd00;
    }

    .debug-mode {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #00ccff;
      border-radius: 4px;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      color: #00dd00;
      max-width: 300px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
    }

    .debug-mode.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header">
      <div class="header-title">⚡ STARFLEET COMMAND</div>
      <div class="header-subtitle">Starship Endeavour NCC-170230 | Command Centre</div>
    </div>

    <!-- STATUS BAR -->
    <div class="status-bar">
      <div class="status-item">
        <span class="status-indicator"></span>
        <span id="system-status">Systems Operational</span>
      </div>
      <div class="status-item">
        <span>Connected to Phase 2 API</span>
      </div>
      <div class="status-item" id="last-update">
        <span>Last updated: —</span>
      </div>
    </div>

    <!-- DASHBOARD GRID -->
    <div class="dashboard-grid">
      <!-- Column 1 -->
      <div class="widget-container">
        <div id="brief-widget"></div>
        <div id="queue-widget"></div>
      </div>

      <!-- Column 2 -->
      <div class="widget-container">
        <div id="escalations-widget"></div>
        <div id="systems-widget"></div>
      </div>
    </div>

    <!-- CONTROL BAR -->
    <div class="control-bar">
      <div>
        <span class="timestamp" id="footer-timestamp">Timestamp: —</span>
      </div>

      <div class="control-buttons">
        <button id="refresh-btn">🔄 Refresh Now</button>
        <button id="debug-toggle">🐛 Debug</button>
      </div>

      <div class="auto-refresh-toggle">
        <span>Auto-refresh:</span>
        <div id="auto-refresh-toggle" class="toggle-switch active" title="Click to toggle auto-refresh"></div>
      </div>
    </div>
  </div>

  <!-- DEBUG CONSOLE -->
  <div id="debug-console" class="debug-mode">
    <div style="margin-bottom: 8px; font-weight: bold;">Debug Console</div>
    <div id="debug-output"></div>
  </div>

  <!-- SCRIPTS -->
  <script src="api-client.js"></script>
  <script src="widgets.js"></script>
  <script src="command-centre.js"></script>
</body>
</html>
