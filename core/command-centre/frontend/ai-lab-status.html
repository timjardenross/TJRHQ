<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lab Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            padding: 20px;
        }

        .lab-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #1a1a2e;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            padding: 28px;
            border: 3px solid #0099FF;
        }

        .lab-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            border-bottom: 3px solid #0099FF;
            padding-bottom: 20px;
        }

        .lab-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lab-icon {
            font-size: 32px;
        }

        .lab-header h1 {
            font-size: 32px;
            font-weight: bold;
            color: #0099FF;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .lab-header h1::before {
            content: "◆ ";
            margin-right: 8px;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .refresh-btn {
            padding: 10px 20px;
            background: #0099FF;
            color: #000;
            border: 2px solid #0099FF;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .refresh-btn:hover {
            background: #00CCFF;
            border-color: #00CCFF;
            box-shadow: 0 0 15px rgba(0, 153, 255, 0.5);
        }

        .refresh-btn:disabled {
            background: #444;
            border-color: #666;
            color: #888;
            cursor: not-allowed;
        }

        /* Service Panels */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .service-panel {
            border-radius: 8px;
            padding: 24px;
            background: linear-gradient(135deg, #2a2a3e 0%, #353550 100%);
            border: 2px solid #0099FF;
            transition: all 0.3s ease;
        }

        .service-panel:hover {
            box-shadow: 0 8px 24px rgba(0, 153, 255, 0.2);
            border-color: #00CCFF;
            transform: translateY(-2px);
        }

        .service-panel.operational {
            border-color: #4CAF50;
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.1) 0%, #2a2a3e 100%);
        }

        .service-panel.degraded {
            border-color: #FF9800;
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.1) 0%, #2a2a3e 100%);
        }

        .service-panel.offline {
            border-color: #F44336;
            background: linear-gradient(135deg, rgba(244, 67, 54, 0.1) 0%, #2a2a3e 100%);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #0099FF;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .panel-icon {
            font-size: 24px;
        }

        .status-badge {
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.operational {
            background: rgba(76, 175, 80, 0.2);
            color: #00DD00;
            border: 1px solid #4CAF50;
        }

        .status-badge.degraded {
            background: rgba(255, 152, 0, 0.2);
            color: #FFAA00;
            border: 1px solid #FF9800;
        }

        .status-badge.offline {
            background: rgba(244, 67, 54, 0.2);
            color: #FF4444;
            border: 1px solid #F44336;
        }

        /* Status Items */
        .status-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 4px;
        }

        .item-label {
            font-size: 13px;
            font-weight: 500;
            color: #666;
        }

        .item-value {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            text-align: right;
        }

        .item-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 8px;
        }

        .item-indicator.online {
            background: #4CAF50;
        }

        .item-indicator.partial {
            background: #FF9800;
        }

        .item-indicator.offline {
            background: #F44336;
        }

        /* Resource Bars */
        .resource-bar-container {
            margin-bottom: 12px;
        }

        .resource-label {
            font-size: 12px;
            font-weight: 500;
            color: #666;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .resource-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .resource-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s ease;
        }

        .resource-fill.high-usage {
            background: linear-gradient(90deg, #FF9800, #F57C00);
        }

        .resource-fill.critical {
            background: linear-gradient(90deg, #F44336, #D32F2F);
        }

        /* Control Buttons */
        .control-buttons {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            flex: 1;
            padding: 8px 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: #0056b3;
        }

        .control-btn.danger {
            background: #F44336;
        }

        .control-btn.danger:hover {
            background: #D32F2F;
        }

        /* Resources Overview */
        .resources-overview {
            background: #f0f7ff;
            border: 2px solid #2196F3;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 32px;
        }

        .resources-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
        }

        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }

        .resource-card {
            text-align: center;
        }

        .resource-value {
            font-size: 24px;
            font-weight: bold;
            color: #1976D2;
            margin-bottom: 4px;
        }

        .resource-label-card {
            font-size: 12px;
            color: #666;
        }

        /* Models List */
        .models-section {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
        }

        .models-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
        }

        .model-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .model-info {
            flex: 1;
        }

        .model-name {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .model-details {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .model-status {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 3px;
            background: #E8F5E9;
            color: #2E7D32;
        }

        .model-status.loading {
            background: #E3F2FD;
            color: #1976D2;
        }

        /* Loading & Error */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            padding: 16px;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .lab-container {
                padding: 16px;
            }

            .lab-header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .services-grid {
                grid-template-columns: 1fr;
            }

            .resources-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="lab-container">
        <!-- Header -->
        <div class="lab-header">
            <div class="lab-title">
                <span class="lab-icon">🧪</span>
                <h1>AI Lab Status</h1>
            </div>
            <div class="header-controls">
                <button class="refresh-btn" id="refresh-btn" onclick="refreshLabStatus()">Refresh</button>
            </div>
        </div>

        <!-- Error Message -->
        <div id="error-container" style="display: none;"></div>

        <!-- Service Panels -->
        <div class="services-grid" id="services-grid">
            <div class="loading">
                <span class="spinner"></span>
                Loading AI Lab status...
            </div>
        </div>

        <!-- Resources Overview -->
        <div class="resources-overview" id="resources-overview"></div>

        <!-- Models Section -->
        <div class="models-section" id="models-section"></div>
    </div>

    <script src="/frontend/control-engine-client.js"></script>
    <script>
        let client = new ControlEngineClient('http://localhost:8888');
        let labData = null;

        // AI Lab configuration
        const labServices = {
            'ollama': {
                name: 'Ollama',
                icon: '🤖',
                description: 'Large Language Model Server',
                checks: [
                    { label: 'Service Status', key: 'status' },
                    { label: 'Model Loading', key: 'models_loaded' },
                    { label: 'API Responding', key: 'api_health' }
                ],
                models: [
                    { name: 'llama2', size: '7B', status: 'loaded' },
                    { name: 'neural-chat', size: '7B', status: 'loading' },
                    { name: 'mistral', size: '7B', status: 'available' }
                ],
                resources: {
                    'GPU Memory': { current: 6.2, max: 8, unit: 'GB' },
                    'CPU Usage': { current: 45, max: 100, unit: '%' }
                }
            },
            'openclaw': {
                name: 'OpenClaw',
                icon: '🦞',
                description: 'Orchestration & Integration Engine',
                checks: [
                    { label: 'Service Status', key: 'status' },
                    { label: 'Workflow Queue', key: 'queue' },
                    { label: 'Integration Health', key: 'integrations' }
                ],
                resources: {
                    'Memory Usage': { current: 2.1, max: 4, unit: 'GB' },
                    'Connection Pool': { current: 28, max: 32, unit: 'conn' }
                }
            }
        };

        // Mock status data (in real implementation, fetch from API)
        const mockStatus = {
            'ollama': {
                status: 'operational',
                models_loaded: 'operational',
                api_health: 'operational',
                gpu_memory: 6.2,
                gpu_max: 8,
                cpu_usage: 45,
                models: [
                    { name: 'llama2', size: '7B', status: 'loaded', memory: 3.5 },
                    { name: 'neural-chat', size: '7B', status: 'loading', progress: 75 },
                    { name: 'mistral', size: '7B', status: 'available', memory: 0 }
                ]
            },
            'openclaw': {
                status: 'operational',
                queue: 'operational',
                integrations: 'operational',
                memory_usage: 2.1,
                memory_max: 4,
                connections: 28,
                connections_max: 32,
                workflows_queued: 3,
                workflows_running: 2
            }
        };

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            refreshLabStatus();
        });

        async function refreshLabStatus() {
            const refreshBtn = document.getElementById('refresh-btn');
            const errorContainer = document.getElementById('error-container');

            refreshBtn.disabled = true;
            refreshBtn.textContent = 'Refreshing...';

            try {
                // In real implementation, fetch from /api/ai-lab/status
                // For now, use mock data
                labData = mockStatus;

                // Clear error
                errorContainer.style.display = 'none';

                // Update UI
                updateServicePanels();
                updateResourcesOverview();
                updateModelsSection();

            } catch (error) {
                console.error('Failed to fetch lab status:', error);
                showError(`Failed to fetch AI Lab status: ${error.message}`);
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = 'Refresh';
            }
        }

        function updateServicePanels() {
            const grid = document.getElementById('services-grid');

            const html = Object.entries(labServices)
                .map(([key, service]) => renderServicePanel(key, service, labData[key]))
                .join('');

            grid.innerHTML = html;
        }

        function renderServicePanel(key, service, status) {
            const statusValue = status?.status || 'unknown';
            const statusClass = statusValue.toLowerCase();

            let statusItems = ``;
            service.checks.forEach(check => {
                const checkStatus = status?.[check.key] || 'unknown';
                const icon = checkStatus === 'operational' ? '✅' : '⚠️';
                statusItems += `
                    <div class="status-item">
                        <span class="item-label">${check.label}</span>
                        <span class="item-value">
                            ${icon} ${checkStatus}
                        </span>
                    </div>
                `;
            });

            let resourceBars = ``;
            if (status) {
                Object.entries(service.resources || {}).forEach(([name, res]) => {
                    const percentage = (res.current / res.max) * 100;
                    const fillClass = percentage > 80 ? 'critical' : percentage > 60 ? 'high-usage' : '';
                    resourceBars += `
                        <div class="resource-bar-container">
                            <div class="resource-label">
                                <span>${name}</span>
                                <span>${res.current}/${res.max} ${res.unit}</span>
                            </div>
                            <div class="resource-bar">
                                <div class="resource-fill ${fillClass}" style="width: ${percentage}%"></div>
                            </div>
                        </div>
                    `;
                });
            }

            return `
                <div class="service-panel ${statusClass}">
                    <div class="panel-header">
                        <div class="panel-title">
                            <span class="panel-icon">${service.icon}</span>
                            <div>
                                <div>${service.name}</div>
                                <div style="font-size: 12px; color: #666; font-weight: normal; margin-top: 2px;">
                                    ${service.description}
                                </div>
                            </div>
                        </div>
                        <div class="status-badge ${statusClass}">${statusValue}</div>
                    </div>

                    <div class="status-items">
                        ${statusItems}
                    </div>

                    ${resourceBars ? `<div style="margin-bottom: 16px;">${resourceBars}</div>` : ''}

                    <div class="control-buttons">
                        <button class="control-btn" onclick="restartService('${key}')">Restart</button>
                        <button class="control-btn" onclick="viewLogs('${key}')">View Logs</button>
                    </div>
                </div>
            `;
        }

        function updateResourcesOverview() {
            const container = document.getElementById('resources-overview');

            const html = `
                <div class="resources-title">🔧 System Resources</div>
                <div class="resources-grid">
                    <div class="resource-card">
                        <div class="resource-value">6.2 GB</div>
                        <div class="resource-label-card">GPU Memory (Ollama)</div>
                    </div>
                    <div class="resource-card">
                        <div class="resource-value">45%</div>
                        <div class="resource-label-card">CPU Usage (Ollama)</div>
                    </div>
                    <div class="resource-card">
                        <div class="resource-value">2.1 GB</div>
                        <div class="resource-label-card">Memory (OpenClaw)</div>
                    </div>
                    <div class="resource-card">
                        <div class="resource-value">28/32</div>
                        <div class="resource-label-card">Connections (OpenClaw)</div>
                    </div>
                    <div class="resource-card">
                        <div class="resource-value">5</div>
                        <div class="resource-label-card">Workflows (2 running, 3 queued)</div>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function updateModelsSection() {
            const container = document.getElementById('models-section');

            const ollama = labData?.ollama;
            if (!ollama || !ollama.models) {
                container.innerHTML = '<div class="models-title">📚 Loaded Models</div><p>No models loaded</p>';
                return;
            }

            const modelsHtml = ollama.models
                .map(model => `
                    <div class="model-item">
                        <div class="model-info">
                            <div class="model-name">${model.name}</div>
                            <div class="model-details">
                                Size: ${model.size}
                                ${model.memory ? `• Memory: ${model.memory}GB` : ''}
                                ${model.progress ? `• Loading: ${model.progress}%` : ''}
                            </div>
                        </div>
                        <div class="model-status ${model.status === 'loading' ? 'loading' : ''}">
                            ${model.status.toUpperCase()}
                        </div>
                    </div>
                `)
                .join('');

            container.innerHTML = `
                <div class="models-title">📚 Loaded Models</div>
                ${modelsHtml}
            `;
        }

        function restartService(service) {
            if (confirm(`Restart ${service}? This may interrupt current operations.`)) {
                alert(`Restarting ${service}...`);
                // In real implementation, call API: client.restartService(service)
                refreshLabStatus();
            }
        }

        function viewLogs(service) {
            alert(`Viewing logs for ${service}...`);
            // In real implementation, call client.getServiceLogs(service)
        }

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `<div class="error-message">⚠️ ${message}</div>`;
            errorContainer.style.display = 'block';
        }
    </script>
</body>
</html>
