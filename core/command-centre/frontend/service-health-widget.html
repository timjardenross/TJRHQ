<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Health — USS TJR Command Centre</title>
    <link rel="stylesheet" href="/theme-starfleet-advanced.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            padding: 20px;
            color: #FFF;
        }

        .brief-container { max-width: 1400px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            border-bottom: 3px solid #FFD700;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: bold;
            color: #FFD700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header h1::before { content: "⬤ "; margin-right: 8px; }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .last-check {
            font-size: 12px;
            color: #AAA;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .auto-refresh-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #BBB;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .auto-refresh-toggle input[type="checkbox"] {
            cursor: pointer;
            accent-color: #FFD700;
        }

        .settings-btn,
        .refresh-btn {
            padding: 10px 20px;
            background: #FFD700;
            color: #000;
            border: 2px solid #FFD700;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .settings-btn:hover,
        .refresh-btn:hover {
            background: #FFA500;
            border-color: #FFA500;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .refresh-btn:disabled {
            background: #444;
            border-color: #666;
            color: #888;
            cursor: not-allowed;
        }

        /* Trust banner */
        .trust-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            text-transform: uppercase;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .trust-banner.trust-loading     { background: rgba(100,100,120,0.2); color: #888;    border: 1px solid #444; }
        .trust-banner.trust-live        { background: rgba(76,175,80,0.15);  color: #4CAF50; border: 1px solid #4CAF50; }
        .trust-banner.trust-interim     { background: rgba(255,152,0,0.15);  color: #FF9800; border: 1px solid #FF9800; }
        .trust-banner.trust-unavailable { background: rgba(244,67,54,0.15);  color: #EF5350; border: 1px solid #EF5350; }
        .trust-source { font-weight: 400; font-size: 11px; opacity: 0.85; }
        .trust-time   { font-weight: 400; font-size: 11px; opacity: 0.7; margin-left: auto; }

        /* Summary stats */
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-box {
            background: #1a1a2e;
            border: 2px solid #333;
            border-radius: 8px;
            text-align: center;
            padding: 20px;
            transition: all 0.3s ease;
        }
        .stat-box:hover { border-color: #FFD700; box-shadow: 0 0 15px rgba(255,215,0,0.2); }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #FFD700;
            letter-spacing: 1px;
        }

        .stat-label {
            font-size: 12px;
            color: #BBB;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-box.operational .stat-number { color: #4CAF50; }
        .stat-box.degraded .stat-number    { color: #FF9800; }
        .stat-box.offline .stat-number     { color: #EF5350; }

        /* Service Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .service-card {
            background: #1a1a2e;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .service-card:hover {
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
            border-color: #FFD700;
        }

        .service-card.operational { border-left: 6px solid #4CAF50; }
        .service-card.degraded    { border-left: 6px solid #FF9800; }
        .service-card.offline     { border-left: 6px solid #EF5350; }
        .service-card.api-unavailable { opacity: 0.7; border-left: 6px solid #666; }

        .service-name {
            font-size: 16px;
            font-weight: 700;
            color: #FFF;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 1px;
        }

        .service-description {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            font-style: italic;
        }

        .service-status {
            font-size: 13px;
            color: #AAA;
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        .status-indicator { display: inline-block; font-size: 22px; }

        .service-details { font-size: 12px; color: #888; line-height: 1.8; }

        .service-detail-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .detail-label {
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .detail-value { color: #CCC; text-align: right; }

        .cached-indicator {
            font-size: 11px;
            color: #FF9800;
            margin-top: 10px;
            font-style: italic;
        }

        .no-services { text-align: center; padding: 50px 40px; color: #888; font-size: 14px; }

        /* Loading & Error */
        .loading { text-align: center; padding: 50px 40px; color: #AAA; }

        .spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 3px solid #444;
            border-top: 3px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error-message {
            padding: 14px 16px;
            background: #1a1a2e;
            color: #EF5350;
            border: 1px solid #EF5350;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .footer-info {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #888;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 12px; align-items: flex-start; }
            .header-controls { width: 100%; flex-wrap: wrap; }
            .services-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="brief-container">
        <div class="header">
            <h1>Service Health</h1>
            <div class="header-controls">
                <div class="last-check">
                    <span id="last-check-time">Never checked</span>
                </div>
                <div class="auto-refresh-toggle">
                    <input type="checkbox" id="auto-refresh-toggle" checked>
                    <label for="auto-refresh-toggle">Auto-refresh (30s)</label>
                </div>
                <button class="settings-btn" id="settings-btn">Settings</button>
                <button class="refresh-btn" id="refresh-btn" onclick="refreshHealth()">Refresh Now</button>
            </div>
        </div>

        <div id="trust-banner" class="trust-banner trust-loading">
            <span id="trust-label">⏳ LOADING</span>
            <span class="trust-source" id="trust-source"></span>
            <span class="trust-time" id="trust-time"></span>
        </div>

        <div id="error-container" style="display: none;"></div>

        <div id="summary-stats" class="summary-stats"></div>

        <div id="services-grid" class="services-grid">
            <div class="loading">
                <span class="spinner"></span>
                Loading service health...
            </div>
        </div>

        <div class="footer-info">
            <span>Source: Control Engine health — interim until Uptime Kuma configured</span>
            <span style="margin-left: 20px;">Auto-refresh every 30 seconds</span>
        </div>
    </div>

    <script>
        // Data source: /api/dashboard/service-health (Control Engine health — interim source)
        const CONTROL_ENGINE = 'http://localhost:8888';

        let lastHealthData = null;
        let autoRefreshInterval = null;

        function setTrustState(state, opts) {
            opts = opts || {};
            const banner   = document.getElementById('trust-banner');
            const labelEl  = document.getElementById('trust-label');
            const sourceEl = document.getElementById('trust-source');
            const timeEl   = document.getElementById('trust-time');
            const icons  = { loading: '⏳', live: '🟢', interim: '🟡', unavailable: '🔴' };
            const labels = { loading: 'LOADING', live: 'LIVE', interim: 'INTERIM SOURCE', unavailable: 'UNAVAILABLE' };
            banner.className = 'trust-banner trust-' + state;
            labelEl.textContent  = (icons[state] || '') + ' ' + (labels[state] || state.toUpperCase());
            sourceEl.textContent = opts.source ? '— ' + opts.source : '';
            timeEl.textContent   = opts.time   ? opts.time           : '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            refreshHealth();
            setupAutoRefresh();
            document.getElementById('settings-btn').addEventListener('click', () => {
                window.open('/dashboards/settings-panel.html', 'settings', 'width=900,height=1100,scrollbars=yes');
            });
        });

        document.getElementById('auto-refresh-toggle').addEventListener('change', setupAutoRefresh);

        function setupAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            if (document.getElementById('auto-refresh-toggle').checked) {
                autoRefreshInterval = setInterval(refreshHealth, 30000);
            }
        }

        async function refreshHealth() {
            const refreshBtn     = document.getElementById('refresh-btn');
            const gridContainer  = document.getElementById('services-grid');
            const errorContainer = document.getElementById('error-container');

            refreshBtn.disabled = true;
            refreshBtn.textContent = 'Refreshing...';
            setTrustState('loading');

            try {
                const response = await fetch(`${CONTROL_ENGINE}/api/dashboard/service-health`);
                if (!response.ok) throw new Error(`Control Engine error: ${response.status}`);

                const health = await response.json();
                lastHealthData = health;

                const fetchTime  = new Date().toLocaleTimeString();
                const trustState = health.source === 'uptime_kuma' ? 'live' : 'interim';
                setTrustState(trustState, {
                    source: health.source_label || health.source || 'Control Engine health',
                    time: fetchTime,
                });

                errorContainer.style.display = 'none';
                errorContainer.innerHTML = '';
                updateSummaryStats(health);
                updateServicesGrid(health);
                updateLastCheckTime();

            } catch (error) {
                console.error('Failed to fetch health:', error);
                setTrustState('unavailable', { source: 'Control Engine unreachable (localhost:8888)' });
                showError('Cannot reach Control Engine. Check that control_engine.py is running on port 8888.');

                if (lastHealthData) {
                    updateSummaryStats(lastHealthData);
                    updateServicesGrid(lastHealthData, true);
                } else {
                    gridContainer.innerHTML = '<div class="no-services">Unable to fetch service health</div>';
                }
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = 'Refresh Now';
            }
        }

        function updateSummaryStats(health) {
            const statsContainer = document.getElementById('summary-stats');
            if (!health.services) { statsContainer.innerHTML = ''; return; }

            const services    = Object.values(health.services);
            const operational = services.filter(s => s.status === 'operational').length;
            const degraded    = services.filter(s => s.status === 'degraded').length;
            const offline     = services.filter(s => s.status === 'offline').length;
            const total       = services.length;

            statsContainer.innerHTML = `
                <div class="stat-box operational">
                    <div class="stat-number">${operational}</div>
                    <div class="stat-label">Operational</div>
                </div>
                <div class="stat-box degraded">
                    <div class="stat-number">${degraded}</div>
                    <div class="stat-label">Degraded</div>
                </div>
                <div class="stat-box offline">
                    <div class="stat-number">${offline}</div>
                    <div class="stat-label">Offline</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">${total}</div>
                    <div class="stat-label">Total</div>
                </div>
            `;
        }

        function updateServicesGrid(health, isCached) {
            const gridContainer = document.getElementById('services-grid');

            if (!health.services || Object.keys(health.services).length === 0) {
                gridContainer.innerHTML = '<div class="no-services">No services found</div>';
                return;
            }

            gridContainer.innerHTML = Object.entries(health.services)
                .map(([serviceName, serviceData]) => {
                    const status    = serviceData.status || 'unknown';
                    const timestamp = serviceData.timestamp ? new Date(serviceData.timestamp).toLocaleTimeString() : 'N/A';

                    const description = serviceData.description || '';

                    return `
                        <div class="service-card ${status}${isCached ? ' api-unavailable' : ''}">
                            <div class="service-name">
                                <span class="status-indicator">${getStatusEmoji(status)}</span>
                                ${serviceName}
                            </div>
                            ${description ? `<div class="service-description">${escapeHtml(description)}</div>` : ''}
                            <div class="service-status">${getStatusText(status)}</div>
                            <div class="service-details">
                                <div class="service-detail-line">
                                    <span class="detail-label">Last Check:</span>
                                    <span class="detail-value">${timestamp}</span>
                                </div>
                                ${serviceData.uptime ? `
                                    <div class="service-detail-line">
                                        <span class="detail-label">Uptime:</span>
                                        <span class="detail-value">${serviceData.uptime}</span>
                                    </div>
                                ` : ''}
                            </div>
                            ${isCached ? '<div class="cached-indicator">Cached data — API unavailable</div>' : ''}
                        </div>
                    `;
                })
                .join('');
        }

        function updateLastCheckTime() {
            document.getElementById('last-check-time').textContent = `Last check: ${new Date().toLocaleTimeString()}`;
        }

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `<div class="error-message">⚠️ ${message}</div>`;
            errorContainer.style.display = 'block';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getStatusEmoji(status) {
            return { operational: '✅', degraded: '⚠️', offline: '❌', pending: '⏳', unknown: '❓' }[status] || '❓';
        }

        function getStatusText(status) {
            return { operational: 'Operational', degraded: 'Degraded', offline: 'Offline', pending: 'Pending', 'on-demand': 'On Demand', unknown: 'Unknown' }[status] || 'Unknown';
        }
    </script>
</body>
</html>
