<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Registry — USS TJR</title>
  <link rel="stylesheet" href="widgets.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-space: #080B14; --bg-panel: #0d1117; --bg-card: #111827;
      --border: rgba(255,255,255,0.08); --accent: #00ccff;
      --text-primary: #e0e6ff; --text-muted: #a0a6c0;
      --gold: #F0B840; --red: #D94444; --green: #2ecc71;
    }
    body { background: var(--bg-space); color: var(--text-primary); font-family: 'Courier New', monospace; font-size: 13px; min-height: 100vh; }

    .page-header {
      background: linear-gradient(135deg, rgba(0,204,255,0.06), rgba(8,11,20,0.95));
      border-bottom: 1px solid rgba(0,204,255,0.15);
      padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .page-header-left { display: flex; align-items: center; gap: 12px; }
    .back-link { color: var(--accent); text-decoration: none; font-size: 12px; opacity: 0.8; }
    .back-link:hover { opacity: 1; }
    .page-title { font-size: 16px; font-weight: 700; letter-spacing: 0.06em; color: var(--gold); }
    .page-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .controls {
      padding: 14px 24px;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.01);
    }
    .search-input {
      flex: 1; min-width: 220px; max-width: 400px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 5px; color: var(--text-primary); padding: 8px 12px;
      font-size: 12px; font-family: inherit;
    }
    .search-input:focus { outline: none; border-color: rgba(0,204,255,0.4); }
    .filter-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .filter-btn {
      font-size: 11px; padding: 5px 12px; border-radius: 4px; cursor: pointer;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.15);
      color: var(--text-muted); font-family: inherit; transition: all 0.15s;
    }
    .filter-btn:hover, .filter-btn.active { background: rgba(0,204,255,0.1); border-color: rgba(0,204,255,0.4); color: var(--accent); }
    .filter-btn.active { font-weight: 700; }
    .count-label { font-size: 11px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }

    .mission-table { width: 100%; padding: 16px 24px; }
    .mission-row {
      display: grid;
      grid-template-columns: 160px 1fr 140px 90px 100px;
      gap: 12px; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }
    .mission-row:hover { background: rgba(255,255,255,0.02); }
    .mission-row.header { color: var(--text-muted); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 8px; }
    .mission-id { color: var(--accent); font-size: 11px; font-weight: 600; }
    .mission-title-cell { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mission-status { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .mission-domain { font-size: 11px; color: var(--text-muted); }
    .mission-date { font-size: 10px; color: var(--text-muted); }

    /* Status colours */
    .s-blocked      { color: #ff4444; }
    .s-approved     { color: var(--green); }
    .s-idea         { color: #888; }
    .s-awaiting     { color: var(--gold); }
    .s-rework       { color: #ff8c00; }
    .s-default      { color: var(--text-muted); }

    .empty-state { padding: 48px 24px; text-align: center; color: var(--text-muted); }
    .loading-state { padding: 32px 24px; text-align: center; color: var(--text-muted); }
    .error-state { padding: 24px; color: #ff6a6a; font-size: 12px; }
  </style>
</head>
<body>

<div class="page-header">
  <div class="page-header-left">
    <a class="back-link" href="index.html">← Command Centre</a>
    <div>
      <div class="page-title">📋 Mission Registry</div>
      <div class="page-subtitle">All active missions — USS TJR</div>
    </div>
  </div>
  <div id="header-meta" style="font-size:11px;color:var(--text-muted);text-align:right;"></div>
</div>

<div class="controls">
  <input class="search-input" id="search" type="text" placeholder="🔍  Search by ID, title, domain…" oninput="applyFilters()">
  <div class="filter-group" id="status-filters">
    <button class="filter-btn active" data-status="">All</button>
    <button class="filter-btn" data-status="Blocked">🔴 Blocked</button>
    <button class="filter-btn" data-status="Awaiting Captain Approval">✅ Awaiting Approval</button>
    <button class="filter-btn" data-status="Requires Rework">↩ Rework</button>
    <button class="filter-btn" data-status="Approved for Engineering">⚡ Approved</button>
    <button class="filter-btn" data-status="In Progress">🔄 In Progress</button>
    <button class="filter-btn" data-status="Closed">✓ Closed</button>
  </div>
  <span class="count-label" id="count-label"></span>
</div>

<div id="main-content">
  <div class="loading-state">Loading missions…</div>
</div>

<script>
  let _missions = [];
  let _activeStatus = '';
  let _apiKey = '';

  async function init() {
    // Fetch API key
    try {
      const cfg = await fetch('/api/config');
      if (cfg.ok) { const d = await cfg.json(); _apiKey = d.apiKey || d.api_key || ''; }
    } catch(_) {}

    await loadMissions();
  }

  async function loadMissions() {
    const sep = _apiKey ? `?api_key=${encodeURIComponent(_apiKey)}&` : '?';
    try {
      const r = await fetch(`/api/v1/missions/list${sep}limit=200&include_closed=1`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const json = await r.json();
      _missions = Array.isArray(json.data) ? json.data : (Array.isArray(json) ? json : []);
      const meta = document.getElementById('header-meta');
      if (meta) meta.textContent = `${_missions.length} missions loaded`;
      applyFilters();
    } catch(err) {
      document.getElementById('main-content').innerHTML =
        `<div class="error-state">Failed to load missions: ${err.message}</div>`;
    }
  }

  function statusClass(s) {
    if (!s) return 's-default';
    const sl = s.toLowerCase();
    if (sl === 'blocked') return 's-blocked';
    if (sl === 'approved') return 's-approved';
    if (sl === 'idea') return 's-idea';
    if (sl.includes('awaiting') || sl.includes('rework')) return sl.includes('rework') ? 's-rework' : 's-awaiting';
    return 's-default';
  }

  function applyFilters() {
    const search = (document.getElementById('search').value || '').toLowerCase().trim();
    const filtered = _missions.filter(m => {
      const matchStatus = !_activeStatus || m.status === _activeStatus;
      const matchSearch = !search || (
        (m.mission_id || '').toLowerCase().includes(search) ||
        (m.title || '').toLowerCase().includes(search) ||
        (m.domain || '').toLowerCase().includes(search) ||
        (m.id || '').toLowerCase().includes(search)
      );
      return matchStatus && matchSearch;
    });
    render(filtered);
  }

  function render(list) {
    const el = document.getElementById('main-content');
    const countEl = document.getElementById('count-label');
    if (countEl) countEl.textContent = `${list.length} mission${list.length !== 1 ? 's' : ''}`;

    if (!list.length) {
      el.innerHTML = '<div class="empty-state">No missions match the current filter.</div>';
      return;
    }

    el.innerHTML = `<div class="mission-table">
      <div class="mission-row header">
        <span>Mission ID</span>
        <span>Title</span>
        <span>Status</span>
        <span>Domain</span>
        <span>Created</span>
      </div>
      ${list.map(m => `
        <div class="mission-row">
          <span class="mission-id">${m.mission_id || m.id || '—'}</span>
          <span class="mission-title-cell" title="${(m.title || '').replace(/"/g,'&quot;')}">${m.title || '—'}</span>
          <span class="mission-status ${statusClass(m.status)}">${m.status || '—'}</span>
          <span class="mission-domain">${m.domain || '—'}</span>
          <span class="mission-date">${(m.created_at || '').slice(0, 10)}</span>
        </div>`).join('')}
    </div>`;
  }

  // Status filter buttons
  document.getElementById('status-filters').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    _activeStatus = btn.dataset.status || '';
    applyFilters();
  });

  init();
</script>
</body>
</html>
