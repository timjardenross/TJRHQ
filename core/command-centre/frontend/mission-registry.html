<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Registry</title>
    <link rel="stylesheet" href="/theme-starfleet-advanced.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            padding: 20px;
            color: #FFF;
        }

        .mission-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 40px;
            border-bottom: 3px solid #FFD700;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 32px;
            color: #FFD700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .header::before {
            content: "📋 ";
            margin-right: 8px;
        }

        .header p {
            color: #BBB;
            font-size: 14px;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-btn {
            padding: 8px 16px;
            background: #1a1a2e;
            border: 2px solid #333;
            color: #FFF;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-btn:hover {
            border-color: #FFD700;
            color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .filter-btn.active {
            background: #FFD700;
            color: #0a0e27;
            border-color: #FFD700;
        }

        .admin-btn {
            margin-left: auto;
            padding: 8px 16px;
            background: #00FFFF;
            color: #0a0e27;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-btn:hover {
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            transform: scale(1.02);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 30px;
            border-bottom: 2px solid #333;
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            color: #BBB;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab-btn:hover {
            color: #FFD700;
        }

        .tab-btn.active {
            color: #FFD700;
            border-bottom-color: #FFD700;
        }

        /* Mission Grid */
        .missions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .mission-card {
            background: #1a1a2e;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .mission-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #FFD700, #00FFFF);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mission-card:hover {
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
            transform: translateY(-4px);
        }

        .mission-card:hover::before {
            opacity: 1;
        }

        .mission-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 12px;
        }

        .mission-id {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Courier New', monospace;
        }

        .mission-title {
            font-size: 16px;
            font-weight: 600;
            color: #FFF;
            word-break: break-word;
        }

        .mission-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .status-active {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid #4CAF50;
        }

        .status-planning {
            background: rgba(255, 152, 0, 0.2);
            color: #FF9800;
            border: 1px solid #FF9800;
        }

        .status-completed {
            background: rgba(76, 175, 80, 0.15);
            color: #66BB6A;
            border: 1px solid #66BB6A;
        }

        .status-blocked {
            background: rgba(244, 67, 54, 0.2);
            color: #EF5350;
            border: 1px solid #EF5350;
        }

        .status-archived {
            background: rgba(158, 158, 158, 0.2);
            color: #9E9E9E;
            border: 1px solid #9E9E9E;
        }

        .mission-description {
            font-size: 13px;
            color: #BBB;
            margin-bottom: 12px;
            line-height: 1.5;
            min-height: 40px;
        }

        .mission-meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .meta-label {
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-value {
            color: #FFD700;
            font-weight: 600;
        }

        .mission-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 12px;
            background: #2a2a3e;
            border: 1px solid #333;
            color: #FFF;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            border-color: #FFD700;
            color: #FFD700;
        }

        .action-btn.edit {
            border-color: #00FFFF;
            color: #00FFFF;
        }

        .action-btn.edit:hover {
            background: rgba(0, 255, 255, 0.1);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        /* Stats */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 140px;
            background: linear-gradient(135deg, #1a1a2e 0%, #2a2a3e 100%);
            border: 2px solid #FFD700;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: #FFD700;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #BBB;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #333;
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .missions-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 24px;
            }

            .admin-btn {
                margin-left: 0;
                width: 100%;
            }

            .controls {
                flex-direction: column;
            }

            .filter-group {
                width: 100%;
                flex-wrap: wrap;
            }

            .stats-bar {
                flex-direction: column;
            }

            .stat-card {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="mission-container">
        <!-- Header -->
        <div class="header">
            <h1>Mission Registry</h1>
            <p>USS TJR Operational Missions & Projects</p>
        </div>

        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-number" id="stat-active">0</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-planning">0</div>
                <div class="stat-label">Planning</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-completed">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-blocked">0</div>
                <div class="stat-label">Blocked</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">All Missions</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="planning">Planning</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
                <button class="filter-btn" data-filter="blocked">Blocked</button>
            </div>
            <button class="admin-btn" onclick="openAdminPanel()">⚙️ Manage in Supabase</button>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="active">🚀 Active Missions</button>
            <button class="tab-btn" data-tab="recent">⭐ Recently Completed</button>
            <button class="tab-btn" data-tab="blocked">🔴 Blocked</button>
        </div>

        <!-- Missions Grid -->
        <div class="missions-grid" id="missions-grid">
            <div class="loading">
                <span class="spinner"></span>
                Loading missions...
            </div>
        </div>
    </div>

    <!-- Settings Integration -->
    <script src="/dashboards/preference-manager.js"></script>
    <script src="/dashboards/audio-manager.js"></script>
    <script src="/dashboards/animation-controller.js"></script>

    <!-- Mission Registry Logic -->
    <script>
        const SUPABASE_URL = 'https://ibfmgspcbhhbqrvzvnaq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlibWdzZ3NwY2JoaGJxcnZ6dm5hcSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzIzMTYwMTM3LCJleHAiOjIwMzg3MzYxMzd9.cN3S7KvsFfq1pQqpBtIMxr9u3eBGAn5PjnH2YhVV4vI';

        // Mock data for demo (will be replaced by real Supabase data)
        const MOCK_MISSIONS = [
            {
                id: 'MSN-0042-TRACK1',
                title: 'Control Deck Launchpad MVP',
                description: 'Initial dashboard implementation with service health widgets',
                status: 'completed',
                startDate: '2026-05-15',
                endDate: '2026-06-01',
                owner: 'Claude',
                progress: 100
            },
            {
                id: 'MSN-0042-TRACK2',
                title: 'Advanced Customization & Polish',
                description: 'Add preference manager, audio alerts, animations, and settings panel',
                status: 'completed',
                startDate: '2026-06-01',
                endDate: '2026-06-08',
                owner: 'Claude',
                progress: 100
            },
            {
                id: 'MSN-0042-TRACK3',
                title: 'Audio Integration & Refinement',
                description: 'Integrate audio files, optimize performance, team testing',
                status: 'active',
                startDate: '2026-06-08',
                endDate: '2026-06-22',
                owner: 'Claude',
                progress: 15
            },
            {
                id: 'MSN-0041-UI-OVERHAUL',
                title: 'Mission Registry UI',
                description: 'Build web interface for mission management and tracking',
                status: 'active',
                startDate: '2026-06-08',
                endDate: '2026-06-25',
                owner: 'Claude',
                progress: 35
            },
            {
                id: 'MSN-0040A-WP2',
                title: 'Integration & Automation',
                description: 'Connect Mission Registry to Slack, GitHub, and task management',
                status: 'planning',
                startDate: '2026-06-25',
                endDate: '2026-07-15',
                owner: 'TBD',
                progress: 0
            },
            {
                id: 'MSN-0035-STRATEGIC',
                title: 'Strategic Initiative',
                description: 'Long-term infrastructure and architecture improvements',
                status: 'planning',
                startDate: '2026-07-01',
                endDate: '2026-08-30',
                owner: 'TBD',
                progress: 0
            },
            {
                id: 'MSN-0039-RESEARCH',
                title: 'Advanced ML Research',
                description: 'Explore neural architecture search and model optimization',
                status: 'blocked',
                startDate: '2026-06-15',
                endDate: '2026-07-30',
                owner: 'Claude',
                blockers: ['Awaiting GPU allocation', 'Dataset licensing pending']
            }
        ];

        let allMissions = MOCK_MISSIONS;
        let currentFilter = 'all';
        let currentTab = 'active';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setupSettings(); // From preference-manager.js
            setupEventListeners();

            // Try to load real data from Supabase, fall back to mock if unavailable
            fetchMissionsFromSupabase();

            // Auto-refresh every 30 seconds
            setInterval(fetchMissionsFromSupabase, 30000);
        });

        async function fetchMissionsFromSupabase() {
            try {
                // Fetch missions with key columns
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/missions?select=id,title,description,status,owner,due_date,created_at,blockers,priority&order=created_at.desc`,
                    {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Content-Type': 'application/json'
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();

                // If data is empty, use mock data
                if (data && data.length > 0) {
                    console.log(`[Mission Registry] Loaded ${data.length} missions from Supabase`);
                    // Transform Supabase data to match our component format
                    allMissions = data.map(m => ({
                        id: m.id,
                        title: m.title,
                        description: m.description || 'No description',
                        status: (m.status || 'planning').toLowerCase(),
                        owner: m.owner || 'Unassigned',
                        progress: getProgressFromStatus(m.status),
                        startDate: new Date(m.created_at).toISOString().split('T')[0],
                        endDate: m.due_date || 'TBD',
                        blockers: m.blockers ? (typeof m.blockers === 'string' ? m.blockers.split(',') : m.blockers) : []
                    }));
                } else {
                    console.log('[Mission Registry] No missions in database, using mock data');
                    allMissions = MOCK_MISSIONS;
                }

                renderMissions();
                updateStats();
            } catch (error) {
                console.warn('[Mission Registry] Failed to fetch from Supabase, using mock data:', error.message);
                allMissions = MOCK_MISSIONS;
                renderMissions();
                updateStats();
            }
        }

        function getProgressFromStatus(status) {
            const statusProgress = {
                'completed': 100,
                'active': 50,
                'planning': 10,
                'blocked': 25,
                'archived': 100
            };
            return statusProgress[(status || 'planning').toLowerCase()] || 0;
        }

        function setupEventListeners() {
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.filter;
                    renderMissions();
                });
            });

            // Tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentTab = e.target.dataset.tab;
                    renderMissions();
                });
            });
        }

        function getFilteredMissions() {
            let filtered = allMissions;

            // Apply status filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(m => m.status === currentFilter);
            }

            // Apply tab filter
            if (currentTab === 'active') {
                filtered = filtered.filter(m => m.status === 'active');
            } else if (currentTab === 'recent') {
                filtered = filtered.filter(m => m.status === 'completed')
                    .sort((a, b) => new Date(b.endDate) - new Date(a.endDate));
            } else if (currentTab === 'blocked') {
                filtered = filtered.filter(m => m.status === 'blocked');
            }

            return filtered;
        }

        function renderMissions() {
            const grid = document.getElementById('missions-grid');
            const missions = getFilteredMissions();

            if (missions.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1;">
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <div class="empty-state-text">No missions found</div>
                            <p style="font-size: 12px; color: #666; margin-top: 8px;">
                                Try adjusting your filters or create a new mission
                            </p>
                        </div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = missions.map(mission => `
                <div class="mission-card">
                    <div class="mission-header">
                        <div>
                            <div class="mission-id">${mission.id}</div>
                            <div class="mission-title">${mission.title}</div>
                        </div>
                        <span class="mission-status status-${mission.status}">
                            ${mission.status}
                        </span>
                    </div>

                    <div class="mission-description">${mission.description}</div>

                    <div class="mission-meta">
                        <div class="meta-row">
                            <span class="meta-label">Owner</span>
                            <span class="meta-value">${mission.owner}</span>
                        </div>
                        <div class="meta-row">
                            <span class="meta-label">Progress</span>
                            <span class="meta-value">${mission.progress}%</span>
                        </div>
                        ${mission.blockers ? `
                            <div class="meta-row">
                                <span class="meta-label">⚠️ Blockers</span>
                                <span class="meta-value">${mission.blockers.length}</span>
                            </div>
                        ` : ''}
                    </div>

                    <div class="mission-actions">
                        <button class="action-btn" onclick="viewMission('${mission.id}')">View</button>
                        <button class="action-btn edit" onclick="editMission('${mission.id}')">Edit</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const stats = {
                active: allMissions.filter(m => m.status === 'active').length,
                planning: allMissions.filter(m => m.status === 'planning').length,
                completed: allMissions.filter(m => m.status === 'completed').length,
                blocked: allMissions.filter(m => m.status === 'blocked').length
            };

            document.getElementById('stat-active').textContent = stats.active;
            document.getElementById('stat-planning').textContent = stats.planning;
            document.getElementById('stat-completed').textContent = stats.completed;
            document.getElementById('stat-blocked').textContent = stats.blocked;
        }

        function viewMission(missionId) {
            const mission = allMissions.find(m => m.id === missionId);
            if (mission) {
                alert(`Mission: ${mission.title}\n\n${mission.description}\n\nStatus: ${mission.status}\nProgress: ${mission.progress}%`);
            }
        }

        function editMission(missionId) {
            const mission = allMissions.find(m => m.id === missionId);
            if (mission) {
                console.log('Edit mission:', mission);
                // In production: open edit modal or redirect to Supabase admin panel
                alert(`Edit ${mission.id} - Feature coming soon`);
            }
        }

        function openAdminPanel() {
            window.open('https://app.supabase.com/project/ibfmgspcbhhbqrvzvnaq', '_blank');
        }
    </script>
</body>
</html>
