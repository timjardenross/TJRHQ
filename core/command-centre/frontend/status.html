<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .status-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .status-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .status-emoji {
            font-size: 64px;
            margin-bottom: 16px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .status-title {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .status-subtitle {
            font-size: 16px;
            color: #666;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 12px;
        }

        .status-badge.operational {
            background-color: #d4edda;
            color: #155724;
        }

        .status-badge.degraded {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-badge.offline {
            background-color: #f8d7da;
            color: #721c24;
        }

        /* Endpoints Grid */
        .endpoints-section {
            margin-top: 40px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
        }

        .endpoints-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .endpoint-link {
            padding: 12px;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            color: #007bff;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .endpoint-link:hover {
            background: #007bff;
            color: white;
            border-color: #007bff;
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.3);
        }

        /* Service Status */
        .services-section {
            margin-top: 40px;
        }

        .services-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 6px;
            border-left: 4px solid #ddd;
        }

        .service-item.operational {
            border-left-color: #4CAF50;
            background: #f0f8f5;
        }

        .service-item.degraded {
            border-left-color: #FF9800;
            background: #fffbf0;
        }

        .service-item.offline {
            border-left-color: #F44336;
            background: #fff5f5;
        }

        .service-name {
            font-weight: 500;
            color: #333;
        }

        .service-status {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 3px;
        }

        .service-status.operational {
            background: #d4edda;
            color: #155724;
        }

        .service-status.degraded {
            background: #fff3cd;
            color: #856404;
        }

        .service-status.offline {
            background: #f8d7da;
            color: #721c24;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Last Check */
        .last-check {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #f0f0f0;
            font-size: 12px;
            color: #999;
        }

        .refresh-link {
            color: #007bff;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }

        .refresh-link:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .status-container {
                padding: 24px;
            }

            .status-title {
                font-size: 24px;
            }

            .status-emoji {
                font-size: 48px;
            }

            .endpoints-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="status-container">
        <!-- Status Header -->
        <div class="status-header">
            <div class="status-emoji" id="status-emoji">🔄</div>
            <div class="status-title" id="status-title">Checking Status...</div>
            <div class="status-subtitle" id="status-subtitle">Control Engine API</div>
            <div class="status-badge" id="status-badge" style="visibility: hidden;"></div>
        </div>

        <!-- API Endpoints -->
        <div class="endpoints-section">
            <div class="section-title">API Endpoints</div>
            <div class="endpoints-grid">
                <a class="endpoint-link" href="/api/health" target="_blank">GET /health</a>
                <a class="endpoint-link" href="/api/services/status" target="_blank">GET /services</a>
                <a class="endpoint-link" href="/api/missions/active" target="_blank">GET /missions</a>
                <a class="endpoint-link" href="/api/dashboard/summary" target="_blank">GET /summary</a>
            </div>
        </div>

        <!-- Service Status -->
        <div class="services-section">
            <div class="section-title">Service Status</div>
            <div class="services-list" id="services-list">
                <div class="loading">
                    <span class="spinner"></span>
                    Loading services...
                </div>
            </div>
        </div>

        <!-- Last Check -->
        <div class="last-check">
            <div>Last check: <span id="last-check-time">Never</span></div>
            <div style="margin-top: 8px;">
                <a class="refresh-link" onclick="refreshStatus()">Refresh Status</a>
            </div>
        </div>
    </div>

    <script src="/frontend/control-engine-client.js"></script>
    <script>
        let client = new ControlEngineClient('http://localhost:8888');
        let autoRefreshInterval = null;

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            refreshStatus();
            // Auto-refresh every 30 seconds
            autoRefreshInterval = setInterval(refreshStatus, 30000);
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        });

        async function refreshStatus() {
            try {
                const health = await client.getHealth();
                updateStatusDisplay(health);
            } catch (error) {
                console.error('Failed to fetch status:', error);
                updateErrorDisplay(error.message);
            }

            updateLastCheckTime();
        }

        function updateStatusDisplay(health) {
            const status = health.status || 'unknown';
            const services = health.services || {};

            // Update header
            const emoji = getStatusEmoji(status);
            const title = getStatusTitle(status);
            const badgeClass = status.toLowerCase();

            document.getElementById('status-emoji').textContent = emoji;
            document.getElementById('status-title').textContent = title;
            document.getElementById('status-badge').textContent = status.toUpperCase();
            document.getElementById('status-badge').className = `status-badge ${badgeClass}`;
            document.getElementById('status-badge').style.visibility = 'visible';

            // Update services list
            const servicesHtml = Object.entries(services)
                .map(([name, service]) => {
                    const sStatus = service.status || 'unknown';
                    const sEmoji = getStatusEmoji(sStatus);
                    return `
                        <div class="service-item ${sStatus}">
                            <span class="service-name">${sEmoji} ${name}</span>
                            <span class="service-status ${sStatus}">${sStatus.toUpperCase()}</span>
                        </div>
                    `;
                })
                .join('');

            document.getElementById('services-list').innerHTML = servicesHtml || '<p class="loading">No services found</p>';
        }

        function updateErrorDisplay(errorMessage) {
            document.getElementById('status-emoji').textContent = '❌';
            document.getElementById('status-title').textContent = 'Status Unavailable';
            document.getElementById('status-subtitle').textContent = 'Unable to connect to Control Engine API';
            document.getElementById('status-badge').textContent = 'OFFLINE';
            document.getElementById('status-badge').className = 'status-badge offline';
            document.getElementById('status-badge').style.visibility = 'visible';

            document.getElementById('services-list').innerHTML = `
                <div class="loading" style="color: #F44336;">
                    <strong>Error:</strong> ${errorMessage}
                </div>
            `;
        }

        function updateLastCheckTime() {
            const now = new Date();
            document.getElementById('last-check-time').textContent = now.toLocaleTimeString();
        }

        function getStatusEmoji(status) {
            const emojis = {
                'operational': '✅',
                'degraded': '⚠️',
                'offline': '❌',
                'unknown': '❓'
            };
            return emojis[status] || '❓';
        }

        function getStatusTitle(status) {
            const titles = {
                'operational': 'All Systems Operational',
                'degraded': 'Degraded Performance',
                'offline': 'System Offline',
                'unknown': 'Status Unknown'
            };
            return titles[status] || 'Unknown Status';
        }
    </script>
</body>
</html>
