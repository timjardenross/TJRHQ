# STARFLEET COMMAND Bridge Configuration
# Dashy v4 Compatible Schema
# Mission: M-20260609-000000
#
# IMPORTANT: Uses only Dashy v4-supported fields
# - Removes customColors (not supported in v4)
# - Removes displayData (not standard)
# - Uses nord theme (verified working)
# - Simplified appConfig with only supported options
# - Uses only: pageInfo, appConfig, sections, items

pageInfo:
  title: STARFLEET COMMAND BRIDGE
  description: USS TJR Control Deck Launchpad
  navLinks: []

appConfig:
