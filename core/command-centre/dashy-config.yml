# STARFLEET COMMAND CENTRE
# Dashy v4 Configuration for Starship Endeavour (NCC-170230)
#
# IMPORTANT: This config uses ONLY Dashy v4-supported fields:
# - pageInfo, appConfig, sections, items
# - NO customColors, displayData, statusCheck, statusCheckUrl, etc.

pageInfo:
  title: STARFLEET COMMAND BRIDGE
  description: Starship Endeavour Control Deck (NCC-170230)
  navLinks: []
  logo: /assets/starfleet-logo.svg
  icon: /assets/favicon.svg
  footerText: "Ad Astra Per Aspera | Starship Endeavour NCC-170230 | USS TJR"

appConfig:
  theme: nord
  externalStyleSheet: /theme-starfleet-advanced.css
  layout: grid
  columns: 4
  itemSize: small
  language: en
  showSettings: false
  showAbout: false
  showErrorLog: false

sections:

  # SECTION 1: CAPTAIN'S CHAIR — single entry point to the Control Deck
  - title: Captain's Chair
    icon: fas fa-crosshairs
    items:
      - title: Control Deck
        description: "Command Centre — all tabs: missions, health, intelligence, governance"
        icon: fas fa-map-marked-alt
        url: "http://localhost:8080"
        target: _blank


  # SECTION 2: SERVICE STATUS — live health of running services
  - title: Service Status
    icon: fas fa-heartbeat
    items:
      - title: Ollama LLM
        description: "Local inference engine"
        icon: fas fa-brain
        url: "http://localhost:11434"
        target: _blank
        statusCheck:
          url: "http://localhost:11434/api/tags"
          method: GET
          timeout: 5
          interval: 30

      - title: OpenClaw Chat
        description: "Code execution environment"
        icon: fas fa-flask
        url: "http://localhost:18789"
        target: _blank
        statusCheck:
          url: "http://localhost:18789/"
          method: GET
          timeout: 5
          interval: 30

      - title: Number One (Slack Bot)
        description: "AI Decision Assistant — Start via ./control start slack-bot"
        icon: fab fa-slack
        url: "http://localhost:3001"
        target: _blank

      - title: Command Centre API
        description: "Backend API — port 5050"
        icon: fas fa-satellite
        url: "http://localhost:5050/health"
        target: _blank

      - title: Mission Registry DB
        description: "Supabase — PostgreSQL backend"
        icon: fas fa-database
        url: "https://app.supabase.com/project/cjvrpjwewsrumnbdydgg"
        target: _blank


  # SECTION 3: OPERATIONAL RESILIENCE INTELLIGENCE
  - title: OR Intelligence
    icon: fas fa-shield-alt
    items:
      - title: OR Intelligence Cockpit
        description: "Executive brief, source health, top events"
        icon: fas fa-radar
        url: "/dashboards/or-intelligence.html"
        target: _blank

      - title: Source Health Monitor
        description: "Live status of all intelligence sources — LIVE/STALE/FAILED"
        icon: fas fa-satellite-dish
        url: "/dashboards/or-intelligence.html#source-health"
        target: _blank

      - title: Brief Archive
        description: "Historical OR Intelligence Briefs — searchable and date-filtered"
        icon: fas fa-archive
        url: "/dashboards/or-intelligence.html#archive"
        target: _blank

# End of Configuration
