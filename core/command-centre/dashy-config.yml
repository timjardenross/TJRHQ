---

# Optional: Keyboard shortcuts
keyboardShortcuts:
  - keys: ['c']
    action: OPEN_COMMAND_PALETTE
  - keys: ['?']
    action: OPEN_SETTINGS

# Optional: Custom JS and CSS imports
customCss: |
  @import url('theme-starfleet.css');

customJavaScript: |
  // Future: Custom JavaScript for integrations

# End of Configuration
