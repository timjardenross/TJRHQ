# STARFLEET COMMAND CENTRE
# Dashy v4 Configuration for Starship Endeavour (NCC-170230)
#
# This is the Control Deck Launchpad MVP - a read-only visibility layer
# displaying real-time status of core services and mission-critical systems.
#
# IMPORTANT: This config uses ONLY Dashy v4-supported fields:
# - pageInfo, appConfig, sections, items
# - NO customColors, displayData, statusCheck, statusCheckUrl, etc.

pageInfo:
  title: STARFLEET COMMAND BRIDGE
  description: Starship Endeavour Control Deck (NCC-170230)
  navLinks: []
  logo: /assets/starfleet-logo.svg
  icon: /assets/favicon.svg
  footerText: "Ad Astra Per Aspera | Starship Endeavour NCC-170230 | USS TJR"

appConfig:
  theme: nord
  externalStyleSheet: /theme-starfleet-advanced.css
  layout: grid
  columns: 4
  itemSize: small
  language: en
  showSettings: false
  showAbout: false
  showErrorLog: false

sections:
  # SECTION 1: SERVICE STATUS (Real-time Health via Native Widgets)
  - title: Service Status
    icon: fas fa-heartbeat
    items:
      - title: Ollama LLM
        description: "Local inference engine — Real-time health"
        icon: fas fa-brain
        url: "http://localhost:11434"
        target: _blank
        statusCheck:
          url: "http://localhost:11434/api/tags"
          method: GET
          timeout: 5
          interval: 30

      - title: OpenClaw Chat
        description: "Code execution environment — Real-time health"
        icon: fas fa-flask
        url: "http://localhost:18789"
        target: _blank
        statusCheck:
          url: "http://localhost:18789/"
          method: GET
          timeout: 5
          interval: 30

      - title: Number One (Slack Bot)
        description: "AI Decision Assistant — Start via ./control start slack-bot"
        icon: fab fa-slack
        url: "http://localhost:3001"
        target: _blank

      - title: Command Centre API
        description: "Context Assembly backend — WP6 Express API"
        icon: fas fa-satellite
        url: "http://localhost:8081/"
        target: _blank

      - title: Mission Registry DB
        description: "Supabase — PostgreSQL backend"
        icon: fas fa-database
        url: "https://app.supabase.com/project/cjvrpjwewsrumnbdydgg"
        target: _blank


  # SECTION 2: CAPTAIN EXPERIENCE (Context Assembly Foundation — WP1-9)
  - title: Captain Experience
    icon: fas fa-crosshairs
    items:
      - title: Captain Operating Picture
        description: "5-min view — priorities, health, blockers, Number One advisory"
        icon: fas fa-map-marked-alt
        url: "/dashboards/index.html"
        target: _blank

      - title: Captain Daily Brief
        description: "Full assembled brief — priorities, decisions, blockers, health"
        icon: fas fa-clipboard-list
        url: "/dashboards/commander-operations-brief.html"
        target: _blank

      - title: Top Recommendations
        description: "Number One ranked mission priorities"
        icon: fas fa-sort-amount-down
        url: "/dashboards/index.html"
        target: _blank

      - title: Active Blockers
        description: "Blocked missions sorted by escalation level"
        icon: fas fa-ban
        url: "/dashboards/blocked-missions.html"
        target: _blank

      - title: Decisions Awaiting Captain
        description: "Proposed decisions needing Captain input"
        icon: fas fa-gavel
        url: "/dashboards/decisions-registry.html"
        target: _blank

      - title: Context Assembly Status
        description: "File freshness and adapter health — WP6 monitoring"
        icon: fas fa-satellite-dish
        url: "/dashboards/service-health-widget.html"
        target: _blank


  # SECTION 3: CORE OPERATIONS
  - title: Core Operations
    icon: fas fa-chess-board
    items:
      - title: System Status
        description: "Live snapshot — missions, escalations, work queue, decisions"
        icon: fas fa-tachometer-alt
        url: "/dashboards/system-status.html"
        target: _blank

      - title: Commander Operations Brief
        description: "Mission status, priorities, blocked items (Supabase Live)"
        icon: fas fa-briefcase
        url: "/dashboards/commander-operations-brief.html"
        target: _blank

      - title: Mission Registry
        description: "Active missions, progress tracking (Supabase Live)"
        icon: fas fa-tasks
        url: "/dashboards/mission-registry.html"
        target: _blank

      - title: Decisions Registry
        description: "Architectural decisions & alternatives (Supabase Live)"
        icon: fas fa-sitemap
        url: "/dashboards/decisions-registry.html"
        target: _blank

      - title: Blocked Missions
        description: "Missions with status=blocked (Supabase live filter)"
        icon: fas fa-ban
        url: "/dashboards/blocked-missions.html"
        target: _blank

      - title: Service Health
        description: "Service status — Interim: Control Engine health"
        icon: fas fa-heartbeat
        url: "/dashboards/service-health-widget.html"
        target: _blank

      - title: Escalations
        description: "Active escalations from NUMBER ONE (LIVE/STALE)"
        icon: fas fa-exclamation-triangle
        url: "/dashboards/escalations.html"
        target: _blank

      - title: Work Queue
        description: "Mission work queue — priority ordered (NUMBER ONE)"
        icon: fas fa-list-ol
        url: "/dashboards/work-queue.html"
        target: _blank

      - title: Governance Health
        description: "Decision register metrics (Supabase)"
        icon: fas fa-balance-scale
        url: "/dashboards/governance-health.html"
        target: _blank


  # SECTION 3: HELP & OPERATIONS
  - title: Help & Operations
    icon: fas fa-book
    items:
      - title: Setup Guide
        description: "Getting started & Control Deck startup"
        icon: fas fa-cogs
        url: "https://github.com/timjardenross/USSTJROS/blob/main/core/command-centre/CONTROL-DECK-STARTUP.md"
        target: _blank

      - title: Operations Runbook
        description: "Standard operating procedures & incident response"
        icon: fas fa-book-open
        url: "https://github.com/timjardenross/USSTJROS/blob/main/core/command-centre/OPERATIONS-RUNBOOK.md"
        target: _blank

      - title: ADR Index
        description: "Architectural Decision Record index"
        icon: fas fa-list-alt
        url: "https://github.com/timjardenross/USSTJROS/blob/main/ADRs/README.md"
        target: _blank


  # SECTION 4: DEVELOPER RESOURCES (Not for operational use)
  - title: Developer Resources
    icon: fas fa-terminal
    items:
      - title: USS TJR Monorepo
        description: "GitHub source control & architecture"
        icon: fab fa-github
        url: "https://github.com/timjardenross/USSTJROS"
        target: _blank

      - title: Control Deck CLI
        description: "Service management & startup scripts"
        icon: fas fa-terminal
        url: "https://github.com/timjardenross/USSTJROS/tree/main/core/command"
        target: _blank

# End of Configuration
