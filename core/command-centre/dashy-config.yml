# STARFLEET COMMAND CENTRE
# Dashy v4 Configuration for Starship Endeavour (NCC-170230)
#
# This is the Control Deck Launchpad MVP - a read-only visibility layer
# displaying real-time status of core services and mission-critical systems.
#
# IMPORTANT: This config uses ONLY Dashy v4-supported fields:
# - pageInfo, appConfig, sections, items
# - NO customColors, displayData, statusCheck, statusCheckUrl, etc.

pageInfo:
  title: STARFLEET COMMAND BRIDGE
  description: Starship Endeavour Control Deck (NCC-170230)
  navLinks: []
  logo: /assets/starfleet-logo.svg
  icon: /assets/favicon.svg
  footerText: "Ad Astra Per Aspera | Starship Endeavour NCC-170230 | USS TJR"

appConfig:
  theme: nord
  externalStyleSheet: /theme-starfleet-advanced.css
  layout: grid
  columns: 4
  itemSize: small
  language: en
  showSettings: false
  showAbout: false
  showErrorLog: false

sections:
  # SECTION 1: COMMAND STATUS
  - title: Command Status
    icon: fas fa-shield-alt
    items:
      - title: Starship Endeavour
        description: NCC-170230
        icon: fas fa-rocket
        url: "#"

      - title: Captain TJR
        description: In Command
        icon: fas fa-user-tie
        url: "#"

      - title: Status Operational
        description: Stardate 2026.160
        icon: fas fa-check-circle
        url: "#"

  # SECTION 2: SERVICE STATUS
  - title: Service Status
    icon: fas fa-heartbeat
    items:
      - title: Control Deck
        description: "✅ Operational"
        icon: fas fa-check
        url: "#"

      - title: Ollama LLM
        description: "✅ Operational"
        icon: fas fa-check
        url: "#"

      - title: OpenClaw Chat
        description: "✅ Operational"
        icon: fas fa-check
        url: "#"

      - title: Number One
        description: "⏸ On Demand"
        icon: fas fa-pause
        url: "#"

      - title: Mission Registry UI
        description: "⏳ Pending"
        icon: fas fa-clock
        url: "#"

      - title: Supabase
        description: "🔧 Backend Only"
        icon: fas fa-cog
        url: "#"

  # SECTION 3: CORE OPERATIONS
  - title: Core Operations
    icon: fas fa-chess-board
    items:
      - title: Mission Registry
        description: "Backend Active (Supabase) — UI Pending"
        icon: fas fa-flag
        url: "https://github.com/timjardenross/USSTJROS/tree/main/knowledge/Mission-Management"
        target: _blank

      - title: Number One (Slack Bot)
        description: "On-Demand — Start via ./control start slack-bot"
        icon: fab fa-slack
        url: http://localhost:3001
        target: _blank

      - title: Decision Log
        description: "Architecture decisions & ADRs (GitHub)"
        icon: fas fa-file-alt
        url: "https://github.com/timjardenross/USSTJROS/tree/main/architecture/decisions"
        target: _blank

  # SECTION 4: RECENT MISSIONS
  - title: Recent Missions
    icon: fas fa-tasks
    items:
      - title: M-20260609-000000
        description: "Control Deck Launchpad v1.1"
        icon: fas fa-check-circle
        url: "#"

      - title: MSN-0040A-WP2
        description: "Integration & Automation"
        icon: fas fa-cogs
        url: "#"

      - title: MSN-0035
        description: "Strategic Initiative"
        icon: fas fa-star
        url: "#"

  # SECTION 5: RUNTIME SERVICES
  - title: Runtime Services
    icon: fas fa-server
    items:
      - title: Ollama LLM
        description: "Local inference (localhost:11434) 🟢"
        icon: fas fa-brain
        url: http://localhost:11434
        target: _blank

      - title: Supabase Database
        description: "📋 Database port (5432) — See operations docs"
        icon: fas fa-database
        url: "#"

      - title: OpenClaw Chat
        description: "Code execution chat (localhost:18789) ✅"
        icon: fas fa-flask
        url: "http://localhost:18789/chat?session=agent%3Amain%3Amain"
        target: _blank

  # SECTION 6: DOCUMENTATION
  - title: Documentation
    icon: fas fa-book
    items:
      - title: Architecture Decisions
        description: "System design & ADRs (GitHub)"
        icon: fas fa-scroll
        url: "https://github.com/timjardenross/USSTJROS/tree/main/knowledge/architecture"
        target: _blank

      - title: API Reference
        description: "📋 Coming Soon — API docs in development"
        icon: fas fa-code
