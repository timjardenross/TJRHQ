# STARFLEET COMMAND CENTRE
# Dashy Configuration for Starship Endeavour (NCC-170230)
#
# This configuration file defines the command centre interface
# for STARFLEET COMMAND operations.

---
pageInfo:
  title: STARFLEET COMMAND
  description: Starship Endeavour Command Centre (NCC-170230)
  navBarExlinks: false
  footer: "Ad Astra Per Aspera | Starship Endeavour | NCC-170230"
  footerText: "STARFLEET COMMAND | Captain TJR | Executive Officer"
  logo: /assets/starfleet-logo.svg
  icon: /assets/favicon.ico
  customColors: true

# Appearance Configuration
appConfig:
  theme: starfleet-dark
  layout: grid
  iconSize: medium
  language: en
  startingView: default
  statusCheck: true
  statusCheckInterval: 60
  faviconApi: fontawesome
  showSplashScreen: false
  enableLocalStorage: true

# Search and Navigation
searchSettings:
  searchEngine: google
  searchBannerPos: top
  openSectionInModal: false

---

# SECTION 1: COMMAND
sections:
  - name: COMMAND
    icon: fas fa-shield-alt
    displayData:
      rows: 2
      cols: 3
    items:
      - title: Mission Registry
        description: Active missions and status
        icon: fas fa-flag
        url: /missions
        statusCheck: true
        statusCheckUrl: http://localhost:5000/api/missions/status
        hotkey: M
        target: sameTab

      - title: Mission Queue
        description: Number One work queue
        icon: fas fa-tasks
        url: /missions/queue
        statusCheck: true
        statusCheckUrl: http://localhost:5000/api/number-one/queue
        hotkey: Q
        target: sameTab

      - title: Executive Officer
        description: XO escalations and decisions
        icon: fas fa-chess-rook
        url: /xo-dashboard
        statusCheck: false
        hotkey: X
        target: sameTab

      - title: Number One Coordination
        description: Daily briefing and coordination
        icon: fas fa-brain
        url: /number-one
        statusCheck: true
        statusCheckUrl: http://localhost:5000/api/number-one/brief
        hotkey: N
        target: sameTab

      - title: GitHub
        description: Repository and commits
        icon: fab fa-github
        url: https://github.com/timjarden-ross/USSTJROS
        statusCheck: true
        statusCheckUrl: https://api.github.com/repos/timjarden-ross/USSTJROS
        hotkey: G
        target: newtab

      - title: Decision Log
        description: Captured decisions
        icon: fas fa-file-alt
        url: /decisions
        statusCheck: false
        hotkey: D
        target: sameTab

# SECTION 2: OPERATIONS
  - name: OPERATIONS
    icon: fas fa-cogs
    displayData:
      rows: 2
      cols: 3
    items:
      - title: Slack Commander
        description: Slack bot and command interface
        icon: fab fa-slack
        url: https://slack.com
        statusCheck: true
        statusCheckUrl: https://slack.com
        hotkey: S
        target: newtab

      - title: Workflow Engine
        description: Workflow status and management
        icon: fas fa-sitemap
        url: /workflows
        statusCheck: false
        hotkey: W
        target: sameTab

      - title: Supabase Console
        description: Database and API management
        icon: fas fa-database
        url: https://supabase.com
        statusCheck: true
        statusCheckUrl: https://supabase.com
        hotkey: U
        target: newtab

      - title: OpenClaw
        description: GitHub integration and automation
        icon: fab fa-github
        url: /github-integration
        statusCheck: false
        hotkey: O
        target: sameTab

      - title: Semantic Router
        description: Request routing and specialist assignment
        icon: fas fa-project-diagram
        url: /semantic-router
        statusCheck: false
        hotkey: R
        target: sameTab

      - title: System Status
        description: Overall system health
        icon: fas fa-heartbeat
        url: /system-status
        statusCheck: true
        statusCheckUrl: http://localhost:5000/api/system/health
        hotkey: H
        target: sameTab

# SECTION 3: SCIENCE DIVISION
  - name: SCIENCE DIVISION
    icon: fas fa-flask
    displayData:
      rows: 2
      cols: 3
