# STARFLEET COMMAND CENTRE
# Dashy v4 Configuration for Starship Endeavour (NCC-170230)
#
# This is the Control Deck Launchpad MVP - a read-only visibility layer
# displaying real-time status of core services and mission-critical systems.
#
# IMPORTANT: This config uses ONLY Dashy v4-supported fields:
# - pageInfo, appConfig, sections, items
# - NO customColors, displayData, statusCheck, statusCheckUrl, etc.

pageInfo:
  title: STARFLEET COMMAND BRIDGE
  description: Starship Endeavour Control Deck (NCC-170230)
  navLinks: []
  logo: /assets/starfleet-logo.svg
  icon: /assets/favicon.svg
  footerText: "Ad Astra Per Aspera | Starship Endeavour NCC-170230 | USS TJR"

appConfig:
  theme: nord
  layout: grid
  columns: 4
  itemSize: small
  language: en
  showSettings: false
  showAbout: false
  showErrorLog: false

sections:
  # SECTION 1: COMMAND STATUS
  - title: Command Status
    icon: fas fa-shield-alt
    items:
      - title: Starship Endeavour
        description: NCC-170230
        icon: fas fa-rocket
        url: "#"

      - title: Captain TJR
        description: In Command
        icon: fas fa-user-tie
        url: "#"

      - title: Status Operational
        description: Stardate 2026.160
        icon: fas fa-check-circle
        url: "#"

  # SECTION 2: CORE OPERATIONS
  - title: Core Operations
    icon: fas fa-chess-board
    items:
      - title: Mission Registry
        description: "📋 Planned Capability — Service not yet verified"
        icon: fas fa-flag
        url: "#"

      - title: Number One (Slack Bot)
        description: "On-Demand — Start via ./control start slack-bot"
        icon: fab fa-slack
        url: http://localhost:3001
        target: _blank

      - title: Decision Log
        description: "Architecture decisions & ADRs (GitHub)"
        icon: fas fa-file-alt
        url: "https://github.com/timjardenross/USSTJROS/tree/main/docs/decisions"
        target: _blank

  # SECTION 3: RUNTIME SERVICES
  - title: Runtime Services
    icon: fas fa-server
    items:
      - title: Ollama LLM
        description: "Local inference (localhost:11434) 🟢"
        icon: fas fa-brain
        url: http://localhost:11434
        target: _blank

      - title: Supabase Database
        description: "📋 Database port (5432) — See operations docs"
        icon: fas fa-database
        url: "#"

      - title: OpenClaw Sandbox
        description: "Code execution chat (localhost:18789) ✅"
        icon: fas fa-flask
        url: "http://localhost:18789/chat?session=agent%3Amain%3Amain"
        target: _blank

  # SECTION 4: DOCUMENTATION
  - title: Documentation
    icon: fas fa-book
    items:
      - title: Architecture Decisions
        description: "System design & ADRs (GitHub)"
        icon: fas fa-scroll
        url: "https://github.com/timjardenross/USSTJROS/tree/main/docs"
        target: _blank

      - title: API Reference
        description: "REST API documentation (GitHub)"
        icon: fas fa-code
        url: "https://github.com/timjardenross/USSTJROS/tree/main/docs/api"
        target: _blank

      - title: Setup Guide
        description: "Getting started & deployment (GitHub)"
        icon: fas fa-cogs
        url: "https://github.com/timjardenross/USSTJROS/blob/main/core/command-centre/CONTROL-DECK-STARTUP.md"
        target: _blank

  # SECTION 5: DEVELOPMENT
  - title: Development
    icon: fas fa-terminal
    items:
      - title: Main Repository
        description: "USS TJR monorepo (GitHub)"
        icon: fab fa-github
        url: "https://github.com/timjardenross/USSTJROS"
        target: _blank

      - title: Control Deck Foundation
        description: "Service CLI source (GitHub)"
        icon: fas fa-terminal
        url: "https://github.com/timjardenross/USSTJROS/tree/main/core/control"
        target: _blank

      - title: Control Deck Launchpad
        description: "This dashboard source (GitHub)"
        icon: fas fa-dashboard
        url: "https://github.com/timjardenross/USSTJROS/tree/main/core/command-centre"
        target: _blank

# End of Configuration
