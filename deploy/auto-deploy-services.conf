# Long-running daemons auto-deploy.sh restarts unconditionally on any
# successful `git pull` (see that script's header for why unconditional,
# rather than trying to map changed file paths to services). One unit name
# per line; `#` starts a comment; blank lines ignored.
#
# Verified 2026-09-07 against a real `systemctl list-units --type=service
# --all` run on the production VM. Confirmed live drift from this repo's
# deploy/*.service filenames: deploy/xo-bot.service names a unit that isn't
# what runs (the live one is tg-xo.service) and deploy/revs-bot.service
# likewise (the live one is tg-revs.service) — both entries below already
# use the confirmed-live name, not the repo filename. Also confirmed: no
# "starfleet-slack-bot.service" is installed on this VM at all, despite
# telegram-bots/xo/app.py's own /restart_bots command referencing it — not
# added here since restarting a unit that doesn't exist would be a no-op
# anyway, and this list is about what to restart, not that separate finding.
#
# 2026-09-08: self-improvement-dashboard.service (the scripts/self_improvement/
# dashboard.py Flask API, port 8892) was missing from this list entirely,
# confirmed live: after PR #62 added /api/engineering-handoffs/artifact,
# the Captain hit a real 404 from Flask's own default error page (not a
# Caddy/proxy error — the process had genuinely never restarted since
# before that route was added, though every older route kept working
# fine). systemctl confirmed the unit's real name matches this repo's own
# deploy/self-improvement-dashboard.service — no drift this time, just a
# missing entry.
#
# If a future service gets added or renamed, re-verify with:
#   systemctl list-units --type=service --all | grep -iE \
#     'starship|xo|revs|context|model-router|mint|lcars|intelligence|self-improv'
# A wrong/stale name here just logs a warning in auto-deploy.sh and is
# otherwise harmless (it never restarts a differently-named unit by
# mistake) — but it also means that service silently never gets new code
# until this list is corrected.

context-service.service
intelligence-scheduler.service
mint-server.service
model-router.service
self-improvement-dashboard.service
tg-revs.service
tg-xo.service

# lcars-portal.service is handled separately in auto-deploy.sh (it needs a
# rebuild, not just a restart) — do not add it here too.
