# Long-running daemons auto-deploy.sh restarts unconditionally on any
# successful `git pull` (see that script's header for why unconditional,
# rather than trying to map changed file paths to services). One unit name
# per line; `#` starts a comment; blank lines ignored.
#
# IMPORTANT — verify every name below against THIS VM's actual running
# units before trusting this list, don't assume this repo's deploy/*.service
# filenames are what's really installed. Confirmed live drift found
# 2026-09-07 while building this: deploy/xo-bot.service is the file in
# this repo, but telegram-bots/xo/app.py's own /restart_bots command
# targets "tg-xo.service" instead — a different name for what is
# presumably the same bot. Likewise that same command references a live
# "starfleet-slack-bot.service" that has NO matching file anywhere in
# deploy/ at all. Both point at real, ongoing skew between this repo's
# deploy/ directory and what actually runs on the VM.
#
# Run on the VM to get the ground truth, then correct this list to match:
#   systemctl list-units --type=service --all | grep -iE \
#     'starship|xo|revs|context|model-router|mint|lcars|intelligence'
#
# Entries below are this repo's best-guess starting point (deploy/*.service
# filenames, corrected for the one drift confirmed above) — NOT independently
# confirmed against a live systemctl listing. A wrong/stale name here just
# logs a warning in auto-deploy.sh and is otherwise harmless (it never
# restarts a differently-named unit by mistake) — but it also means that
# service silently never gets new code until this list is corrected.

context-service.service
intelligence-scheduler.service
mint-server.service
model-router.service
revs-bot.service

# Confirmed live name is tg-xo.service, NOT the xo-bot.service filename
# this repo's deploy/xo-bot.service would suggest — see header above.
tg-xo.service

# lcars-portal.service is handled separately in auto-deploy.sh (it needs a
# rebuild, not just a restart) — do not add it here too.
